<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --sidebar: #121212; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* Login */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; width: 300px; text-align: center; }
        .logo-te { font-size: 2.2rem; font-weight: bold; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }

        /* Sidebar (Liste d'amis) */
        #sidebar { width: 350px; background: var(--sidebar); border-right: 1px solid #222; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .search-bar { padding: 10px 20px; }
        .search-bar input { width: 100%; background: #222; border: none; padding: 10px; border-radius: 10px; color: white; outline: none; }
        
        #friends-list { flex: 1; overflow-y: auto; }
        .friend-item { padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #1a1a1a; }
        .friend-item:hover { background: #1a1a1a; }
        .friend-avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; object-fit: cover; }
        .friend-info { flex: 1; }
        .friend-name { font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .last-msg { font-size: 0.85rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

        /* Zone de Chat */
        #main-chat { flex: 1; display: none; flex-direction: column; background: #000; }
        header { padding: 10px 20px; height: 60px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 70%; position: relative; }
        .my-msg { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 5px; }

        #input-area { padding: 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #222; }
        .input-box { flex: 1; background: #1a1a1a; border-radius: 25px; padding: 10px 15px; display: flex; }
        #message-input { background: transparent; border: none; color: white; flex: 1; outline: none; }

        /* Appel Vidéo Overlay */
        #call-screen { display:none; position:fixed; inset:0; background:#000; z-index:3000; }
        #local-video { position:absolute; bottom:30px; right:20px; width:120px; height:180px; border-radius:15px; border:2px solid #fff; object-fit: cover; z-index: 10; }
        #remote-video { width:100%; height:100%; object-fit: cover; }

        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            #main-chat { position: fixed; inset: 0; z-index: 100; }
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="logo-te">Threndly ✅</div>
    <div class="auth-card">
        <input type="text" id="user-id" class="auth-input" placeholder="Ton nom">
        <input type="password" id="user-pass" class="auth-input" placeholder="Mot de passe">
        <button class="btn-main" onclick="handleAuth()">Entrer ✅</button>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <div class="logo-te" style="font-size: 1.5rem; margin:0;">Threndly ✅</div>
        <i class="fas fa-sign-out-alt" onclick="logout()" style="cursor:pointer"></i>
    </div>
    <div class="search-bar">
        <input type="text" placeholder="Rechercher ou démarrer...">
    </div>
    <div id="friends-list">
        </div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-left" onclick="closeChat()" style="cursor:pointer; display:none;" id="back-btn"></i>
            <img src="" id="chat-avatar" style="width:40px; height:40px; border-radius:50%; display:none;">
            <div id="chat-name" style="font-weight:bold;"></div>
        </div>
        <div style="display:flex; gap:20px; color:#888;">
            <i class="fas fa-phone" onclick="startCall('audio')" style="cursor:pointer"></i>
            <i class="fas fa-video" onclick="startCall('video')" style="cursor:pointer"></i>
        </div>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <label for="img-input" style="color:#888; font-size:1.3rem; cursor:pointer"><i class="far fa-image"></i></label>
        <input type="file" id="img-input" hidden accept="image/*" onchange="sendPhoto(this)">
        <div class="input-box">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        <button onclick="sendMsg()" style="background:var(--grad); border:none; width:40px; height:40px; border-radius:50%; color:white;"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<div id="call-screen">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
    <div style="position:absolute; bottom:40px; left:50%; transform:translateX(-50%); display:flex; gap:20px;">
        <button onclick="endCall()" style="background:#ff4444; border:none; padding:15px; border-radius:50%; color:white; font-size:1.5rem;"><i class="fas fa-phone-slash"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myUser = localStorage.getItem('threndly_user') || "";
    let activeChat = "";

    if(myUser) login(myUser);

    function handleAuth() {
        const name = document.getElementById('user-id').value.trim();
        if(name) login(name);
    }

    function login(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        
        // --- NOUVEAU : On s'enregistre pour être suggéré aux autres ---
        db.ref("all_users/" + name).set({ name: name });
        
        loadFriends();
    }

    function loadFriends() {
        const list = document.getElementById('friends-list');
        
        // 1. Tes amis statiques que tu aimes
        const friends = [
            { name: "Joselyna", last: "zahay zaza jiajy...", img: "https://i.pravatar.cc/150?u=jos" },
            { name: "Nelly", last: "okay havy agny z...", img: "https://i.pravatar.cc/150?u=nel" },
            { name: "Arthur💸", last: "on peut parler sur...", img: "https://i.pravatar.cc/150?u=art" },
            { name: "Lebien", last: "📷 4 photos", img: "https://i.pravatar.cc/150?u=leb" }
        ];

        list.innerHTML = "";
        friends.forEach(f => {
            const div = document.createElement('div');
            div.className = 'friend-item';
            div.onclick = () => openChat(f.name, f.img);
            div.innerHTML = `
                <img src="${f.img}" class="friend-avatar">
                <div class="friend-info">
                    <div class="friend-name">${f.name} <i class="fas fa-check-circle" style="color:var(--cyan); font-size:0.7rem"></i></div>
                    <div class="last-msg">${f.last}</div>
                </div>
            `;
            list.appendChild(div);
        });

        // --- NOUVEAU : On ajoute les suggestions en dessous ---
        const sugTitle = document.createElement('div');
        sugTitle.innerHTML = `<div style="padding:15px; font-size:0.7rem; color:#555; text-transform:uppercase;">Suggestions d'amis</div>`;
        list.appendChild(sugTitle);

        db.ref("all_users").on("value", snap => {
            snap.forEach(child => {
                const u = child.val();
                // On n'affiche pas les gens déjà dans ta liste statique, ni toi-même
                const isExisting = friends.some(f => f.name === u.name);
                if(u.name !== myUser && !isExisting) {
                    const div = document.createElement('div');
                    div.className = 'friend-item';
                    div.innerHTML = `
                        <img src="https://i.pravatar.cc/150?u=${u.name}" class="friend-avatar">
                        <div class="friend-info">
                            <div class="friend-name">${u.name} <i class="fas fa-check-circle" style="color:#555; font-size:0.7rem"></i></div>
                            <div class="last-msg">Nouveau sur Threndly</div>
                        </div>
                        <button onclick="addFriend(event, '${u.name}')" style="background:var(--grad); border:none; color:white; padding:5px 10px; border-radius:15px; font-size:0.7rem; cursor:pointer;">Ajouter +</button>
                    `;
                    list.appendChild(div);
                }
            });
        });
    }

    function addFriend(e, name) {
        e.stopPropagation();
        alert(name + " a été ajouté ! (Il apparaîtra dans tes discussions bientôt)");
        // Ici on pourrait l'ajouter à une liste "mes_amis" dans Firebase
    }

    // Le reste de tes fonctions (openChat, sendMsg, loadMessages, logout) reste IDENTIQUE
    function openChat(name, img) {
        activeChat = name;
        document.getElementById('main-chat').style.display = 'flex';
        document.getElementById('chat-name').innerText = name;
        document.getElementById('chat-avatar').src = img;
        document.getElementById('chat-avatar').style.display = 'block';
        if(window.innerWidth < 768) document.getElementById('back-btn').style.display = 'block';
        loadMessages();
    }

    function closeChat() { document.getElementById('main-chat').style.display = 'none'; }

    function sendMsg() {
        const text = document.getElementById('message-input').value;
        if(text && activeChat) {
            db.ref("chats/" + activeChat).push({ from: myUser, text: text, type: 'text' });
            document.getElementById('message-input').value = "";
        }
    }

    function loadMessages() {
        const box = document.getElementById('chat-box');
        box.innerHTML = "";
        db.ref("chats/" + activeChat).off();
        db.ref("chats/" + activeChat).on("child_added", snap => {
            const m = snap.val();
            const div = document.createElement('div');
            div.className = `msg ${m.from === myUser ? 'my-msg' : 'other-msg'}`;
            div.innerHTML = m.type === 'image' ? `<img src="${m.text}">` : m.text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    }

    function logout() { localStorage.removeItem('threndly_user'); location.reload(); }
</script>
</body>
</html>
