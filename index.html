<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --violet-p: #9c27b0; --pink-notif: #ff3b5c; --blue-cert: #20d5ec; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: white; overflow: hidden; height: 100%; width: 100%; }

        /* --- PAGES --- */
        .page { display: none; height: calc(100% - 60px); width: 100%; overflow-y: auto; }
        .active-page { display: flex; flex-direction: column; }

        /* --- PAGE MESSAGES [FÉLICITATIONS, ELLE EST PRÊTE] --- */
        #page-messages { background: white; color: black; }
        .header-msg { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #f0f0f0; align-items: center; }
        .msg-item { display: flex; align-items: center; padding: 12px 15px; gap: 12px; cursor: pointer; }
        .badge-red { background: var(--pink-notif); color: white; font-size: 11px; font-weight: bold; min-width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: auto; }

        /* --- PAGE PROFIL [NOUVEAU] --- */
        #page-profile { background: white; color: black; }
        .profile-header { padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
        .profile-pic { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--blue-cert); padding: 3px; object-fit: cover; }
        .profile-name { font-size: 18px; font-weight: bold; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .stats-bar { display: flex; justify-content: space-around; padding: 15px 0; border-bottom: 1px solid #eee; }
        .stat-item { text-align: center; }
        .stat-item b { display: block; font-size: 16px; }
        .stat-item span { font-size: 12px; color: gray; }
        
        /* GRILLE DE PHOTOS */
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
        .grid-item { aspect-ratio: 1/1; background: #eee; background-size: cover; background-position: center; }

        /* --- BARRE DE NAVIGATION --- */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: white; font-size: 22px; position: relative; opacity: 0.6; cursor: pointer; }
        .nav-item.active { opacity: 1; }
    </style>
</head>
<body>

    <div id="page-messages" class="page active-page">
        <div class="header-msg">
            <i class="fas fa-users"></i>
            <b>Messages <span style="color:#2ecc71">•</span></b>
            <i class="fas fa-search"></i>
        </div>
        <div id="contact-list">
            </div>
    </div>

    <div id="page-profile" class="page">
        <div class="profile-header">
            <img src="https://i.pravatar.cc/150?u=threndly" class="profile-pic">
            <div class="profile-name">
                Threndly 
                <i class="fas fa-check-circle" style="color: var(--blue-cert);"></i>
            </div>
            <p style="font-size: 13px; color: gray;">Compte Officiel Certifié</p>
            <button style="width: 80%; padding: 8px; border-radius: 5px; border: 1px solid #ddd; background: #fafafa; font-weight: bold;">Modifier le profil</button>
        </div>
        <div class="stats-bar">
            <div class="stat-item"><b>12.5k</b><span>Abonnés</span></div>
            <div class="stat-item"><b>450</b><span>Abonnements</span></div>
            <div class="stat-item"><b>1.2M</b><span>J'aime</span></div>
        </div>
        <div class="photo-grid">
            <div class="grid-item" style="background-image: url('https://picsum.photos/200/200?sig=1')"></div>
            <div class="grid-item" style="background-image: url('https://picsum.photos/200/200?sig=2')"></div>
            <div class="grid-item" style="background-image: url('https://picsum.photos/200/200?sig=3')"></div>
            <div class="grid-item" style="background-image: url('https://picsum.photos/200/200?sig=4')"></div>
            <div class="grid-item" style="background-image: url('https://picsum.photos/200/200?sig=5')"></div>
            <div class="grid-item" style="background-image: url('https://picsum.photos/200/200?sig=6')"></div>
        </div>
    </div>

    <div class="nav-bottom">
        <i class="fas fa-home nav-item" onclick="switchPage('home')"></i>
        <i class="fas fa-search nav-item"></i>
        <div style="background:linear-gradient(to right, #20d5ec, var(--violet-p)); padding:5px 15px; border-radius:8px;"><b>+</b></div>
        <i id="nav-msg" class="fas fa-envelope nav-item active" onclick="switchPage('messages')"></i>
        <i id="nav-prof" class="fas fa-user nav-item" onclick="switchPage('profile')"></i>
    </div>

    <script>
        const contacts = [
            { id: 1, name: "Norah Nelsie", img: "https://i.pravatar.cc/100?u=1", last: "ilbsdkjbiqsUHdmbqs", count: 1 },
            { id: 2, name: "Hadriel 🇲🇬", img: "https://i.pravatar.cc/100?u=2", last: "Ça va toi ?", count: 1 }
        ];

        function renderMessages() {
            const list = document.getElementById('contact-list');
            list.innerHTML = "";
            contacts.forEach(c => {
                list.innerHTML += `
                    <div class="msg-item">
                        <img src="${c.img}" style="width:48px;height:48px;border-radius:50%;">
                        <div><b>${c.name}</b><br><small style="color:gray">${c.last}</small></div>
                        ${c.count > 0 ? `<div class="badge-red">${c.count}</div>` : ''}
                    </div>`;
            });
        }

        function switchPage(pageId) {
            // Cacher toutes les pages
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            // Afficher la page choisie
            if(pageId === 'messages') {
                document.getElementById('page-messages').classList.add('active-page');
                document.getElementById('nav-msg').classList.add('active');
                renderMessages();
            } else if (pageId === 'profile') {
                document.getElementById('page-profile').classList.add('active-page');
                document.getElementById('nav-prof').classList.add('active');
            }
        }

        // Initialisation
        renderMessages();
    </script>
</body>
</html>
