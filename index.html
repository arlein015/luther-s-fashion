<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendly - Messages</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f2f3f7;
      color: #333;
    }
    header {
      background: #fff;
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }
    /* Stories */
    .stories {
      display: flex;
      overflow-x: auto;
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    .story {
      flex: 0 0 auto;
      margin-right: 15px;
      text-align: center;
      font-size: 12px;
    }
    .story img {
      width: 65px; height: 65px;
      border-radius: 50%;
      border: 3px solid #4a90e2;
      margin-bottom: 5px;
    }
    /* Notifications */
    .notifications {
      background: #fff;
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }
    .notifications div {
      margin-bottom: 8px;
    }
    .notifications strong {
      color: #4a90e2;
    }
    /* Conversations */
    .conversation-list {
      background: #fff;
      margin-top: 10px;
    }
    .conversation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .conversation:hover {
      background: #f9f9f9;
    }
    .conversation-info {
      display: flex;
      flex-direction: column;
    }
    .conversation strong {
      font-size: 15px;
    }
    .conversation span {
      font-size: 13px;
      color: #666;
    }
    .conversation-time {
      font-size: 12px;
      color: #999;
    }
    /* Fenêtre de chat */
    #chat-window {
      background: #fff;
      padding: 15px;
      border-top: 1px solid #ddd;
      display: none;
      flex-direction: column;
    }
    #messages {
      min-height: 150px;
      margin-bottom: 15px;
    }
    .message {
      background: #e6f0ff;
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: 15px;
      max-width: 70%;
    }
    form {
      display: flex;
      gap: 10px;
    }
    form input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    form button {
      padding: 8px 12px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    /* Navigation */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    footer div {
      text-align: center;
      font-size: 13px;
      color: #4a90e2;
      cursor: pointer;
      position: relative;
    }
    .notif {
      background: red;
      color: white;
      font-size: 10px;
      border-radius: 50%;
      padding: 2px 6px;
      position: absolute;
      top: -5px; right: -10px;
    }
  </style>
</head>
<body>
  <header>Messages</header>

  <!-- Stories -->
  <div class="stories">
    <div class="story"><img src="avatar1.png" alt="Murah"><div>Murah</div></div>
    <div class="story"><img src="avatar2.png" alt="Norah"><div>Norah</div></div>
    <div class="story"><img src="avatar3.png" alt="Aina"><div>Aina</div></div>
    <div class="story"><img src="avatar4.png" alt="Wichouu"><div>Wichouu</div></div>
  </div>

  <!-- Notifications -->
  <div class="notifications">
    <div><strong>Nouveaux followers :</strong> Hardy Jurcia a commencé à te suivre (10)</div>
    <div><strong>Activité :</strong> Clau🦋 a répondu à ton commentaire (21)</div>
    <div><strong>Demandes de messages :</strong> Tu as reçu 4 demandes</div>
  </div>

  <!-- Conversations -->
  <div class="conversation-list" id="conversations"></div>

  <!-- Fenêtre de chat -->
  <div id="chat-window">
    <h3 id="chat-title"></h3>
    <div id="messages"></div>
    <form id="message-form">
      <input type="text" id="message-input" placeholder="Écrire un message..." required>
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <!-- Navigation -->
  <footer>
    <div>🏠 Accueil</div>
    <div>👥 Ami(e)s <span class="notif">65</span></div>
    <div>➕</div>
    <div>💬 Messages <span class="notif">42</span></div>
    <div>👤 Profil</div>
  </footer>

  <script>
    const conversations = [
      { id: 1, name: "Murah Camayo 🍭", messages: ["Salut !", "Tu bosses sur Trendly ?"], time: "59 min" },
      { id: 2, name: "Espérée", messages: ["Efa tampitra"], time: "1 j" },
      { id: 3, name: "personne", messages: ["Dis bonjour à personne"], time: "" },
      { id: 4, name: "Haëckel 🇲🇬", messages: ["Ça va toi ?"], time: "6 j" },
      { id: 5, name: "Gladys", messages: ["Demande de message acceptée"], time: "6 j" }
    ];

    const convContainer = document.getElementById("conversations");
    const chatWindow = document.getElementById("chat-window");
    const chatTitle = document.getElementById("chat-title");
    const messagesContainer = document.getElementById("messages");
    const form = document.getElementById("message-form");
    const input = document.getElementById("message-input");

    let currentConv = null;

    // Afficher la liste des conversations
    conversations.forEach(conv => {
      const div = document.createElement("div");
      div.className = "conversation";
      div.innerHTML = `
        <div class="conversation-info">
          <strong>${conv.name}</strong>
          <span>${conv.messages[conv.messages.length - 1]}</span>
        </div>
        <div class="conversation-time">${conv.time}</div>
      `;
      div.addEventListener("click", () => openConversation(conv));
      convContainer.appendChild(div);
    });

    function openConversation(conv) {
      currentConv = conv;
      chatTitle.textContent = `Conversation avec ${conv.name}`;
      messagesContainer.innerHTML = "";
      conv.messages.forEach(msg => {
        const div = document.createElement("div");
        div.className = "message";
        div.textContent = msg;
        messagesContainer.appendChild(div);
      });
      chatWindow.style.display = "flex";
    }

    // Envoyer un nouveau message
    form.addEventListener("submit", e => {
      e.preventDefault();
      if (!currentConv) return;
      const newMsg = input.value;
      currentConv.messages.push(newMsg);

      const div = document.createElement("div");
      div.className = "message";
      div.textContent = newMsg;
      messagesContainer.appendChild(div);

      input.value = "";
    });
  </script>
</body>
</html>
