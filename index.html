<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --sidebar: #0a0a0a; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* Écran de connexion - LOGO XXL */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-img-large { width: 220px; margin-bottom: 35px; transition: 0.3s; }

        /* Sidebar AJUSTÉE (280px) */
        #sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-img-small { height: 55px; width: auto; object-fit: contain; } /* Logo sidebar plus gros */

        #friends-list { flex: 1; overflow-y: auto; }
        .friend-item { padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #111; transition: 0.2s; }
        .friend-item:hover { background: #111; }
        .friend-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid #222; }
        .friend-name { font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 5px; }

        /* Zone de Chat LARGE */
        #main-chat { flex: 1; display: none; flex-direction: column; background: #000; }
        header { padding: 12px 20px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; background: #050505; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 75%; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .my-msg { align-self: flex-end; background: var(--grad); color: white; border-bottom-right-radius: 4px; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 12px; margin-top: 5px; display: block; }

        /* Barre d'envoi */
        #input-area { padding: 15px 25px; display: flex; align-items: center; gap: 15px; border-top: 1px solid #1a1a1a; background: #050505; }
        .input-container { flex: 1; background: #1a1a1a; border-radius: 25px; padding: 12px 20px; }
        #message-input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 1rem; }
        .send-btn { background: var(--grad); border: none; width: 45px; height: 45px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .send-btn:active { transform: scale(0.9); }

        @media (max-width: 600px) {
            #sidebar { width: 90px; } 
            .friend-name, .sidebar-header i { display: none; }
            .logo-img-small { height: 40px; }
            .logo-img-large { width: 180px; }
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <img src="logo.png" class="logo-img-large">
    <div style="background: #111; padding: 30px; border-radius: 25px; width: 300px; text-align: center; border: 1px solid #222; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <input type="text" id="user-id" placeholder="Ton nom" style="width:100%; padding:14px; margin-bottom:20px; border-radius:12px; border:none; background:#1a1a1a; color:white; box-sizing:border-box; font-size: 1rem;">
        <button onclick="handleAuth()" style="background:var(--grad); border:none; padding:14px; border-radius:25px; color:white; width:100%; font-weight:bold; cursor:pointer; font-size: 1rem;">Se connecter ✅</button>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <img src="logo.png" class="logo-img-small">
        <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#555; cursor:pointer; font-size: 1.2rem;"></i>
    </div>
    <div id="friends-list"></div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:15px;">
            <img src="" id="chat-avatar" style="width:42px; height:42px; border-radius:50%; border: 1px solid #333;">
            <div id="chat-name" style="font-weight:bold; font-size: 1.1rem;"></div>
        </div>
        <div style="display:flex; gap:25px; color:#666; font-size: 1.2rem;">
            <i class="fas fa-phone" style="cursor:pointer"></i>
            <i class="fas fa-video" style="cursor:pointer"></i>
        </div>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <label for="img-input"><i class="far fa-image" style="color:#888; font-size:1.6rem; cursor:pointer;"></i></label>
        <input type="file" id="img-input" hidden accept="image/*" onchange="sendPhoto(this)">
        <div class="input-container">
            <input type="text" id="message-input" placeholder="Écris ton message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        <button class="send-btn" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myUser = localStorage.getItem('threndly_user') || "";
    let activeChat = "";

    if(myUser) login(myUser);

    function handleAuth() {
        const name = document.getElementById('user-id').value.trim();
        if(name) login(name);
    }

    function login(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        loadFriends();
    }

    function loadFriends() {
        const list = document.getElementById('friends-list');
        const friends = [
            { name: "Joselyna", img: "https://i.pravatar.cc/150?u=jos" },
            { name: "Nelly", img: "https://i.pravatar.cc/150?u=nel" },
            { name: "Arthur💸", img: "https://i.pravatar.cc/150?u=art" },
            { name: "Lebien", img: "https://i.pravatar.cc/150?u=leb" }
        ];

        list.innerHTML = "";
        friends.forEach(f => {
            const div = document.createElement('div');
            div.className = 'friend-item';
            div.onclick = () => openChat(f.name, f.img);
            div.innerHTML = `
                <img src="${f.img}" class="friend-avatar">
                <div class="friend-name">${f.name} <i class="fas fa-check-circle" style="color:var(--cyan); font-size:0.7rem"></i></div>
            `;
            list.appendChild(div);
        });
    }

    function openChat(name, img) {
        activeChat = name;
        document.getElementById('main-chat').style.display = 'flex';
        document.getElementById('chat-name').innerText = name;
        document.getElementById('chat-avatar').src = img;
        loadMessages();
    }

    function sendMsg() {
        const input = document.getElementById('message-input');
        if(input.value.trim() && activeChat) {
            db.ref("chats/" + activeChat).push({ from: myUser, text: input.value, type: 'text' });
            input.value = "";
        }
    }

    function sendPhoto(input) {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            db.ref("chats/" + activeChat).push({ from: myUser, text: e.target.result, type: 'image' });
        };
        reader.readAsDataURL(file);
    }

    function loadMessages() {
        const box = document.getElementById('chat-box');
        db.ref("chats/" + activeChat).off();
        box.innerHTML = "";
        db.ref("chats/" + activeChat).on("child_added", snap => {
            const m = snap.val();
            const div = document.createElement('div');
            div.className = `msg ${m.from === myUser ? 'my-msg' : 'other-msg'}`;
            
            if (m.text.startsWith('data:image')) {
                div.innerHTML = `<img src="${m.text}">`;
            } else {
                div.innerText = m.text;
            }
            
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    }

    function logout() { localStorage.removeItem('threndly_user'); location.reload(); }
</script>
</body>
</html>
