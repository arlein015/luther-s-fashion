<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Boutique Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: #fff; color: #000; overflow-x: hidden; }

        /* --- LIVRAISON GRATUITE --- */
        .top-promo { background: #000; color: #fff; text-align: center; padding: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; }

        /* --- HEADER FASHION NOVA --- */
        header { padding: 12px 15px; background: #fff; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .logo { font-weight: 900; font-size: 24px; text-decoration: none; color: #000; display: block; margin-bottom: 12px; letter-spacing: -1.5px; }
        
        .header-main { display: flex; align-items: center; gap: 10px; }
        .search-container { flex: 1; position: relative; }
        .search-container input { width: 100%; padding: 10px 40px; border: 1px solid #e0e0e0; border-radius: 4px; background: #f8f8f8; font-size: 13px; }
        .search-container i.fa-search { position: absolute; left: 12px; top: 12px; color: #888; }
        .search-container i.fa-camera { position: absolute; right: 12px; top: 12px; color: #888; }

        .header-icons { display: flex; gap: 18px; font-size: 20px; align-items: center; }
        .cart-icon { position: relative; cursor: pointer; }
        #cart-count { position: absolute; top: -8px; right: -8px; background: #d91818; color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 50%; font-weight: 900; }

        /* --- NAVIGATION MOBILE --- */
        .nav-scroll { display: flex; align-items: center; gap: 20px; padding: 12px 15px; border-bottom: 1px solid #eee; overflow-x: auto; white-space: nowrap; }
        .nav-scroll i.fa-bars { font-size: 22px; margin-right: 5px; cursor: pointer; }
        .nav-scroll a { text-decoration: none; color: #000; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .nav-scroll a.sale { color: #d91818; }

        /* --- BANNIÈRE PROMO LARGE --- */
        .promo-banner { 
            background: #000; color: #fff; text-align: center; 
            padding: 40px 20px; margin: 15px 0; 
            display: flex; flex-direction: column; align-items: center;
        }
        .promo-banner h2 { font-size: 30px; font-weight: 900; margin-bottom: 15px; letter-spacing: 1px; }
        .promo-banner button { background: #fff; color: #000; border: none; padding: 10px 25px; font-weight: 900; font-size: 12px; text-transform: uppercase; cursor: pointer; }

        /* --- SHOP BY CATEGORY --- */
        .section-title { padding: 20px 15px 10px; font-weight: 900; font-size: 16px; text-transform: uppercase; }
        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 15px; }
        .cat-card { text-align: center; position: relative; }
        .cat-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; }
        .cat-card span { display: block; margin-top: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; }

        /* --- GRILLE PRODUITS --- */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .p-card { border: 1px solid #f2f2f2; border-radius: 4px; overflow: hidden; }
        .p-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .p-details { padding: 12px; }
        .p-name { font-size: 12px; color: #333; margin-bottom: 5px; height: 32px; overflow: hidden; }
        .p-price { font-weight: 900; color: #d91818; font-size: 15px; }
        .add-cart-btn { width: 100%; background: #000; color: #fff; border: none; padding: 10px; font-weight: 900; font-size: 11px; margin-top: 10px; text-transform: uppercase; }

        /* --- PANIER LATÉRAL (DRAWER) --- */
        #cart-drawer { position: fixed; top: 0; right: -100%; width: 85%; height: 100%; background: #fff; z-index: 2001; transition: 0.3s; padding: 20px; box-shadow: -10px 0 20px rgba(0,0,0,0.1); }
        #cart-drawer.active { right: 0; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 2000; }
        #overlay.active { display: block; }
        .cart-item { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .cart-item img { width: 60px; height: 80px; object-fit: cover; }
        .remove-btn { color: #888; margin-left: auto; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div id="overlay"></div>

<div class="top-promo">LIVRAISON GRATUITE +50$</div>

<header>
    <a href="#" class="logo">LUTHERFASHION</a>
    <div class="header-main">
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Rechercher des vêtements pour femmes">
            <i class="fas fa-camera"></i>
        </div>
        <div class="header-icons">
            <i class="far fa-user"></i>
            <i class="far fa-heart"></i>
            <div class="cart-icon" id="open-cart">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count">0</span>
            </div>
        </div>
    </div>
</header>

<nav class="nav-scroll">
    <i class="fas fa-bars"></i>
    <a href="#">FEMMES</a>
    <a href="#">HOMMES</a>
    <a href="#">NOUVEAUTÉS</a>
    <a href="#" class="sale">SOLDES</a>
</nav>

<div class="promo-banner">
    <h2>60% DE RÉDUCTION 1e Achat</h2>
    <button>VOIR TOUT</button>
</div>

<div class="section-title">ACHETEZ PAR CATÉGORIE</div>
<div class="category-grid">
    <div class="cat-card"><img src="veste jaune.jpg"><span>VESTES</span></div>
    <div class="cat-card"><img src="Veste vert.jpg"><span>ENSEMBLES</span></div>
    <div class="cat-card"><img src="veste jaune.jpg"><span>TOPS</span></div>
    <div class="cat-card"><img src="Veste vert.jpg"><span>ACCESSOIRES</span></div>
</div>

<div class="section-title">NOS ARTICLES TENDANCES</div>
<div class="products-grid" id="product-list"></div>

<div id="cart-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
        <h3 style="font-size:18px; font-weight:900;">MON PANIER</h3>
        <i class="fas fa-times" id="close-cart" style="font-size:24px; cursor:pointer;"></i>
    </div>
    <div id="cart-content"></div>
    <div style="border-top:2px solid #000; padding-top:20px; margin-top:20px;">
        <div style="display:flex; justify-content:space-between; font-weight:900; font-size:18px;">
            <span>TOTAL</span>
            <span id="total-price">0,00 $</span>
        </div>
        <button style="width:100%; background:#000; color:#fff; padding:18px; border:none; margin-top:20px; font-weight:900; text-transform:uppercase;">Passer la commande</button>
    </div>
</div>

<script>
    // Inventaire utilisant tes fichiers GitHub
    const products = [
        { name: "Veste Stylée - Jaune", price: "45.00", img: "veste jaune.jpg" },
        { name: "Veste Fashion - Vert", price: "55.00", img: "Veste vert.jpg" }
    ];

    let cart = [];

    // --- LOGIQUE PANIER ---
    function updateUI() {
        const count = document.getElementById('cart-count');
        const content = document.getElementById('cart-content');
        const total = document.getElementById('total-price');
        
        count.innerText = cart.length;
        
        if(cart.length === 0) {
            content.innerHTML = '<p style="text-align:center; color:#999; margin-top:30px;">Votre panier est vide</p>';
            total.innerText = "0,00 $";
            return;
        }

        content.innerHTML = cart.map((item, i) => `
            <div class="cart-item">
                <img src="${item.img}">
                <div>
                    <div style="font-size:12px; font-weight:700;">${item.name}</div>
                    <div style="color:#d91818; font-weight:900; margin-top:5px;">${item.price} $</div>
                </div>
                <i class="fas fa-trash-alt remove-btn" onclick="removeFromCart(${i})"></i>
            </div>
        `).join('');

        let sum = cart.reduce((acc, curr) => acc + parseFloat(curr.price), 0);
        total.innerText = sum.toFixed(2).replace('.', ',') + " $";
    }

    function addToCart(idx) {
        cart.push(products[idx]);
        updateUI();
        document.getElementById('cart-drawer').classList.add('active');
        document.getElementById('overlay').classList.add('active');
    }

    function removeFromCart(idx) {
        cart.splice(idx, 1);
        updateUI();
    }

    // --- UI EVENTS ---
    document.getElementById('open-cart').onclick = () => { document.getElementById('cart-drawer').classList.add('active'); document.getElementById('overlay').classList.add('active'); };
    document.getElementById('close-cart').onclick = () => { document.getElementById('cart-drawer').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); };
    document.getElementById('overlay').onclick = () => { 
        document.getElementById('cart-drawer').classList.remove('active'); 
        document.getElementById('overlay').classList.remove('active'); 
    };

    // Initialisation de la liste des produits
    document.getElementById('product-list').innerHTML = products.map((p, i) => `
        <div class="p-card">
            <img src="${p.img}">
            <div class="p-details">
                <div class="p-name">${p.name}</div>
                <div class="p-price">${p.price} $</div>
                <button class="add-cart-btn" onclick="addToCart(${i})">Ajouter au panier</button>
            </div>
        </div>
    `).join('');
</script>

</body>
</html>
