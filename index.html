<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #FF0000; --bg: #ffffff; --glass: rgba(255, 255, 255, 0.9); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: #000; padding-bottom: 70px; }

        /* --- HEADER --- */
        header { padding: 12px 15px; background: var(--glass); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .header-main { display: flex; align-items: center; justify-content: space-between; }
        .logo { font-weight: 900; font-size: 22px; text-decoration: none; color: #000; letter-spacing: -1.5px; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .lang-link { font-weight: 900; font-size: 12px; }

        /* --- SEARCH & NAV --- */
        .search-area { padding: 10px 15px; }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 10px 40px; border: none; background: #f0f0f0; border-radius: 5px; font-size: 13px; }
        .search-box i { position: absolute; left: 12px; top: 12px; color: #888; }
        .nav-scroll { display: flex; gap: 20px; padding: 10px 15px; overflow-x: auto; scrollbar-width: none; }
        .nav-item { font-size: 12px; font-weight: 900; text-decoration: none; color: #888; text-transform: uppercase; }
        .nav-item.active { color: #000; border-bottom: 2px solid #000; }

        /* --- GRID --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .card { border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-body { padding: 10px; }
        .price { font-weight: 900; color: var(--accent); font-size: 16px; }

        /* --- PAGE DÉTAIL PRODUIT --- */
        #product-detail { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; display: none; overflow-y: auto; padding-bottom: 100px; }
        .detail-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #fff; z-index: 10; }
        .detail-img { width: 100%; aspect-ratio: 1/1.2; object-fit: cover; }
        .detail-info { padding: 20px; }
        .detail-name { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .detail-price { font-size: 22px; font-weight: 900; color: var(--accent); margin-bottom: 20px; }
        .size-grid { display: flex; gap: 8px; margin: 20px 0; overflow-x: auto; }
        .size-box { border: 1px solid #ddd; padding: 10px 15px; font-size: 12px; font-weight: 700; border-radius: 4px; min-width: 50px; text-align: center; }
        .add-to-bag { width: 100%; background: #000; color: #fff; padding: 18px; border: none; font-weight: 900; border-radius: 50px; font-size: 14px; margin-top: 20px; cursor: pointer; }

        /* --- BOTTOM NAV --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1001; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; color: #000; text-decoration: none; font-size: 10px; font-weight: 700; gap: 4px; }

        .promo-card { grid-column: 1 / -1; background: #000; color: #fff; border-radius: 15px; padding: 20px; display: flex; align-items: center; justify-content: space-between; }
        .promo-card img { width: 100px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="product-detail">
    <div class="detail-header">
        <i class="fas fa-chevron-left" onclick="closeDetail()" style="font-size: 20px;"></i>
        <i class="fas fa-share-alt"></i>
    </div>
    <img id="d-img" class="detail-img" src="">
    <div class="detail-info">
        <div id="d-name" class="detail-name"></div>
        <div id="d-price" class="detail-price"></div>
        <div style="font-size: 12px; font-weight: 700;">Size | <span style="text-decoration: underline;">View Size Guide</span></div>
        <div class="size-grid">
            <div class="size-box">XS</div><div class="size-box">S</div><div class="size-box">M</div><div class="size-box">L</div><div class="size-box">XL</div>
        </div>
        <button class="add-to-bag" onclick="addToBag()">Add to Bag</button>
        <div style="margin-top:30px; border-top:1px solid #eee; padding-top:20px;">
            <div style="display:flex; justify-content:space-between; font-weight:700; padding:10px 0;"><span>Product Details</span><i class="fas fa-chevron-down"></i></div>
            <div style="display:flex; justify-content:space-between; font-weight:700; padding:10px 0;"><span>Material</span><i class="fas fa-chevron-down"></i></div>
        </div>
    </div>
</div>

<header>
    <div class="header-main">
        <i class="fas fa-bars"></i>
        <a href="#" class="logo">LutherFashion</a>
        <div class="header-right">
            <span class="lang-link">FR</span>
            <i class="far fa-user"></i>
            <div style="position:relative;">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count" style="position:absolute; top:-8px; right:-8px; background:red; color:white; font-size:9px; padding:2px 5px; border-radius:50%;">0</span>
            </div>
        </div>
    </div>
</header>

<div class="search-area">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search within Women's Clothing">
    </div>
</div>

<div class="nav-scroll">
    <a href="#" class="nav-item active">Women</a><a href="#" class="nav-item">Men</a><a href="#" class="nav-item">New</a><a href="#" class="nav-item" style="color:red;">Sale</a>
</div>

<div class="grid" id="shop-grid"></div>

<div class="bottom-nav">
    <a href="#" class="bottom-nav-item"><i class="fas fa-home"></i>Accueil</a>
    <a href="#" class="bottom-nav-item"><i class="fas fa-search"></i>Explorer</a>
    <a href="#" class="bottom-nav-item"><i class="far fa-heart"></i>Favoris</a>
    <a href="#" class="bottom-nav-item"><i class="far fa-user"></i>Profil</a>
</div>

<script>
    const container = document.getElementById('shop-grid');
    const products = [];

    // Génération des 30 produits
    for (let i = 1; i <= 30; i++) {
        const item = {
            id: i,
            name: "Fully Booked Sweater Maxi - Olive #" + i,
            price: (Math.random() * (89 - 19) + 19).toFixed(2),
            img: i % 2 === 0 ? 'Veste vert.jpg' : 'veste jaune.jpg'
        };
        products.push(item);
        
        if (i % 5 === 0) {
            container.innerHTML += `
                <div class="promo-card">
                    <div><span style="color:red; font-size:10px; font-weight:900;">OFFRE SPÉCIALE</span><h3>COLLECTION LUXE</h3></div>
                    <img src="${item.img}">
                </div>`;
        } else {
            container.innerHTML += `
                <div class="card" onclick="openDetail(${i-1})">
                    <img src="${item.img}">
                    <div class="card-body">
                        <div style="font-weight:700; font-size:12px;">${item.name}</div>
                        <div class="price">${item.price} $</div>
                    </div>
                </div>`;
        }
    }

    function openDetail(index) {
        const p = products[index];
        document.getElementById('d-img').src = p.img;
        document.getElementById('d-name').innerText = p.name;
        document.getElementById('d-price').innerText = p.price + " $";
        document.getElementById('product-detail').style.display = 'block';
        window.scrollTo(0,0);
    }

    function closeDetail() {
        document.getElementById('product-detail').style.display = 'none';
    }

    let cart = 0;
    function addToBag() {
        cart++;
        document.getElementById('cart-count').innerText = cart;
        alert("Ajouté au panier !");
        closeDetail();
    }
</script>
</body>
</html>
