<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luther-S-Mode – Boutique de mode</title>
<meta name="description" content="Luther-S-Mode : découvre nos nouveautés et commande facilement sur WhatsApp.">
<meta name="theme-color" content="#1d1d1b">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #fafaf7; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --btn: #1d1d1b; --btn-text: #ffffff; --border: #e6e4dc; --ph: #eceae2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1e1e1c; --text: #f2f1ec; --muted: #a3a39b;
      --btn: #f2f1ec; --btn-text: #141413; --border: #34342f; --ph: #2a2a27;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header.top { padding-top: 16px; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
  .brand img { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; }
  nav a { color: var(--muted); text-decoration: none; font-size: .95rem; margin-left: 16px; }
  nav a:hover { color: var(--text); }
  .hero { padding: 56px 0 36px; }
  .hero h1 { font-size: clamp(2.2rem, 8vw, 4rem); line-height: 1.02; letter-spacing: -0.04em; max-width: 14ch; }
  .hero p { margin-top: 16px; color: var(--muted); max-width: 44ch; font-size: 1.05rem; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .btn {
    display: inline-block; border: 0; cursor: pointer; font-size: 1rem; font-weight: 700;
    background: var(--btn); color: var(--btn-text); padding: 14px 22px; border-radius: 12px; text-decoration: none;
  }
  .btn.wa { background: #1fa855; color: #fff; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn:focus-visible, .card:focus-visible, .chip:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 24px; }
  .chip {
    padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--card);
    color: var(--text); text-decoration: none; font-size: .9rem;
  }
  .chip:hover { border-color: var(--text); }
  h2.section { font-size: 1.4rem; letter-spacing: -0.02em; margin: 12px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
  h2.section a { font-size: .9rem; font-weight: 600; color: var(--muted); text-decoration: none; }
  h2.section a:hover { color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 24px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column;
  }
  .card:hover { border-color: var(--text); }
  .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--ph); display: block; }
  .card .body { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .card h3 { font-size: .95rem; font-weight: 600; line-height: 1.3; }
  .card .price { font-weight: 800; }
  .center { text-align: center; padding: 8px 0 48px; }
  .empty { grid-column: 1 / -1; color: var(--muted); padding: 24px 0; text-align: center; }
  footer { border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; padding: 24px 0 40px; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>

<header class="wrap top">
  <a class="brand" href="index.html">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <span id="brand">Luther-S-Mode</span>
  </a>
  <nav>
    <a href="catalogue.html">Catalogue</a>
    <a href="#contact" id="navContact">Contact</a>
  </nav>
</header>

<main class="wrap">
  <section class="hero">
    <h1 id="heroTitle">Le style qui te ressemble.</h1>
    <p id="heroText">Découvre nos nouveautés et commande en quelques clics.</p>
    <div class="cta">
      <a class="btn" href="catalogue.html">Voir le catalogue</a>
      <a class="btn wa" id="waBtn" href="#" hidden>Commander sur WhatsApp</a>
    </div>
  </section>

  <section>
    <div id="chips" class="chips" aria-label="Catégories"></div>
  </section>

  <section>
    <h2 class="section">Nouveautés <a href="catalogue.html">Tout voir &rarr;</a></h2>
    <div id="grid" class="grid"></div>
    <p class="center"><a class="btn ghost" href="catalogue.html">Voir tous les produits</a></p>
  </section>
</main>

<footer id="contact">
  <div class="wrap">
    <span>&copy; <span id="year"></span> <span id="brand2">Luther-S-Mode</span></span>
    <a id="waLink" href="#" hidden>Nous écrire sur WhatsApp</a>
  </div>
</footer>

<script>
  /* ============ RÉGLAGES À MODIFIER ============ */
  const CONFIG = {
    brand: "Luther-S-Mode",
    currency: "Ar",                              // ex. "Ar", "€", "$"
    whatsapp: "261XXXXXXXXX",                    // ton numéro avec l'indicatif, sans + ni espaces
    title: "Le style qui te ressemble.",
    text: "Découvre nos nouveautés et commande en quelques clics.",
    featured: 8,                                 // nombre de produits affichés en page d'accueil
    maxCategories: 8
  };
  /* ============================================= */

  const PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><rect width='100%' height='100%' fill='#d9d6cb'/></svg>"
  );
  const $ = function (id) { return document.getElementById(id); };

  function fmtPrice(n) {
    return typeof n === "number" ? new Intl.NumberFormat("fr-FR").format(n) + " " + CONFIG.currency : "";
  }

  function setup() {
    document.title = CONFIG.brand + " – Boutique de mode";
    $("brand").textContent = CONFIG.brand;
    $("brand2").textContent = CONFIG.brand;
    $("heroTitle").textContent = CONFIG.title;
    $("heroText").textContent = CONFIG.text;
    $("year").textContent = new Date().getFullYear();

    const waOk = !/x/i.test(CONFIG.whatsapp);
    if (waOk) {
      const url = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent("Bonjour, j'ai une question.");
      [$("waBtn"), $("waLink")].forEach(function (a) {
        a.href = url; a.target = "_blank"; a.rel = "noopener"; a.hidden = false;
      });
    }
  }

  function card(p) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "produit.html?id=" + encodeURIComponent(p.id);

    const img = document.createElement("img");
    img.src = p.image || PLACEHOLDER;
    img.alt = p.title;
    img.loading = "lazy";
    img.onerror = function () { this.onerror = null; this.src = PLACEHOLDER; };

    const body = document.createElement("div");
    body.className = "body";
    const h3 = document.createElement("h3");
    h3.textContent = p.title;
    body.appendChild(h3);
    const price = fmtPrice(p.price);
    if (price) {
      const s = document.createElement("span");
      s.className = "price";
      s.textContent = price;
      body.appendChild(s);
    }
    a.appendChild(img);
    a.appendChild(body);
    return a;
  }

  function load() {
    fetch("products.json", { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        const all = (Array.isArray(data) ? data : []).filter(function (p) { return p && p.id && p.title; });

        const grid = $("grid");
        grid.replaceChildren();
        all.slice(0, CONFIG.featured).forEach(function (p) { grid.appendChild(card(p)); });
        if (!all.length) {
          const e = document.createElement("p");
          e.className = "empty";
          e.textContent = "Les produits arrivent bientôt.";
          grid.appendChild(e);
        }

        const cats = Array.from(new Set(all.map(function (p) { return p.category; }).filter(Boolean)))
          .sort(function (a, b) { return a.localeCompare(b, "fr"); })
          .slice(0, CONFIG.maxCategories);
        const chips = $("chips");
        cats.forEach(function (c) {
          const a = document.createElement("a");
          a.className = "chip";
          a.href = "catalogue.html?cat=" + encodeURIComponent(c);
          a.textContent = c;
          chips.appendChild(a);
        });
      })
      .catch(function () {
        const e = document.createElement("p");
        e.className = "empty";
        e.textContent = "Impossible de charger les produits pour le moment.";
        $("grid").replaceChildren(e);
      });
  }

  setup();
  load();

  /* Garde l'appli installable (manifest.json + sw.js déjà présents dans ton dépôt) */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
