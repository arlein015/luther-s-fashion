<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Threndly - Connexion</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary-blue: #2D9CDB; 
            --primary-purple: #BB6BD9;
            --bg-dark: #34495E; /* Couleur de fond du modèle */
            --white: #FFFFFF;
            --text-gray: #7F8C8D;
            --input-border: #ECF0F1;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: var(--bg-dark); display: flex; align-items: center; justify-content: center; }

        /* Conteneur de la Carte (Exactement comme ton image) */
        .auth-card {
            background: var(--white);
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .logo-container { margin-bottom: 30px; }
        .logo-img { width: 220px; }

        h2 { color: #2C3E50; margin-bottom: 5px; font-size: 1.5rem; }
        p.subtitle { color: var(--text-gray); margin-bottom: 30px; font-size: 0.9rem; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; color: #34495E; margin-bottom: 8px; }
        
        .auth-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 1rem;
            color: #333;
            outline: none;
            transition: border 0.3s;
        }
        .auth-input:focus { border-color: var(--primary-blue); }

        /* Bouton Bleu Threndly */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .separator {
            margin: 25px 0;
            display: flex;
            align-items: center;
            color: var(--text-gray);
            font-size: 0.8rem;
        }
        .separator::before, .separator::after { content: ""; flex: 1; height: 1px; background: #eee; }
        .separator span { padding: 0 10px; }

        /* Boutons Sociaux */
        .social-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }
        .btn-google { background-color: #EA4335; }
        .btn-facebook { background-color: #1877F2; }

        .auth-footer { margin-top: 25px; font-size: 0.85rem; }
        .auth-footer a { color: var(--primary-blue); text-decoration: none; font-weight: bold; cursor: pointer; }
        
        /* Setup Photo (Caché au début) */
        #profile-setup { display: none; flex-direction: column; align-items: center; }
        #preview-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 20px 0; border: 3px solid var(--primary-blue); }

        /* Interface Chat (Cachée au début) */
        #app-interface { display: none; }
    </style>
</head>
<body>

    <div class="auth-card" id="auth-container">
        <div class="logo-container">
            <img src="logo.png" class="logo-img" alt="Threndly">
        </div>

        <div id="login-section">
            <h2 id="title">Content de vous revoir</h2>
            <p class="subtitle" id="subtitle">Connectez-vous à votre compte</p>

            <div class="form-group">
                <label id="label-user">Identifiant</label>
                <input type="text" id="username" class="auth-input" placeholder="Entrez votre identifiant">
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" class="auth-input" placeholder="Entrez votre mot de passe">
            </div>

            <button class="btn-submit" id="btn-main" onclick="handleAuth()">Se connecter</button>

            <div class="separator"><span>OU</span></div>

            <button class="social-btn btn-google"><i class="fab fa-google"></i> Continuer avec Google</button>
            <button class="social-btn btn-facebook"><i class="fab fa-facebook"></i> Continuer avec Facebook</button>

            <div class="auth-footer">
                <a onclick="alert('Contactez l\'admin pour reset')">Mot de passe oublié ?</a><br><br>
                <span id="footer-text">Vous n'avez pas de compte ?</span> <a id="toggle-link" onclick="toggleMode()">S'inscrire</a>
            </div>
        </div>

        <div id="profile-setup">
            <h2>Presque fini !</h2>
            <p class="subtitle">Choisissez votre photo de profil</p>
            <img src="https://i.pravatar.cc/150?u=temp" id="preview-img">
            <input type="file" id="file-input" hidden accept="image/*" onchange="loadPreview(this)">
            <button class="btn-submit" style="background:#444; margin-bottom:10px;" onclick="document.getElementById('file-input').click()">Choisir une photo 📸</button>
            <button class="btn-submit" onclick="finishSignup()">Commencer ✅</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isSignupMode = false;
        let tempUser = "";
        let base64Photo = "";

        function toggleMode() {
            isSignupMode = !isSignupMode;
            document.getElementById('title').innerText = isSignupMode ? "Créez votre compte" : "Content de vous revoir";
            document.getElementById('subtitle').innerText = isSignupMode ? "Rejoignez la communauté Threndly" : "Connectez-vous à votre compte";
            document.getElementById('btn-main').innerText = isSignupMode ? "S'inscrire" : "Se connecter";
            document.getElementById('footer-text').innerText = isSignupMode ? "Vous avez déjà un compte ?" : "Vous n'avez pas de compte ?";
            document.getElementById('toggle-link').innerText = isSignupMode ? "Se connecter" : "S'inscrire";
        }

        function handleAuth() {
            const u = document.getElementById('username').value.trim().toLowerCase();
            const p = document.getElementById('password').value.trim();
            if(!u || !p) return alert("Veuillez remplir tous les champs");

            if(isSignupMode) {
                db.ref("auth/"+u).once("value", snap => {
                    if(snap.exists()) return alert("Cet identifiant est déjà utilisé");
                    tempUser = u;
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('profile-setup').style.display = 'flex';
                });
            } else {
                db.ref("auth/"+u).once("value", snap => {
                    if(snap.exists() && snap.val().pass === p) {
                        localStorage.setItem('threndly_user', u);
                        window.location.href = "chat.html"; // Redirection vers ton chat
                    } else alert("Identifiant ou mot de passe incorrect");
                });
            }
        }

        function loadPreview(input) {
            const reader = new FileReader();
            reader.onload = e => { 
                base64Photo = e.target.result;
                document.getElementById('preview-img').src = base64Photo;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function finishSignup() {
            const p = document.getElementById('password').value;
            db.ref("auth/"+tempUser).set({ pass: p });
            db.ref("profiles/"+tempUser).set({ 
                name: tempUser, 
                img: base64Photo || "https://i.pravatar.cc/150?u="+tempUser 
            });
            localStorage.setItem('threndly_user', tempUser);
            window.location.href = "chat.html";
        }
    </script>
</body>
</html>
