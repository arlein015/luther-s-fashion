<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: #000; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Écran de connexion avec ton nouveau logo */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .main-logo { width: 150px; margin-bottom: 30px; }
        .auth-card { background: #111; padding: 30px; border-radius: 20px; border: 1px solid #222; width: 300px; text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; background: #1a1a1a; border: none; color: white; border-radius: 10px; box-sizing: border-box; }
        .btn-entrer { background: var(--grad); border: none; padding: 12px; border-radius: 25px; color: white; width: 100%; font-weight: bold; cursor: pointer; }

        /* Sidebar avec logo réduit */
        #sidebar { width: 350px; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; background: #0a0a0a; }
        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-logo { height: 35px; }

        .friend-item { padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #111; }
        .friend-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .badge-blue { color: #00d2ff; font-size: 0.8rem; margin-left: 5px; }

        /* Zone de Chat */
        #main-chat { flex: 1; display: flex; flex-direction: column; background: #000; }
        header { padding: 15px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 65%; font-size: 0.95rem; }
        .my-msg { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 2px; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 2px; }

        #input-area { padding: 20px; display: flex; align-items: center; gap: 15px; border-top: 1px solid #1a1a1a; }
        .input-box { flex: 1; background: #1a1a1a; border-radius: 15px; padding: 12px; display: flex; }
        #message-input { background: transparent; border: none; color: white; width: 100%; outline: none; }
    </style>
</head>
<body>

<div id="auth-screen">
    <img src="logo.png" class="main-logo" alt="Trendly Logo">
    <div class="auth-card">
        <input type="text" id="user-id" class="auth-input" placeholder="Email ou Identifiant">
        <input type="password" id="user-pass" class="auth-input" placeholder="Mot de passe">
        <button class="btn-entrer" onclick="login()">Entrer ✅</button>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <img src="logo.png" class="sidebar-logo" alt="Trendly">
        <i class="fas fa-sign-out-alt" style="color:#555; cursor:pointer"></i>
    </div>
    <div id="friends-list">
        <div class="friend-item">
            <img src="https://i.pravatar.cc/150?u=jos" class="friend-avatar">
            <div>
                <div style="font-weight:bold">Joselyna <i class="fas fa-check-circle badge-blue"></i></div>
                <div style="font-size:0.8rem; color:#888">zahay zaza jiajy...</div>
            </div>
        </div>
        <div class="friend-item">
            <img src="https://i.pravatar.cc/150?u=nel" class="friend-avatar">
            <div>
                <div style="font-weight:bold">Nelly <i class="fas fa-check-circle badge-blue"></i></div>
                <div style="font-size:0.8rem; color:#888">okay havy agny z...</div>
            </div>
        </div>
    </div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="https://i.pravatar.cc/150?u=jos" style="width:35px; height:35px; border-radius:50%;">
            <div style="font-weight:bold;">Joselyna</div>
        </div>
        <div style="display:flex; gap:20px; color:#666;">
            <i class="fas fa-phone"></i>
            <i class="fas fa-video"></i>
        </div>
    </header>
    <div id="chat-box">
        <div class="msg other-msg">Regarde mon nouveau logo !</div>
        <div class="msg my-msg">Il est magnifique 🔥</div>
    </div>
    <div id="input-area">
        <i class="far fa-image" style="color:#888; font-size:1.5rem;"></i>
        <div class="input-box">
            <input type="text" id="message-input" placeholder="Écris ton message...">
        </div>
        <button style="background:var(--grad); border:none; width:45px; height:45px; border-radius:50%; color:white;"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    function login() {
        document.getElementById('auth-screen').style.display = 'none';
    }
</script>

</body>
</html>
