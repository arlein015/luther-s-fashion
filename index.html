<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: #fff; color: #000; overflow-x: hidden; }

        /* --- HEADER & NAV --- */
        .top-promo { background: #000; color: #fff; text-align: center; padding: 8px; font-size: 11px; font-weight: 700; }
        header { padding: 12px 15px; background: #fff; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .logo { font-weight: 900; font-size: 24px; text-decoration: none; color: #000; display: block; margin-bottom: 10px; letter-spacing: -1.5px; }
        .header-main { display: flex; align-items: center; gap: 10px; }
        .search-bar { flex: 1; position: relative; }
        .search-bar input { width: 100%; padding: 10px 40px; border: 1px solid #e0e0e0; border-radius: 4px; background: #f8f8f8; font-size: 13px; }
        .search-bar i { position: absolute; left: 12px; top: 12px; color: #888; }
        .header-icons { display: flex; gap: 18px; font-size: 20px; }

        /* --- NOUVELLE BANNIÈRE IMPOSANTE (STYLE PHOTO) --- */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 350px; /* Hauteur imposante comme sur tes photos */
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .hero-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Utilisation de ta photo de veste verte pour le fond */
            background: url('Veste vert.jpg') center center/cover; 
            opacity: 0.7; /* Pour que le texte reste lisible sur l'image sombre */
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            padding: 20px;
        }
        .hero-content h2 { 
            font-size: 32px; 
            font-weight: 900; 
            margin-bottom: 15px; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8); /* Ombre pour détacher le texte */
        }
        .hero-content button { 
            background: #fff; color: #000; border: none; 
            padding: 12px 30px; font-weight: 900; 
            font-size: 13px; text-transform: uppercase; cursor: pointer; 
        }

        /* --- CATEGORIES --- */
        .cat-title { padding: 15px; font-weight: 900; font-size: 14px; text-transform: uppercase; }
        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 15px; }
        .cat-card { text-align: center; }
        .cat-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; }
        .cat-card span { display: block; margin-top: 5px; font-size: 10px; font-weight: 700; }

        /* --- GRILLE PRODUITS --- */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .p-card { border: 1px solid #f2f2f2; }
        .p-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .p-details { padding: 10px; }
        .p-price { font-weight: 900; color: #d91818; }
        .add-btn { width: 100%; background: #000; color: #fff; border: none; padding: 10px; font-weight: 900; margin-top: 10px; font-size: 11px; }

        /* --- PANIER --- */
        #cart-drawer { position: fixed; top: 0; right: -100%; width: 85%; height: 100%; background: #fff; z-index: 2001; transition: 0.3s; padding: 20px; box-shadow: -10px 0 20px rgba(0,0,0,0.1); }
        #cart-drawer.active { right: 0; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 2000; }
        #overlay.active { display: block; }
    </style>
</head>
<body>

<div id="overlay"></div>
<div class="top-promo">LIVRAISON GRATUITE +50$</div>

<header>
    <a href="#" class="logo">LUTHERFASHION</a>
    <div class="header-main">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Rechercher...">
        </div>
        <div class="header-icons">
            <i class="far fa-user"></i>
            <div class="cart-icon" id="open-cart" style="position:relative; cursor:pointer;">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count" style="position:absolute; top:-8px; right:-8px; background:#d91818; color:#fff; font-size:9px; padding:2px 5px; border-radius:50%;">0</span>
            </div>
        </div>
    </div>
</header>

<div class="hero-banner">
    <div class="hero-image"></div>
    <div class="hero-content">
        <h2>60-80% DE RÉDUCTION</h2>
        <button>ACHETER MAINTENANT</button>
    </div>
</div>

<div class="cat-title">ACHETEZ PAR CATÉGORIE</div>
<div class="category-grid">
    <div class="cat-card"><img src="veste jaune.jpg"><span>VESTES</span></div>
    <div class="cat-card"><img src="Veste vert.jpg"><span>ENSEMBLES</span></div>
    <div class="cat-card"><img src="veste jaune.jpg"><span>TOPS</span></div>
    <div class="cat-card"><img src="Veste vert.jpg"><span>SOLDES</span></div>
</div>

<div class="products-grid" id="product-list"></div>

<div id="cart-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 style="font-weight:900;">MON PANIER</h3>
        <i class="fas fa-times" id="close-cart" style="font-size:24px; cursor:pointer;"></i>
    </div>
    <div id="cart-content"></div>
    <div style="border-top:2px solid #000; padding-top:20px; margin-top:20px;">
        <div style="display:flex; justify-content:space-between; font-weight:900;">
            <span>TOTAL</span>
            <span id="total-price">0,00 $</span>
        </div>
        <button style="width:100%; background:#000; color:#fff; padding:15px; border:none; margin-top:20px; font-weight:900;">PAYER</button>
    </div>
</div>

<script>
    const products = [
        { name: "Veste Stylée - Jaune", price: "45.00", img: "veste jaune.jpg" },
        { name: "Veste Fashion - Vert", price: "55.00", img: "Veste vert.jpg" }
    ];

    let cart = [];

    function updateCart() {
        const content = document.getElementById('cart-content');
        const count = document.getElementById('cart-count');
        const total = document.getElementById('total-price');
        count.innerText = cart.length;
        
        if(cart.length === 0) {
            content.innerHTML = '<p style="text-align:center; color:#999; margin-top:20px;">Vide</p>';
            total.innerText = "0,00 $";
            return;
        }

        content.innerHTML = cart.map((item, i) => `
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                <img src="${item.img}" style="width:50px; height:70px; object-fit:cover;">
                <div style="flex:1;">
                    <div style="font-size:11px; font-weight:700;">${item.name}</div>
                    <div style="color:#d91818; font-weight:900;">${item.price} $</div>
                </div>
                <i class="fas fa-trash-alt" style="color:#888; cursor:pointer;" onclick="removeItem(${i})"></i>
            </div>
        `).join('');

        let sum = cart.reduce((acc, curr) => acc + parseFloat(curr.price), 0);
        total.innerText = sum.toFixed(2).replace('.', ',') + " $";
    }

    function addItem(idx) {
        cart.push(products[idx]);
        updateCart();
        document.getElementById('cart-drawer').classList.add('active');
        document.getElementById('overlay').classList.add('active');
    }

    function removeItem(idx) {
        cart.splice(idx, 1);
        updateCart();
    }

    document.getElementById('open-cart').onclick = () => { document.getElementById('cart-drawer').classList.add('active'); document.getElementById('overlay').classList.add('active'); };
    document.getElementById('close-cart').onclick = () => { document.getElementById('cart-drawer').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); };
    document.getElementById('overlay').onclick = () => { document.getElementById('cart-drawer').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); };

    document.getElementById('product-list').innerHTML = products.map((p, i) => `
        <div class="p-card">
            <img src="${p.img}">
            <div class="p-details">
                <div style="font-size:12px; margin-bottom:5px;">${p.name}</div>
                <div class="p-price">${p.price} $</div>
                <button class="add-btn" onclick="addItem(${i})">AJOUTER AU PANIER</button>
            </div>
        </div>
    `).join('');
</script>

</body>
</html>
