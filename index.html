<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #FF0000; --bg: #ffffff; --glass: rgba(255, 255, 255, 0.9); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: #000; padding-bottom: 70px; } /* Espace pour la barre du bas */

        /* --- HEADER MIS À JOUR --- */
        header { padding: 12px 15px; background: var(--glass); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .header-main { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        
        .menu-btn { font-size: 20px; cursor: pointer; } /* Bouton Menu */
        .logo { font-weight: 900; font-size: 22px; text-decoration: none; color: #000; letter-spacing: -1.5px; }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .lang-link { font-weight: 900; font-size: 12px; cursor: pointer; } /* Bouton FR */
        .icon-link { font-size: 18px; color: #000; text-decoration: none; position: relative; }

        /* --- SEARCH & NAV --- */
        .search-area { padding: 10px 15px; }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 10px 40px; border: none; background: #f0f0f0; border-radius: 5px; font-size: 13px; }
        .search-box i { position: absolute; left: 12px; top: 12px; color: #888; }

        .nav-scroll { display: flex; gap: 20px; padding: 10px 15px; overflow-x: auto; scrollbar-width: none; }
        .nav-item { font-size: 12px; font-weight: 900; text-decoration: none; color: #888; text-transform: uppercase; }
        .nav-item.active { color: #000; border-bottom: 2px solid #000; }

        /* --- GRID & CARDS --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .card { border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-body { padding: 10px; }
        .price { font-weight: 900; color: var(--accent); font-size: 16px; }
        .buy-btn { width: 100%; background: #000; color: #fff; border: none; padding: 10px; border-radius: 5px; font-weight: 900; font-size: 10px; margin-top: 8px; }

        /* --- BARRE DE NAVIGATION BASSE (BOTTOM NAV) --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1001; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; color: #000; text-decoration: none; font-size: 10px; font-weight: 700; gap: 4px; }
        .bottom-nav-item i { font-size: 20px; }

        /* --- PROMO CARD --- */
        .promo-card { grid-column: 1 / -1; background: #000; color: #fff; border-radius: 15px; padding: 20px; display: flex; align-items: center; justify-content: space-between; }
        .promo-card img { width: 100px; border-radius: 8px; }

        footer { background: #000; color: #fff; padding: 40px 20px; text-align: center; font-size: 10px; }
    </style>
</head>
<body>

<header>
    <div class="header-main">
        <i class="fas fa-bars menu-btn"></i> <a href="#" class="logo">LutherFashion</a>
        <div class="header-right">
            <span class="lang-link">FR</span> <a href="#" class="icon-link"><i class="far fa-user"></i></a> <a href="#" class="icon-link">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count" style="position:absolute; top:-8px; right:-8px; background:red; color:white; font-size:9px; padding:2px 5px; border-radius:50%;">0</span>
            </a>
        </div>
    </div>
</header>

<div class="search-area">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Rechercher des articles...">
    </div>
</div>

<div class="nav-scroll">
    <a href="#" class="nav-item active">Femmes</a>
    <a href="#" class="nav-item">Hommes</a>
    <a href="#" class="nav-item">Nouveautés</a>
    <a href="#" class="nav-item" style="color:red;">Soldes</a>
</div>

<div class="grid" id="shop-grid"></div>

<footer>
    <div style="margin-bottom: 20px; font-size: 18px;">
        <i class="fab fa-instagram"></i> &nbsp; <i class="fab fa-tiktok"></i>
    </div>
    © 2026 LUTHER FASHION. TOUS DROITS RÉSERVÉS.
</footer>

<div class="bottom-nav">
    <a href="#" class="bottom-nav-item"><i class="fas fa-home"></i>Accueil</a>
    <a href="#" class="bottom-nav-item"><i class="fas fa-search"></i>Explorer</a>
    <a href="#" class="bottom-nav-item"><i class="far fa-heart"></i>Favoris</a>
    <a href="#" class="bottom-nav-item"><i class="far fa-user"></i>Profil</a>
</div>

<script>
    const container = document.getElementById('shop-grid');
    let count = 0;
    
    for (let i = 1; i <= 30; i++) {
        const pPrice = (Math.random() * (89 - 19) + 19).toFixed(2);
        const pImg = i % 2 === 0 ? 'Veste vert.jpg' : 'veste jaune.jpg';
        
        if (i % 5 === 0) {
            container.innerHTML += `
                <div class="promo-card">
                    <div>
                        <span style="color:red; font-size:10px; font-weight:900;">OFFRE SPÉCIALE</span>
                        <h3 style="font-size:18px; margin:5px 0;">COLLECTION PRESTIGE</h3>
                        <button style="padding:8px 15px; border-radius:4px; border:none; font-weight:900; font-size:10px; cursor:pointer;">DÉCOUVRIR</button>
                    </div>
                    <img src="${pImg}">
                </div>
            `;
        } else {
            container.innerHTML += `
                <div class="card">
                    <img src="${pImg}">
                    <div class="card-body">
                        <div style="font-weight:700; font-size:12px;">Veste Mode #${i}</div>
                        <div class="price">${pPrice} $</div>
                        <button class="buy-btn" onclick="addOne()">AJOUTER</button>
                    </div>
                </div>
            `;
        }
    }

    function addOne() {
        count++;
        document.getElementById('cart-count').innerText = count;
    }
</script>

</body>
</html>
