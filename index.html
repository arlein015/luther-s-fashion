<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly - Super App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --threndly-purple: #9c27b0;
            --threndly-blue: #0095f6; /* Bleu certification */
            --bg-chat: #efe7dd;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: var(--bg-chat); }

        /* Header Threndly */
        .header { background: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #ddd; }
        .badge-certif { color: var(--threndly-blue); font-size: 16px; }

        /* Zone de Messages */
        #chat-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; position: relative; font-size: 15px; line-height: 1.4; }
        .sent { align-self: flex-end; background: var(--threndly-purple); color: white; border-bottom-right-radius: 2px; }
        .received { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 2px; }
        
        /* Médias */
        .msg-image { max-width: 100%; border-radius: 10px; margin-top: 5px; cursor: pointer; }
        .audio-player { margin-top: 5px; filter: hue-rotate(250deg); }

        /* Coche intelligente */
        .status-box { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; margin-top: 5px; }
        .tick-blue { color: var(--threndly-blue); font-weight: bold; }
        .tick-gray { color: #ccc; }
