<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --sidebar: #121212; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* Login */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-img-large { width: 120px; margin-bottom: 20px; } /* Ton nouveau logo ici */
        .auth-card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; width: 300px; text-align: center; }

        /* Sidebar */
        #sidebar { width: 350px; background: var(--sidebar); border-right: 1px solid #222; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .logo-img-small { height: 30px; } /* Ton nouveau logo ici aussi */
        
        #friends-list { flex: 1; overflow-y: auto; }
        .friend-item { padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #1a1a1a; }
        .friend-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .friend-name { font-weight: bold; display: flex; align-items: center; gap: 5px; }

        /* Chat */
        #main-chat { flex: 1; display: none; flex-direction: column; background: #000; }
        header { padding: 10px 20px; height: 60px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 70%; }
        .my-msg { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }

        #input-area { padding: 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #222; }
        .input-box { flex: 1; background: #1a1a1a; border-radius: 25px; padding: 10px 15px; }
        #message-input { background: transparent; border: none; color: white; width: 100%; outline: none; }
        .send-btn { background: var(--grad); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-screen">
    <img src="logo.png" class="logo-img-large">
    <div class="auth-card">
        <input type="text" id="user-id" placeholder="Ton nom" style="width:90%; padding:10px; margin-bottom:10px; border-radius:10px; border:none; background:#222; color:white;">
        <button onclick="handleAuth()" style="background:var(--grad); border:none; padding:12px; border-radius:20px; color:white; width:100%; cursor:pointer;">Entrer ✅</button>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <img src="logo.png" class="sidebar-logo-small" style="height:35px;">
        <i class="fas fa-sign-out-alt" onclick="logout()" style="cursor:pointer"></i>
    </div>
    <div id="friends-list"></div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="" id="chat-avatar" style="width:40px; height:40px; border-radius:50%;">
            <div id="chat-name" style="font-weight:bold;"></div>
        </div>
        <div style="display:flex; gap:20px; color:#888;">
            <i class="fas fa-phone"></i>
            <i class="fas fa-video"></i>
        </div>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <i class="far fa-image" style="color:#888; font-size:1.3rem;"></i>
        <div class="input-box">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        <button class="send-btn" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myUser = localStorage.getItem('threndly_user') || "";
    let activeChat = "";

    if(myUser) login(myUser);

    function handleAuth() {
        const name = document.getElementById('user-id').value.trim();
        if(name) login(name);
    }

    function login(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        loadFriends();
    }

    function loadFriends() {
        const list = document.getElementById('friends-list');
        const friends = [
            { name: "Joselyna", last: "zahay zaza jiajy...", img: "https://i.pravatar.cc/150?u=jos" },
            { name: "Nelly", last: "okay havy agny z...", img: "https://i.pravatar.cc/150?u=nel" },
            { name: "Arthur💸", last: "on peut parler sur...", img: "https://i.pravatar.cc/150?u=art" },
            { name: "Lebien", last: "📷 4 photos", img: "https://i.pravatar.cc/150?u=leb" }
        ];

        list.innerHTML = "";
        friends.forEach(f => {
            const div = document.createElement('div');
            div.className = 'friend-item';
            div.onclick = () => openChat(f.name, f.img);
            div.innerHTML = `
                <img src="${f.img}" class="friend-avatar">
                <div class="friend-info">
                    <div class="friend-name">${f.name} <i class="fas fa-check-circle" style="color:var(--cyan); font-size:0.7rem"></i></div>
                    <div class="last-msg">${f.last}</div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function openChat(name, img) {
        activeChat = name;
        document.getElementById('main-chat').style.display = 'flex';
        document.getElementById('chat-name').innerText = name;
        document.getElementById('chat-avatar').src = img;
        loadMessages();
    }

    function sendMsg() {
        const text = document.getElementById('message-input').value;
        if(text && activeChat) {
            db.ref("chats/" + activeChat).push({ from: myUser, text: text });
            document.getElementById('message-input').value = "";
        }
    }

    function loadMessages() {
        const box = document.getElementById('chat-box');
        db.ref("chats/" + activeChat).on("value", snap => {
            box.innerHTML = "";
            snap.forEach(child => {
                const m = child.val();
                const div = document.createElement('div');
                div.className = `msg ${m.from === myUser ? 'my-msg' : 'other-msg'}`;
                div.innerText = m.text;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function logout() { localStorage.removeItem('threndly_user'); location.reload(); }
</script>
</body>
</html>
