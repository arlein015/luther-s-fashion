<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅ - Chat Live</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .message { max-width: 70%; padding: 10px 15px; border-radius: 18px; font-size: 0.95rem; position: relative; line-height: 1.4; }
        .sent { align-self: flex-end; background-color: #007bff; color: white; border-bottom-right-radius: 2px; }
        .received { align-self: flex-start; background-color: white; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        .username { font-size: 0.7rem; font-weight: bold; margin-bottom: 4px; display: block; opacity: 0.8; }
        
        #input-area { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; border: 1px solid #ddd; padding: 12px; border-radius: 25px; outline: none; }
        button { background: #007bff; color: white; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0056b3; }

        /* Login Overlay */
        #login-screen { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Bienvenue sur Threndly ✅</h2>
        <input type="text" id="user-name" placeholder="Ton pseudo..." style="flex:none; width:250px; margin-bottom:10px;">
        <button onclick="startChat()" style="height:45px;">Rejoindre la discussion</button>
    </div>

    <header>Threndly ✅</header>

    <div id="chat-container">
        </div>

    <div id="input-area">
        <input type="text" id="message-input" placeholder="Tapez votre message..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

    <script>
        // CONFIGURATION FIREBASE THRENDLY
        const firebaseConfig = {
            apiKey: "TON_API_KEY_ICI", 
            authDomain: "trendly-fca7c.firebaseapp.com",
            databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
            projectId: "trendly-fca7c",
            storageBucket: "trendly-fca7c.appspot.com",
            messagingSenderId: "TON_ID",
            appId: "TON_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";

        function startChat() {
            const name = document.getElementById('user-name').value;
            if (name.trim() !== "") {
                currentUser = name;
                document.getElementById('login-screen').style.display = 'none';
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value;

            if (message.trim() !== "" && currentUser !== "") {
                db.ref("messages").push({
                    username: currentUser,
                    text: message,
                    timestamp: Date.now(),
                    date: new Date().toLocaleString()
                });
                input.value = "";
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // ECOUTE DES MESSAGES EN TEMPS RÉEL
        db.ref("messages").limitToLast(50).on("child_added", (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('chat-container');
            
            const div = document.createElement('div');
            div.classList.add('message');
            div.classList.add(data.username === currentUser ? 'sent' : 'received');
            
            div.innerHTML = `
                <span class="username">${data.username}</span>
                ${data.text}
            `;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight; // Scroll auto vers le bas
        });
    </script>
</body>
</html>
