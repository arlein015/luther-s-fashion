<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅ - Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .message { max-width: 75%; padding: 8px 12px; border-radius: 10px; font-size: 14px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background-color: #dcf8c6; }
        .received { align-self: flex-start; background-color: white; }
        .msg-media img, .msg-media video { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        
        #input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .icon-btn { color: #919191; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { color: #075e54; }
        input { flex: 1; border: none; padding: 10px 15px; border-radius: 20px; outline: none; }
        
        /* Overlay Appel */
        #call-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        .call-btns { display: flex; gap: 30px; margin-top: 50px; }
        .btn-hangup { background: #ff3b30; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <span>Threndly ✅</span>
        <div style="display: flex; gap: 20px;">
            <i class="fas fa-phone icon-btn" style="color: white;" onclick="startCall('audio')"></i>
            <i class="fas fa-video icon-btn" style="color: white;" onclick="startCall('video')"></i>
        </div>
    </header>

    <div id="chat-container"></div>

    <div id="input-area">
        <i class="far fa-smile icon-btn"></i>
        <label for="file-input"><i class="fas fa-paperclip icon-btn"></i></label>
        <input type="file" id="file-input" style="display:none" onchange="uploadFile(this)">
        <input type="text" id="message-input" placeholder="Message...">
        <i class="fas fa-microphone icon-btn" id="voice-btn" onclick="toggleRecording()"></i>
        <button onclick="sendMessage()" style="border:none; background:none;"><i class="fas fa-paper-plane icon-btn" style="color:#075e54"></i></button>
    </div>

    <div id="call-screen">
        <h2 id="call-type">Appel en cours...</h2>
        <div id="remote-video" style="width: 80%; background: #333; height: 300px; border-radius: 15px;"></div>
        <div class="call-btns">
            <div class="btn-hangup" onclick="endCall()"><i class="fas fa-phone-slash"></i></div>
        </div>
    </div>

    <script>
        // CONFIGURATION FIREBASE (REMPLIS AVEC TES INFOS)
        const firebaseConfig = {
            apiKey: "TON_API_KEY",
            databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
            storageBucket: "trendly-fca7c.appspot.com",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();
        let user = "Utilisateur_" + Math.floor(Math.random() * 100);

        // ENVOYER MESSAGE TEXTE
        function sendMessage() {
            const text = document.getElementById('message-input').value;
            if (text.trim()) {
                db.ref("messages").push({ username: user, text: text, type: "text", timestamp: Date.now() });
                document.getElementById('message-input').value = "";
            }
        }

        // ENVOYER PHOTO / VIDEO
        function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;
            const ref = storage.ref('chat_files/' + file.name);
            ref.put(file).then(snapshot => snapshot.ref.getDownloadURL()).then(url => {
                const type = file.type.includes('image') ? 'image' : 'video';
                db.ref("messages").push({ username: user, fileUrl: url, type: type, timestamp: Date.now() });
            });
        }

        // GESTION DES APPELS (SIMULATION INTERFACE)
        function startCall(type) {
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('call-type').innerText = type === 'video' ? "Appel Vidéo..." : "Appel Vocal...";
        }
        function endCall() { document.getElementById('call-screen').style.display = 'none'; }

        // AFFICHAGE DES MESSAGES
        db.ref("messages").on("child_added", (snap) => {
            const m = snap.val();
            const div = document.createElement('div');
            div.className = `message ${m.username === user ? 'sent' : 'received'}`;
            
            let content = `<strong>${m.username}</strong><br>`;
            if (m.type === 'text') content += m.text;
            if (m.type === 'image') content += `<img src="${m.fileUrl}" style="width:100%">`;
            if (m.type === 'video') content += `<video src="${m.fileUrl}" controls style="width:100%"></video>`;
            
            div.innerHTML = content;
            document.getElementById('chat-container').appendChild(div);
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
        });
    </script>
</body>
</html>
