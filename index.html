<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Écran d'accueil */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; width: 320px; text-align: center; }
        .logo-te { font-size: 2.5rem; font-weight: bold; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .auth-input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .btn-main { background: var(--grad); border: none; padding: 14px; width: 100%; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .switch-btn { color: #888; font-size: 0.85rem; margin-top: 15px; cursor: pointer; display: block; text-decoration: underline; }
        .hidden { display: none; }
        
        /* Interface Chat */
        #app-interface { display: none; flex-direction: column; height: 100vh; }
        header { padding: 12px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .chat-partner { font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        
        /* Style des bulles sans nom d'utilisateur */
        .msg { padding: 10px 16px; border-radius: 18px; max-width: 75%; font-size: 0.95rem; line-height: 1.4; position: relative; }
        
        /* Message de l'autre (à GAUCHE) */
        .other-msg { align-self: flex-start; background: #262626; color: white; border-bottom-left-radius: 4px; }
        
        /* Ton message (à DROITE) */
        .my-msg { align-self: flex-end; background: var(--grad); color: white; border-bottom-right-radius: 4px; }
        
        #input-area { padding: 15px; background: #000; border-top: 1px solid #222; display: flex; gap: 10px; }
        #message-input { flex: 1; background: #1a1a1a; border: none; padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="logo-te">Threndly</div>
    <div class="auth-card">
        <h3 id="auth-title">Connexion ✅</h3>
        <input type="text" id="user-id" class="auth-input" placeholder="Email ou Numéro">
        <input type="password" id="user-pass" class="auth-input" placeholder="Mot de passe">
        <input type="password" id="user-confirm" class="auth-input hidden" placeholder="Confirmer le mot de passe">
        <button class="btn-main" id="btn-action" onclick="handleAuth()">Se connecter</button>
        <span class="switch-btn" id="toggle-link" onclick="toggleMode()">Pas de compte ? S'inscrire</span>
    </div>
</div>

<div id="app-interface">
    <header>
        <div class="chat-partner" id="partner-display">
            Chargement...
        </div>
        <button onclick="logout()" style="background:none; border:none; color:#ff4444; cursor:pointer"><i class="fas fa-sign-out-alt"></i></button>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        <button style="background:var(--grad); border:none; color:white; width:45px; height:45px; border-radius:50%" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLoginMode = true;
    let myUser = localStorage.getItem('threndly_user') || "";

    window.onload = function() { if(myUser) enterApp(myUser); }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "Connexion ✅" : "Inscription ✅";
        document.getElementById('btn-action').innerText = isLoginMode ? "Se connecter" : "Créer mon compte";
        document.getElementById('user-confirm').classList.toggle('hidden', isLoginMode);
    }

    function handleAuth() {
        const id = document.getElementById('user-id').value.trim();
        const pass = document.getElementById('user-pass').value.trim();
        const confirm = document.getElementById('user-confirm').value.trim();
        if(!id || !pass) return;
        if(!isLoginMode && pass !== confirm) return;

        const path = id.replace(/[^a-zA-Z0-9]/g, "");
        if(!isLoginMode) {
            db.ref('users/' + path).set({ password: pass }).then(() => enterApp(id));
        } else {
            db.ref('users/' + path).once('value', s => {
                if(s.exists() && s.val().password === pass) enterApp(id);
                else alert("Erreur");
            });
        }
    }

    function enterApp(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-interface').style.display = 'flex';
        startChat();
    }

    function sendMsg() {
        const input = document.getElementById('message-input');
        if(input.value.trim()){
            db.ref("messages").push({ user: myUser, text: input.value, timestamp: Date.now() });
            input.value = "";
        }
    }

    function startChat() {
        const box = document.getElementById('chat-box');
        db.ref("messages").off();
        box.innerHTML = "";

        db.ref("messages").on("child_added", snap => {
            const data = snap.val();
            const isMe = data.user === myUser;
            
            // Mise à jour dynamique du nom en haut si c'est l'autre qui parle
            if(!isMe) {
                document.getElementById('partner-display').innerHTML = `${data.user} <i class="fas fa-check-circle" style="color:var(--cyan); font-size:0.9rem"></i>`;
            }

            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'my-msg' : 'other-msg'}`;
            div.innerText = data.text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    }

    function logout() { localStorage.removeItem('threndly_user'); location.reload(); }
</script>
</body>
</html>
