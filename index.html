<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Boutique Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: #fff; overflow-x: hidden; }

        /* --- HEADER FASHION NOVA --- */
        .top-bar { background: #000; color: #fff; text-align: center; padding: 6px; font-size: 10px; font-weight: bold; }
        header { padding: 10px 15px; border-bottom: 1px solid #eee; background: #fff; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; font-size: 22px; text-decoration: none; color: #000; display: block; margin-bottom: 10px; letter-spacing: -1px; }
        .header-main { display: flex; align-items: center; gap: 10px; }
        .search-bar { flex: 1; position: relative; }
        .search-bar input { width: 100%; padding: 8px 35px; border-radius: 4px; border: 1px solid #ddd; background: #f9f9f9; font-size: 13px; }
        .search-bar .fa-search { position: absolute; left: 10px; top: 10px; color: #888; }
        .icons { display: flex; gap: 15px; font-size: 18px; align-items: center; }
        .cart-icon { position: relative; cursor: pointer; }
        #cart-count { position: absolute; top: -8px; right: -8px; background: #d91818; color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 50%; font-weight: bold; }

        /* --- NAV & BURGER --- */
        nav { display: flex; align-items: center; gap: 15px; padding: 10px 15px; border-bottom: 1px solid #eee; overflow-x: auto; white-space: nowrap; }
        nav i { font-size: 20px; }
        nav a { text-decoration: none; color: #000; font-size: 11px; font-weight: bold; text-transform: uppercase; }

        /* --- BANNIÈRE FLUE (STYLE PROMO) --- */
        .promo-banner {
            position: relative;
            height: 180px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 10px 0;
        }
        .promo-bg {
            position: absolute;
            width: 100%; height: 100%;
            background: url('Veste vert.jpg') center/cover; /* */
            filter: blur(5px);
            opacity: 0.6;
        }
        .promo-text {
            position: relative;
            z-index: 2;
            color: #fff;
            text-align: center;
        }
        .promo-text h2 { font-size: 24px; font-weight: 900; }
        .promo-text button { background: #fff; color: #000; border: none; padding: 8px 20px; font-weight: 900; margin-top: 10px; font-size: 10px; text-transform: uppercase; }

        /* --- SHOP BY CATEGORY --- */
        .cat-title { padding: 15px; font-weight: 900; font-size: 14px; text-transform: uppercase; }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            padding: 0 10px;
        }
        .cat-item { position: relative; height: 100px; background: #eee; }
        .cat-item img { width: 100%; height: 100%; object-fit: cover; }
        .cat-item span { position: absolute; bottom: 5px; width: 100%; text-align: center; color: #fff; font-size: 9px; font-weight: 900; text-shadow: 1px 1px 3px #000; }

        /* --- PRODUITS --- */
        .products { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .p-card { border: 1px solid #f0f0f0; }
        .p-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .p-info { padding: 10px; }
        .p-info h3 { font-size: 11px; margin-bottom: 5px; height: 30px; overflow: hidden; }
        .p-info .price { color: #d91818; font-weight: 900; }
        .add-btn { width: 100%; background: #000; color: #fff; border: none; padding: 10px; font-weight: bold; font-size: 10px; margin-top: 5px; }

        /* --- PANIER DRAWER --- */
        #cart-drawer { position: fixed; top: 0; right: -100%; width: 85%; height: 100%; background: #fff; z-index: 2001; transition: 0.3s; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
        #cart-drawer.active { right: 0; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 2000; }
        #overlay.active { display: block; }
        .cart-item { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .cart-item img { width: 50px; height: 70px; object-fit: cover; }
        .cart-item i { color: #888; margin-left: auto; cursor: pointer; }
    </style>
</head>
<body>

<div id="overlay"></div>

<nav>
