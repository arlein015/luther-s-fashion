<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - TikTok Style avec Recherche</title>
    <style>
        :root {
            --violet-premium: #9c27b0;
            --violet-clair: #ce85f2;
            --rouge-fb: #f02849; /* */
            --blanc: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--rouge-fb);
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            overflow: hidden; color: var(--blanc);
        }

        /* --- BARRE DE RECHERCHE (HAUT) --- */
        .header-search {
            position: fixed;
            top: 0; width: 100%;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            z-index: 100;
        }

        .search-container {
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.2); /* Semi-transparent */
            color: white;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(5px);
        }

        .search-input::placeholder { color: rgba(255, 255, 255, 0.7); }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            opacity: 0.8;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .post-container {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- TEXTE GRAND AU CENTRE --- */
        .main-text {
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
            word-wrap: break-word;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.2);
        }

        /* --- ACTIONS À DROITE --- */
        .right-sidebar {
            position: absolute;
            right: 15px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .circle-bg {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .action-label { font-size: 12px; font-weight: 600; }

        /* --- INFOS UTILISATEUR BAS GAUCHE --- */
        .bottom-user-info {
            position: absolute;
            bottom: 80px;
            left: 15px;
        }

        .user-row {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        /* --- LE BADGE PRO 24 POINTES --- */
        .badge-24 {
            width: 20px; height: 20px;
            position: relative; margin-left: 8px;
            display: flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 0 2px var(--violet-clair));
        }

        .badge-24::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--violet-clair), var(--violet-premium));
            clip-path: polygon(50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%);
            border-radius: 50%;
        }

        .badge-24::after {
            content: ''; position: absolute; width: 5px; height: 9px;
            border: solid white; border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg); margin-top: -1.5px;
        }

        /* --- BARRE DE NAVIGATION BLANCHE --- */
        .footer-nav {
            position: fixed; bottom: 0; width: 100%; height: 60px;
            background: white; display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid #ddd;
        }

        .nav-item { color: #555; font-size: 11px; text-align: center; cursor: pointer; }
        .nav-item.active { color: black; font-weight: bold; }

        .add-btn {
            background: linear-gradient(90deg, #ce85f2, #9c27b0);
            width: 46px; height: 30px; border-radius: 8px; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="header-search">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="Rechercher sur MonRéseau...">
        </div>
    </div>

    <div class="post-container">
        <div class="main-text">zah zalaah ty aiiii</div>

        <div class="right-sidebar">
            <div class="action-btn">
                <div class="circle-bg">❤️</div>
                <span class="action-label">15.2K</span>
            </div>
            <div class="action-btn">
                <div class="circle-bg">💬</div>
                <span class="action-label">428</span>
            </div>
            <div class="action-btn">
                <div class="circle-bg">🔗</div>
                <span class="action-label">Partager</span>
            </div>
        </div>

        <div class="bottom-user-info">
            <div class="user-row">
                Moi (Premium) <div class="badge-24"></div>
            </div>
            <div style="font-size: 14px; opacity: 0.9;">#ZahZalaah #Premium</div>
        </div>
    </div>

    <div class="footer-nav">
        <div class="nav-item active">🏠<br>Accueil</div>
        <div class="nav-item">👥<br>Amis</div>
        <div class="add-btn">+</div>
        <div class="nav-item">💬<br>Boîte</div>
        <div class="nav-item">👤<br>Profil</div>
    </div>

</body>
</html>
