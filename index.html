<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Threndly - Network</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --blue: #2D9CDB; 
            --purple: #BB6BD9; 
            --black: #000000;
            --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); 
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background: #4A5568; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        /* --- DESIGN EXACT DE LA PAGE D'INSCRIPTION (Inspiré de tes images) --- */
        #auth-screen { 
            background: var(--black); width: 90%; max-width: 420px; padding: 40px 30px; 
            border-radius: 20px; text-align: center; border: 1px solid #222; position: relative; z-index: 100;
        }

        .logo-tre { font-size: 2.2rem; font-weight: 900; color: white; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .logo-tre span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        h2 { color: white; margin: 20px 0 10px 0; font-size: 1.6rem; }
        p.sub { color: #888; font-size: 0.9rem; margin-bottom: 30px; }

        .field { text-align: left; margin-bottom: 18px; }
        label { display: block; color: white; font-size: 0.85rem; margin-bottom: 8px; font-weight: 500; }
        
        input { 
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; 
            background: #111; color: white; outline: none; font-size: 1rem;
        }
        input:focus { border-color: var(--blue); }

        .btn-auth { 
            width: 100%; padding: 15px; background: var(--blue); border: none; 
            border-radius: 10px; color: white; font-weight: bold; cursor: pointer; 
            font-size: 1rem; margin-top: 5px; transition: 0.3s;
        }
        .btn-auth:hover { opacity: 0.9; }

        .divider { margin: 25px 0; color: #444; display: flex; align-items: center; font-size: 0.8rem; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #222; margin: 0 15px; }

        .btn-soc { 
            width: 100%; padding: 14px; border-radius: 10px; border: none; color: white; 
            font-weight: 600; margin-top: 12px; display: flex; align-items: center; 
            justify-content: center; gap: 12px; cursor: pointer; font-size: 0.9rem;
        }
        .goog { background: #EA4335; }
        .face { background: #1877F2; }

        .foot-txt { margin-top: 30px; font-size: 0.85rem; color: #888; }
        .foot-txt a { color: var(--blue); text-decoration: none; font-weight: bold; }

        /* --- DESIGN DE TA PAGE DE DISCUSSION --- */
        #chat-screen { position: fixed; inset: 0; background: var(--black); display: none; flex-direction: row; z-index: 50; }
        
        #sidebar { width: 80px; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 25px; }
        .side-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 20px; border: 1px solid #222; }
        
        #main-chat { flex: 1; display: flex; flex-direction: column; }
        header { padding: 18px 25px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: space-between; color: white; }
        
        #msg-list { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 12px 18px; border-radius: 20px; max-width: 75%; font-size: 0.95rem; color: white; line-height: 1.4; }
        .me { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }

        footer { padding: 15px 25px; display: flex; gap: 12px; background: #080808; border-top: 1px solid #1a1a1a; }
        footer input { flex: 1; margin: 0; border-radius: 30px; padding: 12px 20px; }

        /* PAGE VALIDATION */
        #verify-screen { display: none; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="logo-tre"><span>THRENDLY</span><i class="fas fa-chart-line" style="color:var(--blue); font-size:1.8rem;"></i></div>
        <h2>Content de vous revoir</h2>
        <p class="sub">Connectez-vous à votre compte</p>

        <div class="field">
            <label>E-mail ou Numéro</label>
            <input type="text" id="reg-contact" placeholder="vous@entreprise.com">
        </div>
        <div class="field">
            <label>Nom d'utilisateur</label>
            <input type="text" id="reg-user" placeholder="@username">
        </div>
        <div class="field">
            <label>Mot de passe</label>
            <input type="password" id="reg-pass" placeholder="Entrez votre mot de passe">
        </div>

        <button class="btn-auth" onclick="showVerify()">Se connecter</button>

        <div class="divider">OU</div>

        <button class="btn-soc goog"><i class="fab fa-google"></i> Continuer avec Google</button>
        <button class="btn-soc face"><i class="fab fa-facebook-f"></i> Continuer avec Facebook</button>

        <div class="foot-txt">
            <a href="#">Mot de passe oublié ?</a><br><br>
            Vous n'avez pas de compte ? <a href="#" onclick="alert('Inscription')">S'inscrire</a>
        </div>
    </div>

    <div id="verify-screen" id="auth-screen" style="background:var(--black); padding:40px; border-radius:20px; border:1px solid #222; text-align:center; z-index:100;">
        <h2 style="color:white;">Vérification</h2>
        <p style="color:#888;">Entrez le code à 6 chiffres (123456)</p>
        <input type="text" id="v-code" maxlength="6" style="text-align:center; font-size:2rem; letter-spacing:10px; margin:20px 0;">
        <button class="btn-auth" style="background:var(--grad);" onclick="finishAuth()">Valider</button>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <div class="side-icon" style="background:var(--grad); color:white; border:none;">
                <i class="fas fa-th-large"></i>
            </div>
            <div class="side-icon" onclick="alert('Ajouter un ami')">
                <i class="fas fa-plus" style="color:var(--blue);"></i>
            </div>
            <div class="side-icon" style="margin-top:auto;" onclick="localStorage.clear(); location.reload();">
                <i class="fas fa-sign-out-alt" style="color:#444;"></i>
            </div>
        </div>
        
        <div id="main-chat">
            <header>
                <div style="display:flex; align-items:center; gap:12px;">
                    <div style="width:40px; height:40px; border-radius:50%; background:var(--grad);"></div>
                    <span>Threndly Network</span>
                </div>
                <i class="fas fa-ellipsis-h" style="color:#444; cursor:pointer;"></i>
            </header>
            
            <div id="msg-list">
                <p style="color:#333; text-align:center; margin-top:50px;">Sélectionnez un ami pour commencer à discuter</p>
            </div>

            <footer>
                <input type="text" id="msg-in" placeholder="Écrire un message..." onkeypress="if(event.key=='Enter')send()">
                <button onclick="send()" class="btn-auth" style="width:50px; border-radius:50%; margin:0; background:var(--grad);"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myID = "";

        function showVerify() {
            const u = document.getElementById('reg-user').value.trim();
            if(!u) return alert("Pseudo requis");
            myID = u;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('verify-screen').style.display = 'block';
        }

        function finishAuth() {
            const code = document.getElementById('v-code').value;
            if(code === "123456") {
                localStorage.setItem('threndly_id', myID);
                location.reload();
            } else { alert("Code : 123456"); }
        }

        function send() {
            const inp = document.getElementById('msg-in');
            const id = localStorage.getItem('threndly_id');
            if(inp.value.trim()) {
                db.ref("messages/general").push({ from: id, text: inp.value });
                inp.value = "";
            }
        }

        function startChat() {
            db.ref("messages/general").on("child_added", snap => {
                const m = snap.val();
                const id = localStorage.getItem('threndly_id');
                const d = document.createElement('div');
                d.className = `bubble ${m.from === id ? 'me' : 'other'}`;
                d.innerText = m.text;
                document.getElementById('msg-list').appendChild(d);
                document.getElementById('msg-list').scrollTop = document.getElementById('msg-list').scrollHeight;
            });
        }

        // Auto-login
        if(localStorage.getItem('threndly_id')) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.body.style.background = "black";
            startChat();
        }
    </script>
</body>
</html>
