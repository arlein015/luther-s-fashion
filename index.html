<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Threndly - Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --blue: #2D9CDB; --purple: #BB6BD9; --black: #000000;
            --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); 
        }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #4A5568; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* --- AUTH CARD --- */
        .auth-card { 
            background: var(--black); width: 90%; max-width: 420px; padding: 40px 30px; 
            border-radius: 30px; text-align: center; border: 1px solid #222; position: relative; z-index: 10;
        }
        .logo-text { font-size: 2.2rem; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; margin-bottom: 12px; }
        input:focus { border-color: var(--blue); }
        .btn-p { width: 100%; padding: 16px; background: var(--grad); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }

        /* --- CHAT SCREEN --- */
        #chat-screen { position: fixed; inset: 0; background: var(--black); display: none; flex-direction: row; z-index: 20; }
        #sidebar { width: 70px; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        #chat-content { flex: 1; display: flex; flex-direction: column; }
        header { padding: 15px 20px; border-bottom: 1px solid #1a1a1a; font-weight: bold; color: white; display: flex; justify-content: space-between; }
        #msg-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .bubble { padding: 12px 16px; border-radius: 18px; max-width: 75%; color: white; font-size: 0.95rem; cursor: pointer; }
        .me { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }

        footer { padding: 15px; display: flex; gap: 10px; background: #080808; border-top: 1px solid #1a1a1a; }
        
        /* MODAL AMIS */
        #friends-list { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; padding: 40px 20px; }
        .user-item { padding: 15px; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 10px; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div id="auth-box" class="auth-card">
        <div class="logo-text">THRENDLY <i class="fas fa-chart-line"></i></div>
        <input type="text" id="reg-user" placeholder="@username">
        <input type="text" id="reg-name" placeholder="Nom complet">
        <input type="password" id="reg-pass" placeholder="Mot de passe">
        <button class="btn-p" onclick="goVerify()">S'inscrire</button>
        <p style="color:#555; font-size:0.8rem; margin-top:20px;">Déjà un compte ? <span style="color:var(--blue)" onclick="location.reload()">Connexion</span></p>
    </div>

    <div id="verify-box" class="auth-card" style="display:none;">
        <h2>Vérification</h2>
        <p style="color:#888">Code à 6 chiffres (123456)</p>
        <input type="text" id="v-code" maxlength="6" style="text-align:center; font-size:1.5rem; letter-spacing:10px;">
        <button class="btn-p" onclick="finishAll()">Valider</button>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <div style="width:40px; height:40px; background:var(--grad); border-radius:10px; margin-bottom:20px;"></div>
            <i class="fas fa-plus-circle" style="color:var(--blue); font-size:1.8rem; cursor:pointer;" onclick="showFriends()"></i>
            <i class="fas fa-sign-out-alt" style="color:#333; margin-top:auto; margin-bottom:20px;" onclick="logout()"></i>
        </div>
        <div id="chat-content">
            <header>
                <span id="partner-name">Discussion</span>
                <i class="fas fa-ellipsis-v" style="color:#444"></i>
            </header>
            <div id="msg-list"></div>
            <footer>
                <input type="text" id="m-in" placeholder="Votre message..." onkeypress="if(event.key=='Enter')send()">
                <button onclick="send()" class="btn-p" style="width:50px; border-radius:50%; margin:0;"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </div>
    </div>

    <div id="friends-list">
        <h2 style="color:white; text-align:center;">Nouveaux Amis</h2>
        <div id="u-container"></div>
        <button class="btn-p" style="margin-top:20px; background:#222;" onclick="hideFriends()">Fermer</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myID = localStorage.getItem('threndly_id') || "";
        let chatKey = "";
        let tempUser = {};

        // --- DÉMARRAGE ---
        window.onload = () => {
            if(myID) { 
                document.body.style.background = "black";
                document.getElementById('auth-box').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                listenForUsers();
            }
        };

        function goVerify() {
            const u = document.getElementById('reg-user').value.trim().toLowerCase();
            if(!u) return alert("Pseudo requis");
            tempUser = { user: u, name: document.getElementById('reg-name').value };
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('verify-box').style.display = 'block';
        }

        function finishAll() {
            if(document.getElementById('v-code').value === "123456") {
                db.ref("profiles/"+tempUser.user).set(tempUser);
                localStorage.setItem('threndly_id', tempUser.user);
                location.reload();
            }
        }

        function showFriends() {
            document.getElementById('friends-list').style.display = 'flex';
        }
        function hideFriends() { document.getElementById('friends-list').style.display = 'none'; }

        function listenForUsers() {
            db.ref("profiles").on("value", snap => {
                const cont = document.getElementById('u-container');
                cont.innerHTML = "";
                snap.forEach(u => {
                    if(u.key !== myID) {
                        const d = document.createElement('div');
                        d.className = "user-item";
                        d.innerHTML = `<div style="width:35px;height:35px;background:var(--grad);border-radius:50%"></div><b>${u.key}</b>`;
                        d.onclick = () => startChat(u.key);
                        cont.appendChild(d);
                    }
                });
            });
        }

        function startChat(other) {
            chatKey = [myID, other].sort().join("_");
            document.getElementById('partner-name').innerText = other;
            hideFriends();
            loadMessages();
        }

        function send() {
            const inp = document.getElementById('m-in');
            if(inp.value.trim() && chatKey) {
                db.ref("messages/"+chatKey).push({ from: myID, text: inp.value, time: Date.now() });
                inp.value = "";
            }
        }

        function loadMessages() {
            const box = document.getElementById('msg-list');
            db.ref("messages/"+chatKey).off();
            box.innerHTML = "";
            db.ref("messages/"+chatKey).on("child_added", snap => {
                const m = snap.val();
                const d = document.createElement('div');
                d.className = `bubble ${m.from === myID ? 'me' : 'other'}`;
                d.innerText = m.text;
                // Option suppression au clic
                d.onclick = () => { if(m.from === myID && confirm("Supprimer ?")) snap.ref.remove(); };
                box.appendChild(d);
                box.scrollTop = box.scrollHeight;
            });
            // Pour la suppression en direct
            db.ref("messages/"+chatKey).on("child_removed", () => loadMessages());
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
