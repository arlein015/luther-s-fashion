<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Boutique Exclusive</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #FF0000; --bg: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); padding-bottom: 80px; }

        /* --- HEADER & RECHERCHE --- */
        header { padding: 12px 15px; background: #fff; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .logo { font-weight: 900; font-size: 24px; text-decoration: none; color: #000; }
        .search-container { position: relative; margin: 10px 0; }
        .search-container input { width: 100%; padding: 10px 40px; border: none; background: #f0f0f0; border-radius: 50px; font-size: 14px; }
        .search-container i { position: absolute; left: 15px; top: 12px; color: #888; }
        
        /* --- FILTRES --- */
        .nav-tabs { display: flex; gap: 20px; padding: 10px 15px; overflow-x: auto; scrollbar-width: none; }
        .nav-item { font-size: 12px; font-weight: 900; color: #888; text-transform: uppercase; cursor: pointer; }
        .nav-item.active { color: #000; border-bottom: 2px solid #000; padding-bottom: 5px; }

        /* --- GRILLE RÉDUITE (2 PRODUITS) --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; }
        .card img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 12px; }
        .badge { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff; padding: 3px 8px; font-size: 10px; font-weight: 900; border-radius: 3px; }
        .price { font-weight: 900; color: var(--accent); font-size: 18px; margin: 5px 0; }
        .add-btn { width: 100%; background: #222; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 900; font-size: 11px; cursor: pointer; margin-top: 5px; }

        /* --- MODALS --- */
        #product-detail, #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; display: none; overflow-y: auto; padding: 20px; }
        .size-box { border: 1px solid #ddd; padding: 12px; font-size: 11px; font-weight: 700; border-radius: 5px; min-width: 50px; text-align: center; cursor: pointer; }
        .size-box.selected { border: 2px solid #000; background: #f9f9f9; }
        .add-bag-big { width: 100%; background: #000; color: #fff; padding: 20px; border: none; font-weight: 900; border-radius: 50px; margin: 20px 0; cursor: pointer; }

        /* --- NAVIGATION BASSE --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #eee; z-index: 1001; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 700; cursor: pointer; color: #000; text-decoration: none; }
    </style>
</head>
<body>

<div id="auth-modal">
    <div style="text-align: right;"><i class="fas fa-times" onclick="closeAuth()" style="font-size: 24px; cursor: pointer;"></i></div>
    <h2 style="font-weight: 900; margin-top: 20px; text-transform: uppercase;">Sign up for discounts + updates</h2>
    <div style="position: relative; margin-top: 20px;">
        <input type="text" style="width:100%; padding:18px; border:1px solid #ddd; border-radius:5px;" placeholder="Phone Number or Email">
        <button onclick="alert('Bienvenue chez Luther !')" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:#000; color:#fff; width:35px; height:35px; border-radius:50%; border:none; cursor:pointer;"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<div id="product-detail">
    <i class="fas fa-chevron-left" onclick="closeDetail()" style="font-size: 22px; cursor: pointer;"></i>
    <img id="detail-img" style="width: 100%; margin-top:15px; border-radius:15px;" src="">
    <h2 id="detail-name" style="margin-top:20px; font-size:18px;"></h2>
    <div id="detail-price" class="price" style="font-size: 24px;"></div>
    <div style="font-size:12px; font-weight:900; margin-top:20px;">SIZE | <span style="text-decoration:underline;">VIEW SIZE GUIDE</span></div>
    <div style="display:flex; gap:10px; margin-top:15px; overflow-x:auto;">
        <div class="size-box" onclick="selectSize(this)">S</div>
        <div class="size-box" onclick="selectSize(this)">M</div>
        <div class="size-box" onclick="selectSize(this)">L</div>
        <div class="size-box" onclick="selectSize(this)">XL</div>
    </div>
    <button class="add-bag-big" onclick="addToBag()">ADD TO BAG</button>
</div>

<header>
    <div class="header-top">
        <i class="fas fa-bars" onclick="openAuth()" style="cursor:pointer;"></i>
        <a href="#" class="logo">LUTHER</a>
        <div style="display: flex; gap: 15px; align-items:center;">
            <span style="font-weight:900; font-size:12px; cursor:pointer;">FR</span>
            <i class="far fa-user" onclick="openAuth()" style="cursor:pointer;"></i>
            <div style="position: relative;">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count" style="position: absolute; top: -8px; right: -8px; background: red; color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 50%;">0</span>
            </div>
        </div>
    </div>
    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Trouve ton style...">
    </div>
</header>

<div class="nav-tabs">
    <div class="nav-item active">NOUVEAUTÉS</div>
    <div class="nav-item">FEMMES</div>
    <div class="nav-item">HOMMES</div>
    <div class="nav-item" style="color:red;">SOLDES</div>
</div>

<div class="grid">
    <div class="card" onclick="openDetail('Veste Edition #1', '73.45 $', 'veste jaune.jpg')">
        <div class="badge">-20%</div>
        <img src="veste jaune.jpg">
        <div style="padding:10px 0;">
            <div style="font-size:11px; color:#666;">Luther Selection</div>
            <div style="font-weight: 700;">Veste Edition #1</div>
            <div class="price">73.45 $</div>
            <button class="add-btn">AJOUTER AU PANIER</button>
        </div>
    </div>
    <div class="card" onclick="openDetail('Veste Edition #2', '48.68 $', 'Veste vert.jpg')">
        <div class="badge">-20%</div>
        <img src="Veste vert.jpg">
        <div style="padding:10px 0;">
            <div style="font-size:11px; color:#666;">Luther Selection</div>
            <div style="font-weight: 700;">Veste Edition #2</div>
            <div class="price">48.68 $</div>
            <button class="add-btn">AJOUTER AU PANIER</button>
        </div>
        <div class="card" onclick="openDetail('NOM DU PRODUIT', 'PRIX $', 'NOM_IMAGE.jpg')">
    <div class="badge">-20%</div>
    <img src="NOM_IMAGE.jpg">
    <div style="padding:10px 0;">
        <div style="font-size:11px; color:#666;">Luther Selection</div>
        <div style="font-weight: 700;">NOM DU PRODUIT</div>
        <div class="price">PRIX $</div>
        <button class="add-btn">AJOUTER AU PANIER</button>
    </div>
</div>
    </div>
</div>

<div class="bottom-nav">
    <div class="bottom-nav-item" onclick="window.scrollTo(0,0)"><i class="fas fa-home"></i>Accueil</div>
    <div class="bottom-nav-item" onclick="alert('Recherche active')"><i class="fas fa-search"></i>Explorer</div>
    <div class="bottom-nav-item" onclick="alert('Favoris')"><i class="far fa-heart"></i>Favoris</div>
    <div class="bottom-nav-item" onclick="openAuth()"><i class="far fa-user"></i>Profil</div>
</div>

<script>
    // ==========================================
    // ZONE PROPRIÉTAIRE : AJOUTE TES PRODUITS ICI
    // ==========================================
    const mesProduits = [
        {
            nom: "Veste Edition #1",
            prix: "73.45 $",
            image: "veste jaune.jpg",
            promo: "-20%"
        },
        {
            nom: "Veste Edition #2",
            prix: "48.68 $",
            image: "Veste vert.jpg",
            promo: "-20%"
        },
        // Pour ajouter un 3ème produit, retire les "//" ci-dessous et complète :
        // { nom: "Nouveau Style", prix: "55.00 $", image: "photo.jpg", promo: "NEW" },
    ];

    // ==========================================
    // LE SYSTÈME AUTOMATIQUE (NE PAS TOUCHER)
    // ==========================================
    const grid = document.getElementById('main-grid');
    
    mesProduits.forEach((p, index) => {
        grid.innerHTML += `
            <div class="card" onclick="openDetail(${index})">
                <div class="badge">${p.promo}</div>
                <img src="${p.image}">
                <div style="padding:10px 0;">
                    <div style="font-size:11px; color:#666;">Luther Selection</div>
                    <div style="font-weight: 700;">${p.nom}</div>
                    <div class="price">${p.prix}</div>
                    <button class="add-btn">AJOUTER AU PANIER</button>
                </div>
            </div>`;
    });

    function openDetail(idx) {
        const p = mesProduits[idx];
        document.getElementById('detail-img').src = p.image;
        document.getElementById('detail-name').innerText = p.nom;
        document.getElementById('detail-price').innerText = p.prix;
        document.getElementById('product-detail').style.display = 'block';
        window.scrollTo(0,0);
    }
    // ... reste des fonctions (closeDetail, addToBag, etc.)
</script>
