<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - Final Look</title>
    <style>
        :root { 
            --violet-premium: #9c27b0; 
            --violet-clair: #ce85f2; 
            --rouge-fb: #f02849; 
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: black; color: white; overflow: hidden; }

        /* --- BARRE DE RECHERCHE + LIVE --- */
        .top-bar {
            position: fixed; top: 0; width: 100%; padding: 15px 10px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 100; box-sizing: border-box;
        }
        .live-icon { 
            background: rgba(255, 255, 255, 0.2); border-radius: 50%; 
            width: 40px; height: 40px; display: flex; align-items: center; 
            justify-content: center; font-size: 20px; cursor: pointer;
        }
        .search-container { flex: 1; margin: 0 15px; position: relative; }
        .search-input {
            width: 100%; padding: 10px 15px; border-radius: 20px; border: none;
            background: rgba(255, 255, 255, 0.2); color: white; backdrop-filter: blur(10px);
        }

        /* --- POST --- */
        .post-container { height: 100vh; width: 100%; background: var(--rouge-fb); display: flex; align-items: center; justify-content: center; position: relative; }
        .main-text { font-size: 38px; font-weight: bold; text-align: center; z-index: 5; }

        /* --- ACTIONS DROITE --- */
        .side-actions { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 18px; align-items: center; }
        
        /* PHOTO DE PROFIL SUR LE LIKE */
        .user-avatar {
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid white;
            background: #ccc; margin-bottom: 5px; overflow: hidden; cursor: pointer;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .circle { width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }

        /* --- LE BADGE 24 POINTES --- */
        .badge-24 {
            width: 20px; height: 20px; display: inline-block; position: relative; vertical-align: middle; margin-left: 5px;
            filter: drop-shadow(0 0 2px var(--violet-clair));
        }
        .badge-24::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--violet-clair), var(--violet-premium));
            clip-path: polygon(50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%);
            border-radius: 50%;
        }
        .badge-24::after { content: ''; position: absolute; width: 5px; height: 8px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); left: 7px; top: 4px; }

        /* --- NAV BASSE --- */
        .footer-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: white; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: black; font-size: 11px; text-align: center; }
        .btn-add { background: linear-gradient(90deg, #ce85f2, #9c27b0); width: 45px; height: 30px; border-radius: 8px; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="live-icon" onclick="alert('Lancement du Direct... 🎥')">📹</div>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="🔍 Rechercher...">
        </div>
    </div>

    <div class="post-container">
        <div class="main-text">zah zalaah ty aiiii</div>

        <div class="side-actions">
            <div class="user-avatar" onclick="alert('Profil de l\'auteur')">
                <img src="https://via.placeholder.com/50" alt="Profil">
            </div>
            <div class="circle" onclick="this.style.color='red'">❤️</div>
            <div class="circle" onclick="alert('Commentaires')">💬</div>
        </div>

        <div style="position:absolute; bottom:80px; left:15px; z-index:10;">
            <div style="font-weight:bold; font-size:18px; display:flex; align-items:center;">
                Moi (Premium) <div class="badge-24"></div>
            </div>
            <div style="font-size:14px; opacity:0.9;">#ZahZalaah #Premium</div>
        </div>
    </div>

    <div class="footer-nav">
        <div class="nav-item">🏠<br>Accueil</div>
        <div class="btn-add" onclick="alert('Ajouter une publication')">+</div>
        <div class="nav-item">👤<br>Profil</div>
    </div>

</body>
</html>
