<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --violet-p: #9c27b0; --pink-notif: #ff3b5c; --blue-cert: #20d5ec; --bg-light: #f1f1f1; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: white; overflow: hidden; height: 100%; width: 100%; }

        /* --- SYSTÈME DE PAGES --- */
        .page { display: none; height: calc(100% - 60px); width: 100%; overflow-y: auto; }
        .active-page { display: flex; flex-direction: column; }

        /* --- PAGE RECHERCHE (NOUVEAU) --- */
        .search-container { padding: 15px; }
        .search-bar { background: #eee; border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .search-bar input { border: none; background: transparent; outline: none; width: 100%; }
        .explore-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .explore-item { aspect-ratio: 1/1; background: #ddd; background-size: cover; }

        /* --- PAGE MESSAGES --- */
        .header-msg { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #f0f0f0; align-items: center; background: white; }
        .stories { display: flex; gap: 15px; padding: 15px; overflow-x: auto; border-bottom: 1px solid #f5f5f5; }
        .story img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--blue-cert); padding: 2px; }
        .msg-item { display: flex; align-items: center; padding: 12px 15px; gap: 12px; cursor: pointer; }
        .badge-red { background: var(--pink-notif); color: white; font-size: 11px; font-weight: bold; min-width: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: auto; padding: 0 5px; }

        /* --- VUE CHAT & CLAVIER --- */
        #view-chat { position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: #f0f2f5; z-index: 2000; transition: 0.3s; display: flex; flex-direction: column; }
        #view-chat.active { left: 0; }
        .chat-header { background: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; }
        .chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 14px; }
        .sent { background: var(--violet-p); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .input-bar { padding: 8px 12px; background: white; display: flex; align-items: center; gap: 10px; border-top: 1px solid #eee; }
        .btn-camera-blue { background: #00a2f8; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .input-container-wrapper { flex-grow: 1; position: relative; display: flex; align-items: center; }
        .input-field { width: 100%; background: var(--bg-light); border: 1px solid #e0e0e0; padding: 10px 75px 10px 15px; border-radius: 25px; outline: none; }
        .inner-icons { position: absolute; right: 15px; display: flex; gap: 12px; color: #555; font-size: 18px; cursor: pointer; }

        /* --- PAGE PROFIL --- */
        .profile-header { padding: 20px; text-align: center; }
        .profile-pic { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--blue-cert); padding: 3px; }

        /* --- NAV BAS --- */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: white; font-size: 22px; opacity: 0.6; cursor: pointer; }
        .nav-item.active { opacity: 1; }
    </style>
</head>
<body>

    <div id="page-search" class="page">
        <div class="search-container">
            <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Rechercher sur Threndly..."></div>
        </div>
        <div class="explore-grid">
            <div class="explore-item" style="background-image:url('https://picsum.photos/200/200?1')"></div>
            <div class="explore-item" style="background-image:url('https://picsum.photos/200/200?2')"></div>
            <div class="explore-item" style="background-image:url('https://picsum.photos/200/200?3')"></div>
        </div>
    </div>

    <div id="page-messages" class="page active-page">
        <div class="header-msg"><i class="fas fa-users"></i><b>Messages •</b><i class="fas fa-search"></i></div>
        <div class="stories" id="story-line"></div>
        <div id="contact-list"></div>
    </div>

    <div id="page-profile" class="page">
        <div class="profile-header">
            <img src="https://i.pravatar.cc/150?u=th" class="profile-pic">
            <div style="font-weight:bold; margin-top:10px;">Threndly <i class="fas fa-check-circle" style="color: var(--blue-cert);"></i></div>
        </div>
    </div>

    <div id="view-chat">
        <div class="chat-header">
            <i class="fas fa-arrow-left" onclick="closeChat()"></i>
            <b id="chat-name">Discussion</b>
            <i class="fas fa-ellipsis-v"></i>
        </div>
        <div class="chat-messages" id="chat-box"></div>
        
        <div class="input-bar">
            <div class="btn-camera-blue" onclick="alert('Lancement Caméra...')"><i class="fas fa-camera"></i></div>
            <div class="input-container-wrapper">
                <input type="text" class="input-field" id="chatInput" placeholder="Message..." oninput="toggleIcons()">
                <div class="inner-icons">
                    <i class="far fa-image" onclick="alert('Ouverture Galerie...')"></i>
                    <i class="far fa-smile" onclick="alert('Menu Stickers...')"></i>
                </div>
            </div>
            <i class="fas fa-microphone" id="micBtn" style="font-size:22px; color:#555;" onclick="alert('Enregistrement vocal...')"></i>
            <i class="fas fa-paper-plane" id="sendBtn" style="display:none; font-size:22px; color:var(--violet-p);" onclick="sendMessage()"></i>
        </div>
    </div>

    <div class="nav-bottom">
        <i class="fas fa-home nav-item" onclick="switchPage('home')"></i>
        <i id="nav-search" class="fas fa-search nav-item" onclick="switchPage('search')"></i>
        <div style="background:linear-gradient(to right, #20d5ec, var(--violet-p)); padding:5px 15px; border-radius:8px;"><b>+</b></div>
        <i id="nav-msg" class="fas fa-envelope nav-item active" onclick="switchPage('messages')"></i>
        <i id="nav-prof" class="fas fa-user nav-item" onclick="switchPage('profile')"></i>
    </div>

    <script>
        const contacts = [{ id: 1, name: "Norah Nelsie", img: "https://i.pravatar.cc/100?u=1", last: "ilbsdkjbiqsUHdmbqs", count: 1 }];

        function switchPage(p) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            if(p==='messages') { document.getElementById('page-messages').classList.add('active-page'); document.getElementById('nav-msg').classList.add('active'); renderList(); }
            else if(p==='profile') { document.getElementById('page-profile').classList.add('active-page'); document.getElementById('nav-prof').classList.add('active'); }
            else if(p==='search') { document.getElementById('page-search').classList.add('active-page'); document.getElementById('nav-search').classList.add('active'); }
        }

        function openChat(id) { document.getElementById('chat-name').innerText = contacts[0].name; document.getElementById('view-chat').classList.add('active'); }
        function closeChat() { document.getElementById('view-chat').classList.remove('active'); }

        function toggleIcons() {
            const val = document.getElementById('chatInput').value;
            document.getElementById('micBtn').style.display = val ? 'none' : 'block';
            document.getElementById('sendBtn').style.display = val ? 'block' : 'none';
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const box = document.getElementById('chat-box');
            if(input.value.trim() !== "") {
                box.innerHTML += `<div class="bubble sent">${input.value}</div>`; //
                input.value = ""; toggleIcons();
                box.scrollTop = box.scrollHeight;
            }
        }

        function renderList() {
            const list = document.getElementById('contact-list');
            list.innerHTML = "";
            contacts.forEach(c => {
                list.innerHTML += `<div class="msg-item" onclick="openChat(${c.id})"><img src="${c.img}" style="width:50px; border-radius:50%;"><div><b>${c.name}</b><br><small>${c.last}</small></div><div class="badge-red">${c.count}</div></div>`;
            });
        }
        renderList();
    </script>
</body>
</html>
