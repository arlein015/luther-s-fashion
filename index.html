<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther's Fashion - Global Network</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --violet: #9c27b0; --light-violet: #ce85f2; --tiktok-red: #ff3b5c; --bg: #1a0121; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }

        /* --- NAVIGATION HAUT --- */
        .top-nav { position: fixed; top: 0; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 100; padding-top: 10px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .search-bar { width: 85%; background: rgba(255,255,255,0.15); border-radius: 20px; padding: 8px 15px; display: flex; align-items: center; margin-bottom: 10px; backdrop-filter: blur(5px); }
        .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; margin: 0 10px; }
        .feed-tabs { display: flex; gap: 25px; font-weight: bold; font-size: 17px; margin-top: 5px; }
        .tab.active { border-bottom: 3px solid white; padding-bottom: 5px; }

        /* --- STORIES --- */
        .stories-container { position: fixed; top: 90px; width: 100%; display: flex; gap: 15px; padding: 10px; overflow-x: auto; white-space: nowrap; z-index: 90; scrollbar-width: none; }
        .story-circle { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--light-violet); padding: 2px; flex-shrink: 0; position: relative; }
        .story-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .my-story .add-icon { position: absolute; bottom: 0; right: 0; background: var(--violet); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid var(--bg); }

        /* --- FEED VIDEO (STYLE TIKTOK) --- */
        .video-feed { height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; padding-bottom: 90px; background: #e60023; /* Rouge TikTok */ }
        .post-info { max-width: 80%; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }
        .user-name { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 18px; margin-bottom: 8px; }

        /* BADGE 24 POINTES */
        .badge-24 { width: 18px; height: 18px; background: white; clip-path: polygon(50% 0%, 58% 10%, 68% 5%, 72% 16%, 83% 15%, 83% 26%, 93% 30%, 90% 41%, 98% 50%, 90% 59%, 93% 70%, 83% 74%, 83% 85%, 72% 84%, 68% 95%, 58% 90%, 50% 100%, 42% 90%, 32% 95%, 28% 84%, 17% 85%, 17% 74%, 7% 70%, 10% 59%, 2% 50%, 10% 41%, 7% 30%, 17% 26%, 17% 15%, 28% 16%, 32% 5%, 42% 10%); display: flex; align-items: center; justify-content: center; }
        .badge-24::after { content: '✔'; color: var(--violet); font-size: 10px; font-weight: bold; }

        /* ACTIONS DROITE */
        .side-actions { position: fixed; right: 12px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 100; }
        .action-item { text-align: center; font-size: 13px; font-weight: bold; }
        .action-item i { font-size: 32px; margin-bottom: 4px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .heart.active { color: #ff2d55; animation: heartBeat 0.4s ease; }
        @keyframes heartBeat { 0% {transform:scale(1);} 50% {transform:scale(1.3);} 100% {transform:scale(1);} }

        .profile-btn { position: relative; margin-bottom: 15px; }
        .profile-btn img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; }
        .plus-red { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: #ff2d55; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }

        .music-disc { width: 45px; height: 45px; background: radial-gradient(circle, #444 20%, #000 100%); border-radius: 50%; animation: rotate 4s linear infinite; border: 8px solid #222; margin-top: 10px; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* BARRE NAVIGATION BAS */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: black; display: flex; justify-content: space-around; align-items: center; z-index: 200; border-top: 0.5px solid #333; }
        .btn-plus { background: linear-gradient(to right, #20d5ec 15%, #ff2d55 85%); padding: 6px 16px; border-radius: 12px; font-weight: bold; color: black; font-size: 18px; }
        .notif-badge { position: absolute; top: -6px; right: -6px; background: red; color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid black; }

        /* MODAL INSCRIPTION */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 5000; }
        .modal-card { background: white; color: black; width: 90%; max-width: 380px; padding: 25px; border-radius: 20px; text-align: center; }
        .social-btn { display: flex; align-items: center; width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; cursor: pointer; font-weight: 600; position: relative; }
        .social-btn i { font-size: 20px; position: absolute; left: 15px; }
        
        /* MENU PARAMETRES */
        #settingsMenu { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 6000; padding: 20px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Rechercher...">
            <i class="fas fa-camera"></i>
        </div>
        <div class="feed-tabs">
            <span class="tab">Suivi</span>
            <span class="tab active">Pour toi</span>
        </div>
    </div>

    <div class="stories-container">
        <div class="story-circle my-story" onclick="document.getElementById('fileInput').click()">
            <img id="myAvatar" src="https://via.placeholder.com/100" alt="Moi">
            <div class="add-icon">+</div>
        </div>
        <div class="story-circle"><img src="https://i.pravatar.cc/100?u=1"></div>
        <div class="story-circle"><img src="https://i.pravatar.cc/100?u=2"></div>
        <div class="story-circle"><img src="https://i.pravatar.cc/100?u=3"></div>
    </div>

    <div class="video-feed">
        <div class="post-info">
            <div class="user-name"><span id="userTag">Luther</span> <div class="badge-24"></div></div>
            <p>Bienvenue sur le réseau officiel de Luther's Fashion ! 🚀 #LuthersFashion #Premium</p>
            <p><i class="fas fa-music"></i> <marquee scrollamount="3" style="width: 150px;">Luther - Musique Originale 2024</marquee></p>
        </div>

        <div class="side-actions">
            <div class="profile-btn" onclick="openLogin()">
                <img id="mainAvatar" src="https://via.placeholder.com/100">
                <div class="plus-red">+</div>
            </div>
            <div class="action-item" onclick="handleLike(this)">
                <i class="fas fa-heart heart"></i><br>150K
            </div>
            <div class="action-item">
                <i class="fas fa-comment-dots"></i><br>856
            </div>
            <div class="action-item">
                <i class="fas fa-bookmark"></i><br>12K
            </div>
            <div class="action-item" onclick="shareNow()">
                <i class="fas fa-share"></i><br>Partager
            </div>
            <div class="music-disc"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <i class="fas fa-home" style="font-size: 22px;"></i>
        <i class="fas fa-compass" style="font-size: 22px;"></i>
        <div class="btn-plus" onclick="openLogin()">+</div>
        <div style="position: relative;">
            <i class="fas fa-envelope" style="font-size: 22px;"></i>
            <div class="notif-badge">1</div>
        </div>
        <i class="fas fa-user" onclick="openLogin()" style="font-size: 22px;"></i>
    </div>

    <div id="loginModal" class="modal-overlay">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <span onclick="closeLogin()" style="cursor:pointer; font-size:20px;">✕</span>
                <h3 style="margin:0;">S'inscrire à Luther's</h3>
                <span></span>
            </div>
            
            <input type="text" id="regEmail" placeholder="Email ou Identifiant" style="width:90%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">
            <input type="password" id="regPass" placeholder="Mot de passe" style="width:90%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">
            
            <select id="regCountry" style="width:97%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd;">
                <option value="">🌍 Choisis ton pays</option>
                <option value="France">🇫🇷 France</option>
                <option value="USA">🇺🇸 USA</option>
                <option value="Maroc">🇲🇦 Maroc</option>
                <option value="Congo">🇨🇬 Congo</option>
                <option value="Sénégal">🇸🇳 Sénégal</option>
            </select>

            <div class="social-btn" onclick="submitData('Google')" style="background:#f5f5f5;"><i class="fab fa-google" style="color:#4285F4;"></i> Continuer avec Google</div>
            <div class="social-btn" onclick="submitData('Apple')" style="background:#000; color:#fff;"><i class="fab fa-apple"></i> Continuer avec Apple</div>
            <div class="social-btn" onclick="submitData('Facebook')" style="background:#1877F2; color:#fff; border:none;"><i class="fab fa-facebook"></i> Continuer avec Facebook</div>

            <button onclick="submitData('Direct')" style="width:100%; background:var(--tiktok-red); color:#fff; border:none; padding:15px; border-radius:10px; font-weight:bold; margin-top:10px; cursor:pointer;">
                Créer mon compte
            </button>
        </div>
    </div>

    <input type="file" id="fileInput" style="display:none;" onchange="loadPhoto(event)">

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzmWi55H7--DzkuiTHWS4Q4xmqeBq9WvkLpd0y9GIpTL3osmmL4zpACStbOCOwYgw0Q/exec";

        function openLogin() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeLogin() { document.getElementById('loginModal').style.display = 'none'; }

        function handleLike(btn) {
            const heart = btn.querySelector('.heart');
            heart.classList.toggle('active');
            if(heart.classList.contains('active')) {
                confetti({ particleCount: 30, spread: 60, origin: { x: 0.9, y: 0.7 }, colors: ['#ff2d55'] });
            }
        }

        function submitData(method) {
            const email = document.getElementById('regEmail').value;
            const mdp = document.getElementById('regPass').value;
            const pays = document.getElementById('regCountry').value;

            if(!email || !mdp || !pays) { alert("Veuillez remplir tous les champs !"); return; }

            // Envoi Google Sheets
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ methode: method, nom: email, mdp: mdp, pays: pays })
            });

            // Succès visuel
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            document.getElementById('userTag').innerText = email;
            closeLogin();
            alert("✨ Bienvenue " + email + " ! Ton compte est créé.");
        }

        function loadPhoto(e) {
            const reader = new FileReader();
            reader.onload = function(){
                document.getElementById('myAvatar').src = reader.result;
                document.getElementById('mainAvatar').src = reader.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function shareNow() {
            if (navigator.share) {
                navigator.share({ title: "Luther's Fashion", url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Lien copié ! Partage-le avec tes amis.");
            }
        }
    </script>
</body>
</html>
