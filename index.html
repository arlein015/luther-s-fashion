<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther's Fashion - White Symbole Blue Badge</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --tiktok-blue: #20d5ec; --bg-dark: #1a0121; --bg-light: #3a0e4e; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg-dark); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        .main-container { height: 100vh; background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%); position: relative; }

        /* BADGE BLEU AVEC SYMBOLE FRAIS BLANC */
        .badge-24 { 
            width: 18px; height: 18px; 
            background: white; /* Fond blanc du badge */
            clip-path: polygon(50% 0%, 58% 10%, 68% 5%, 72% 16%, 83% 15%, 83% 26%, 93% 30%, 90% 41%, 98% 50%, 90% 59%, 93% 70%, 83% 74%, 83% 85%, 72% 84%, 68% 95%, 58% 90%, 50% 100%, 42% 90%, 32% 95%, 28% 84%, 17% 85%, 17% 74%, 7% 70%, 10% 59%, 2% 50%, 10% 41%, 7% 30%, 17% 26%, 17% 15%, 28% 16%, 32% 5%, 42% 10%); 
            display: flex; align-items: center; justify-content: center; 
            border: 2px solid var(--tiktok-blue); /* Contour bleu du badge */
            box-sizing: border-box; /* Pour que la bordure ne réduise pas la taille */
        }
        .badge-24::after { 
            content: '✔'; /* Le symbole frais (check) */
            color: white; /* Couleur du check (frais) en blanc */
            font-size: 10px; font-weight: bold; 
            text-shadow: -1px -1px 0 var(--tiktok-blue), 1px -1px 0 var(--tiktok-blue), -1px 1px 0 var(--tiktok-blue), 1px 1px 0 var(--tiktok-blue); /* Contour bleu autour du check blanc pour la visibilité */
        }

        /* ACTIONS DROITE */
        .side-actions { position: absolute; right: 10px; bottom: 120px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
        .action-btn { text-align: center; font-size: 14px; cursor: pointer; text-shadow: 1px 1px 3px black; }
        .action-btn i { font-size: 30px; margin-bottom: 5px; }
        .heart-active { color: #ff3b5c; transform: scale(1.2); transition: 0.3s; }

        /* NAVIGATION BAS */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 65px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 0.5px solid #333; z-index: 100; }
        .btn-plus { background: linear-gradient(to right, #20d5ec, #ff3b5c); padding: 5px 15px; border-radius: 10px; color: black; font-weight: bold; cursor: pointer; }

        /* MODALES */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; color: black; width: 85%; padding: 25px; border-radius: 20px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="main-container">
        <div style="position: absolute; bottom: 90px; left: 15px;">
            <div style="display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px;">
                @<span id="displayUser">Luther</span> 
                <div class="badge-24"></div>
            </div>
            <p>Frais blanc, contour bleu ! C'est le style Luther's Fashion. 🚀</p>
        </div>

        <div class="side-actions">
            <div class="action-btn" onclick="toggleLike(this)">
                <i class="fas fa-heart" id="heartIcon"></i><br>
                <span id="countLike">0</span>
            </div>
            <div class="action-btn" onclick="openComments()">
                <i class="fas fa-comment-dots"></i><br>
                <span id="countComm">0</span>
            </div>
            <div class="action-btn" onclick="alert('Lien copié !')">
                <i class="fas fa-share"></i><br>Partager
            </div>
        </div>

        <div class="bottom-nav">
            <i class="fas fa-home" onclick="location.reload()"></i>
            <i class="fas fa-compass"></i>
            <div class="btn-plus" onclick="document.getElementById('modalAuth').style.display='flex'">+</div>
            <i class="fas fa-envelope"></i>
            <i class="fas fa-user" onclick="document.getElementById('modalAuth').style.display='flex'"></i>
        </div>
    </div>

    <div id="modalComm" class="modal">
        <div class="modal-content">
            <h3>Commentaires</h3>
            <div id="listComm" style="text-align:left; max-height:150px; overflow-y:auto; margin-bottom:15px; font-size:14px;">
                <p style="color:gray; font-style:italic;">Soyez le premier à commenter...</p>
            </div>
            <input type="text" id="inputComm" placeholder="Votre commentaire...">
            <button onclick="addComment()" style="width:100%; background:black; color:white; padding:12px; border-radius:10px; border:none; font-weight:bold; cursor:pointer;">Publier</button>
            <p onclick="document.getElementById('modalComm').style.display='none'" style="margin-top:15px; color:red; cursor:pointer;">Fermer</p>
        </div>
    </div>

    <div id="modalAuth" class="modal">
        <div class="modal-content">
            <h3>Profil Luther's Fashion</h3>
            <input type="text" id="inName" placeholder="Identifiant">
            <input type="text" id="inAddr" placeholder="Adresse complète">
            <button onclick="saveProfile()" style="width:100%; background:var(--tiktok-blue); color:black; padding:12px; border-radius:10px; border:none; font-weight:bold; cursor:pointer;">Confirmer le profil</button>
        </div>
    </div>

    <script>
        let hasLiked = false;

        function toggleLike(btn) {
            const count = document.getElementById('countLike');
            const icon = document.getElementById('heartIcon');
            let val = parseInt(count.innerText);

            if(!hasLiked) {
                val++;
                icon.classList.add('heart-active');
                confetti({ particleCount: 50, colors: ['#ff3b5c'] });
                hasLiked = true;
            } else {
                val--;
                icon.classList.remove('heart-active');
                hasLiked = false;
            }
            count.innerText = val;
        }

        function openComments() { document.getElementById('modalComm').style.display = 'flex'; }

        function addComment() {
            const input = document.getElementById('inputComm');
            const list = document.getElementById('listComm');
            const count = document.getElementById('countComm');
            const user = document.getElementById('displayUser').innerText;

            if(input.value.trim() !== "") {
                if(count.innerText === "0") list.innerHTML = "";
                const p = document.createElement('p');
                p.innerHTML = `<b>@${user}:</b> ${input.value}`;
                list.appendChild(p);
                count.innerText = parseInt(count.innerText) + 1;
                input.value = "";
            }
        }

        function saveProfile() {
            const name = document.getElementById('inName').value;
            if(name) {
                document.getElementById('displayUser').innerText = name;
                document.getElementById('modalAuth').style.display = 'none';
                confetti({ particleCount: 100, colors: ['#20d5ec'] });
            }
        }
    </script>
</body>
</html>
