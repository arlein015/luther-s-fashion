<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅ - Communauté</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header avec Compteur */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .brand { font-weight: bold; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
        .verified-badge { color: var(--cyan); font-size: 0.8rem; }
        .online-count { font-size: 0.7rem; color: #00ff88; margin-top: 2px; display: block; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg-text { font-size: 1rem; color: #fff; line-height: 1.4; border-left: 2px solid #333; padding-left: 10px; margin-bottom: 5px; }

        /* Bouton Inviter des amis */
        .invite-btn { background: #1A1A1A; border: 1px solid #333; color: #ccc; padding: 5px 12px; border-radius: 15px; font-size: 0.7rem; cursor: pointer; transition: 0.3s; }
        .invite-btn:hover { border-color: var(--cyan); color: white; }

        #input-area { padding: 15px; display: flex; align-items: center; gap: 12px; background: #000; border-top: 1px solid #222; }
        #msg-input { flex: 1; background: #1A1A1A; border: none; padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--grad); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div>
        <div class="brand">@ threndly <i class="fas fa-check-circle verified-badge"></i></div>
        <span class="online-count" id="count">● 1 en ligne</span>
    </div>
    <button class="invite-btn" onclick="copyLink()"><i class="fas fa-user-plus"></i> Inviter des amis</button>
</header>

<div id="chat-container"></div>

<div id="input-area">
    <i class="fas fa-plus" style="color:#555"></i>
    <input type="text" id="msg-input" placeholder="Ajouter un message..." onkeypress="if(event.key=='Enter')sendMsg()">
    <button onclick="sendMsg()" class="send-btn"><i class="fas fa-arrow-up"></i></button>
</div>

<script>
    // TA CONFIGURATION FIREBASE
    const firebaseConfig = {
        apiKey: "TON_API_KEY",
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. GESTION DU COMPTEUR EN LIGNE
    const onlineRef = db.ref('online_users');
    const myPresenceRef = onlineRef.push(true);
    myPresenceRef.onDisconnect().remove(); // Supprime l'utilisateur quand il ferme l'app
    
    onlineRef.on('value', snap => {
        const count = snap.numChildren();
        document.getElementById('count').innerText = `● ${count} en ligne`;
    });

    // 2. FONCTION INVITER (Copie le lien de ton GitHub)
    function copyLink() {
        const el = document.createElement('textarea');
        el.value = window.location.href;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        alert("Lien Threndly ✅ copié ! Envoie-le à tes amis.");
    }

    // 3. ENVOI ET RÉCEPTION
    function sendMsg() {
        const input = document.getElementById('msg-input');
        if(input.value.trim()){
            db.ref("messages").push({ text: input.value, timestamp: Date.now() });
            input.value = "";
        }
    }

    db.ref("messages").limitToLast(50).on("child_added", snap => {
        const m = snap.val();
        const div = document.createElement('div');
        div.innerHTML = `<div class="msg-text">${m.text}</div>`;
        document.getElementById('chat-container').appendChild(div);
        document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
    });
</script>

</body>
</html>
