<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther's Fashion - Réseau Social Premium</title>
<style>
    /* --- TRANSITION DE PAGE --- */
    .page {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: none; flex-direction: column;
        animation: fadeIn 0.4s ease-in-out;
        background: linear-gradient(180deg, #1a0121 0%, #4a0e5c 100%); /* Fond le plus stylé */
    }
    .page.active { display: flex; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* --- BOUTON NAV BASSE ACTIF --- */
    .nav-btn { cursor: pointer; transition: 0.3s; opacity: 0.6; }
    .nav-btn.active { opacity: 1; color: var(--violet-c); transform: scale(1.1); }

    /* --- STYLE DU BADGE SUR TOUTES LES PAGES --- */
    .badge-24 {
        width: 18px; height: 18px; background: white; margin-left: 5px;
        clip-path: polygon(50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%);
        display: inline-flex; align-items: center; justify-content: center;
    }
    .badge-24::after { content: '✓'; color: #9c27b0; font-size: 10px; font-weight: bold; }
</style>

<body id="mainBody">

    <div id="homePage" class="page active">
        <h1 style="margin-top:250px; text-align:center; font-size:40px; text-shadow: 0 0 20px #ce85f2;">zah zalaah ty aiiii</h1>
        <div class="video-info" style="position:absolute; bottom:80px; left:20px;">
            <h3 style="display:flex; align-items:center;">Luther (Proprio) <div class="badge-24"></div></h3>
            <p>Découvre la nouvelle collection 2026 ✨</p>
        </div>
    </div>

    <div id="friendsPage" class="page">
        <h2 style="padding:80px 20px;">Tes Amis</h2>
        <div style="padding:0 20px; opacity:0.7;">Aucune nouvelle activité pour le moment.</div>
    </div>

    <div id="messagesPage" class="page">
        <h2 style="padding:80px 20px;">Messages</h2>
        <div class="welcome-chat-box" style="margin:20px; border:1px dashed #ce85f2; padding:20px; border-radius:15px; text-align:center;">
            <b>Bienvenue dans ton chat privé ! 👋</b><br>
            <span style="font-size:12px;">Tu peux maintenant discuter avec tes contacts.</span>
        </div>
    </div>

    <div id="profilePage" class="page">
        <div style="text-align:center; padding-top:100px;">
            <img id="profileDisplayPfp" src="https://via.placeholder.com/100" style="width:100px; height:100px; border-radius:50%; border:3px solid white;">
            <h2 style="display:flex; align-items:center; justify-content:center;">Luther <div class="badge-24"></div></h2>
            <button onclick="toggleSettings()" style="background:white; color:black; border:none; padding:8px 20px; border-radius:20px; font-weight:bold;">Modifier le profil</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn active" onclick="showPage('homePage', this)">🏠<br>Accueil</div>
        <div class="nav-btn" onclick="showPage('friendsPage', this)">👥<br>Amis</div>
        <div class="plus-p" onclick="openAuth()">+</div>
        <div class="nav-btn" onclick="showPage('messagesPage', this)">💬<br>Messages</div>
        <div class="nav-btn" onclick="showPage('profilePage', this)">👤<br>Profil</div>
    </div>

    <script>
        function showPage(pageId, btn) {
            // Cache toutes les pages
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Désactive tous les boutons
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            // Affiche la page demandée
            document.getElementById(pageId).classList.add('active');
            // Active le bouton cliqué
            btn.classList.add('active');
        }
    </script>
</body>
</html>
