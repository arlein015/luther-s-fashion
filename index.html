<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --trendly-cyan: #00d2ff; 
            --bg-black: #000000;
            --input-bg: #1A1A1A;
            --gradient: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%);
        }

        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-black); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header minimaliste avec badge */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .brand { font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 5px; }
        .verified-badge { color: var(--trendly-cyan); font-size: 0.9rem; }
        .header-icons { display: flex; gap: 20px; color: white; }

        /* Zone de Chat */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Message sans nom d'utilisateur */
        .msg-unit { font-size: 1rem; line-height: 1.5; color: #FFFFFF; display: flex; flex-direction: column; }
        .msg-text { opacity: 0.95; margin-bottom: 5px; }
        .media-content { max-width: 100%; border-radius: 15px; margin-top: 5px; }

        /* Input Zone identique à l'image */
        #input-area { padding: 15px; display: flex; align-items: center; gap: 12px; background: #000; }
        .add-btn { color: #888; font-size: 1.4rem; cursor: pointer; }
        #msg-input { flex: 1; background: var(--input-bg); border: none; padding: 12px 20px; border-radius: 25px; color: white; outline: none; font-size: 0.95rem; }
        .send-btn { background: var(--gradient); border: none; width: 42px; height: 42px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="brand">@ threndly <i class="fas fa-check-circle verified-badge"></i></div>
    <div class="header-icons">
        <i class="fas fa-phone"></i>
        <i class="fas fa-video"></i>
    </div>
</header>

<div id="chat-container">
    </div>

<div id="input-area">
    <label for="file-upload"><i class="fas fa-plus add-btn"></i></label>
    <input type="file" id="file-upload" style="display:none" onchange="uploadFile(this)">
    <input type="text" id="msg-input" placeholder="Ajouter un message..." onkeypress="if(event.key=='Enter')sendMsg()">
    <button onclick="sendMsg()" class="send-btn"><i class="fas fa-arrow-up"></i></button>
</div>

<script>
    // TA CONFIGURATION FIREBASE
    const firebaseConfig = {
        apiKey: "TON_API_KEY",
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        storageBucket: "trendly-fca7c.appspot.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    // Envoi de message
    function sendMsg() {
        const input = document.getElementById('msg-input');
        if(input.value.trim()){
            db.ref("messages").push({
                text: input.value,
                type: "text",
                timestamp: Date.now()
            });
            input.value = "";
        }
    }

    // Envoi de fichiers (photos/vidéos)
    function uploadFile(input) {
        const file = input.files[0];
        if(!file) return;
        const ref = storage.ref(`threndly/${Date.now()}_${file.name}`);
        ref.put(file).then(snap => snap.ref.getDownloadURL()).then(url => {
            const type = file.type.includes('image') ? 'image' : 'video';
            db.ref("messages").push({ url: url, type: type, timestamp: Date.now() });
        });
    }

    // Affichage des messages (Nom supprimé)
    db.ref("messages").on("child_added", snap => {
        const m = snap.val();
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = "msg-unit";
        
        let content = "";
        if(m.type === 'text') content = `<span class="msg-text">${m.text}</span>`;
        if(m.type === 'image') content = `<img src="${m.url}" class="media-content">`;
        if(m.type === 'video') content = `<video src="${m.url}" controls class="media-content"></video>`;
        
        div.innerHTML = content;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    });
</script>

</body>
</html>
