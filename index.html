<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Threndly</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --sidebar: #0a0a0a; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; background: #000; margin: 0; color: white; }
        body { font-family: -apple-system, system-ui, sans-serif; display: flex; }

        /* --- ECRAN AUTHENTIFICATION --- */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #111; padding: 30px; border-radius: 30px; width: 100%; max-width: 350px; text-align: center; border: 1px solid #222; }
        .logo-img-large { width: 180px; margin-bottom: 25px; }
        .auth-input { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 15px; border: 1px solid #333; background: #050505; color: white; font-size: 1rem; outline: none; }
        .auth-btn { background: var(--grad); border: none; padding: 16px; border-radius: 30px; color: white; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .auth-footer { margin-top: 20px; font-size: 0.9rem; color: #888; }
        .auth-link { color: var(--cyan); cursor: pointer; font-weight: bold; }

        /* --- SETUP PROFIL (CHOIX PHOTO) --- */
        #profile-setup { position: fixed; inset: 0; background: #000; z-index: 2500; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        #profile-preview { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 3px solid var(--cyan); margin-bottom: 20px; background: #111; }

        /* --- INTERFACE PRINCIPALE --- */
        #sidebar { width: 85px; background: var(--sidebar); border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 20px; flex-shrink: 0; }
        .logo-small { width: 45px; height: 45px; margin-bottom: 20px; }
        .add-btn { width: 50px; height: 50px; border-radius: 50%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: var(--cyan); border: 1px solid #333; cursor: pointer; font-size: 1.5rem; }

        #directory-modal { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; flex-direction: column; padding: 20px; padding-top: 60px; }
        .user-row { padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #222; }

        #main-chat { flex: 1; display: none; flex-direction: column; background: #000; }
        header { padding: 15px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 80%; }
        .my-msg { align-self: flex-end; background: var(--grad); }
        .other-msg { align-self: flex-start; background: #262626; }

        #input-area { padding: 10px 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #1a1a1a; }
        .input-container { flex: 1; background: #1a1a1a; border-radius: 25px; padding: 12px 20px; }
        #message-input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 16px; }

        @media (min-width: 900px) { #sidebar { width: 280px; align-items: flex-start; padding: 20px; } }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <img src="logo.png" class="logo-img-large">
        <h2 id="auth-title">Connexion</h2>
        
        <input type="text" id="username" class="auth-input" placeholder="Identifiant">
        <input type="password" id="password" class="auth-input" placeholder="Mot de passe">
        
        <button onclick="processAuth()" class="auth-btn" id="auth-btn-text">Se connecter</button>
        
        <div class="auth-footer">
            <div id="toggle-text">Vous n'avez pas de compte ? <span class="auth-link" onclick="toggleAuth()">S'inscrire</span></div>
            <span class="auth-link" style="font-size:0.8rem; display:block; margin-top:15px;" onclick="alert('Contactez l\'admin pour réinitialiser.')">Mot de passe oublié ?</span>
        </div>
    </div>
</div>

<div id="profile-setup">
    <h2>Presque fini !</h2>
    <p>Choisis ta photo de profil</p>
    <img src="https://i.pravatar.cc/150?u=temp" id="profile-preview">
    <input type="file" id="photo-input" hidden accept="image/*" onchange="previewPhoto(this)">
    <button onclick="document.getElementById('photo-input').click()" class="auth-btn" style="background:#222; margin-bottom:10px;">Choisir une photo 📸</button>
    <button onclick="saveProfile()" class="auth-btn">Commencer sur Threndly ✅</button>
</div>

<div id="directory-modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>Suggestions d'amis</h2>
        <i class="fas fa-times" onclick="toggleDir()" style="font-size:1.5rem;"></i>
    </div>
    <div id="suggestions-list"></div>
</div>

<div id="sidebar">
    <img src="logo.png" class="logo-small">
    <div class="add-btn" onclick="toggleDir()"><i class="fas fa-plus"></i></div>
    <div id="friends-list" style="width:100%; margin-top:20px;"></div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="" id="chat-avatar" style="width:40px; height:40px; border-radius:50%;">
            <span id="chat-name" style="font-weight:bold;"></span>
        </div>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <div class="input-container"><input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()"></div>
        <button onclick="sendMsg()" class="auth-btn" style="width:45px; height:45px; margin:0; border-radius:50%;"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    // CONFIGURATION FIREBASE (RESTE LA MEME)
    const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isSignup = false;
    let myUser = localStorage.getItem('threndly_user') || "";
    let myPhotoBase64 = "";

    if(myUser) { document.getElementById('auth-screen').style.display='none'; }

    // BASCULE ENTRE CONNEXION ET INSCRIPTION
    function toggleAuth() {
        isSignup = !isSignup;
        document.getElementById('auth-title').innerText = isSignup ? "Créer un compte" : "Connexion";
        document.getElementById('auth-btn-text').innerText = isSignup ? "S'inscrire" : "Se connecter";
        document.getElementById('toggle-text').innerHTML = isSignup ? 
            "Déjà un compte ? <span class='auth-link' onclick='toggleAuth()'>Se connecter</span>" : 
            "Pas de compte ? <span class='auth-link' onclick='toggleAuth()'>S'inscrire</span>";
    }

    function processAuth() {
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        if(!u || !p) return alert("Remplis les champs !");

        if(isSignup) {
            db.ref("auth/"+u).once("value", snap => {
                if(snap.exists()) return alert("Identifiant déjà pris !");
                myUser = u;
                document.getElementById('profile-setup').style.display = 'flex';
            });
        } else {
            db.ref("auth/"+u).once("value", snap => {
                if(snap.exists() && snap.val().pass === p) {
                    localStorage.setItem('threndly_user', u);
                    location.reload();
                } else alert("Identifiant ou mot de passe incorrect.");
            });
        }
    }

    function previewPhoto(input) {
        const reader = new FileReader();
        reader.onload = e => { 
            myPhotoBase64 = e.target.result;
            document.getElementById('profile-preview').src = myPhotoBase64;
        };
        reader.readAsDataURL(input.files[0]);
    }

    function saveProfile() {
        const p = document.getElementById('password').value;
        db.ref("auth/"+myUser).set({ pass: p });
        db.ref("profiles/"+myUser).set({ 
            name: myUser, 
            img: myPhotoBase64 || "https://i.pravatar.cc/150?u="+myUser 
        });
        localStorage.setItem('threndly_user', myUser);
        location.reload();
    }

    function toggleDir() {
        const m = document.getElementById('directory-modal');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        if(m.style.display === 'flex') loadSuggestions();
    }

    function loadSuggestions() {
        db.ref("profiles").once("value", snap => {
            const list = document.getElementById('suggestions-list');
            list.innerHTML = "";
            snap.forEach(uSnap => {
                const u = uSnap.val();
                if(u.name === myUser) return;
                const div = document.createElement('div');
                div.className = "user-row";
                div.onclick = () => { startChat(u.name, u.img); toggleDir(); };
                div.innerHTML = `<img src="${u.img}" style="width:50px; height:50px; border-radius:50%; object-fit:cover;"><span>${u.name}</span>`;
                list.appendChild(div);
            });
        });
    }

    function startChat(name, img) {
        activeRoom = [myUser, name].sort().join("_");
        document.getElementById('main-chat').style.display = 'flex';
        document.getElementById('chat-name').innerText = name;
        document.getElementById('chat-avatar').src = img;
        loadMsgs(activeRoom);
    }

    function loadMsgs(room) {
        const box = document.getElementById('chat-box');
        db.ref("messages/"+room).on("value", snap => {
            box.innerHTML = "";
            snap.forEach(mSnap => {
                const m = mSnap.val();
                const d = document.createElement('div');
                d.className = `msg ${m.from === myUser ? 'my-msg' : 'other-msg'}`;
                d.innerText = m.text;
                box.appendChild(d);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function sendMsg() {
        const input = document.getElementById('message-input');
        if(input.value.trim()) {
            db.ref("messages/"+activeRoom).push({ from: myUser, text: input.value });
            input.value = "";
        }
    }
</script>
</body>
</html>
