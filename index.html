<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

    <style>
        :root {
            --blue-cert: #20d5ec;
            --bg-dark: #121212;
            --text-light: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-size: 1.5rem;
            font-weight: bold;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .message {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--blue-cert);
        }
        .username {
            font-weight: bold;
            color: var(--blue-cert);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .badge {
            color: var(--blue-cert);
            font-size: 0.9rem;
        }
        #input-area {
            padding: 15px;
            background: #1e1e1e;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #333;
            color: white;
        }
        button {
            background: var(--blue-cert);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Notification Prompt */
        #notif-banner {
            background: #222;
            padding: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <header>Threndly <span class="badge">✅</span></header>

    <div id="notif-banner">
        Souhaitez-vous activer les notifications Threndly ? 
        <button onclick="requestNotif()">Activer ✅</button>
    </div>

    <div id="chat-container">
        </div>

    <div id="input-area">
        <input type="text" id="userMsg" placeholder="Écrire un message...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

    <script>
        // CONFIGURATION THRENDLY ✅
        const firebaseConfig = {
            apiKey: "AIzaSy... (Ta clé API)",
            authDomain: "trendly-fca7c.firebaseapp.com",
            databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
            projectId: "trendly-fca7c",
            storageBucket: "trendly-fca7c.appspot.com",
            messagingSenderId: "1070458426638",
            appId: "1:1070458426638:web:6a7dd8dadc78e45019735f"
        };

        // Initialisation
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const messaging = firebase.messaging();

        // 1. Écouter les messages en temps réel
        db.ref('messages').limitToLast(20).on('value', (snapshot) => {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            snapshot.forEach((child) => {
                const msg = child.val();
                container.innerHTML += `
                    <div class="message">
                        <div class="username">${msg.pseudo} <span class="badge">✅</span></div>
                        <div>${msg.texte}</div>
                    </div>
                `;
            });
            container.scrollTop = container.scrollHeight;
        });

        // 2. Envoyer un message
        function sendMessage() {
            const input = document.getElementById('userMsg');
            if (input.value.trim() !== "") {
                db.ref('messages').push({
                    pseudo: "Utilisateur", // Tu pourras plus tard ajouter un système de login
                    texte: input.value,
                    date: new Date().toLocaleString()
                });
                input.value = '';
            }
        }

        // 3. Gestion des Notifications (Pour iPhone et Android)
        function requestNotif() {
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    console.log('Notification autorisée !');
                    document.getElementById('notif-banner').style.display = 'none';
                    // S'abonner au topic "all" via ton service worker
                }
            });
        }

        // Afficher la bannière si les notifs ne sont pas encore acceptées
        if (Notification.permission !== 'granted') {
            document.getElementById('notif-banner').style.display = 'block';
        }
    </script>
</body>
</html>
