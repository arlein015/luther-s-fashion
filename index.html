<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly - Chat Options</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --violet-p: #9c27b0; --bg-chat: #f0f2f5; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* --- PAGE DE DISCUSSION --- */
        #page-chat { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-chat); display: flex; flex-direction: column; transition: background 0.3s; }
        
        /* HEADER AVEC MENU 3 POINTS */
        .chat-header { background: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; position: relative; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .btn-menu-dots { cursor: pointer; padding: 5px; font-size: 18px; color: #555; }

        /* MENU DÉROULANT */
        .options-menu { display: none; position: absolute; top: 50px; right: 15px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 220px; z-index: 3000; flex-direction: column; padding: 8px 0; }
        .option-item { padding: 12px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; color: #333; }
        .option-item:hover { background: #f5f5f5; }
        .option-item i { color: var(--violet-p); width: 20px; text-align: center; }

        /* CONTENU CHAT */
        .chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 14px; }
        .sent { background: var(--violet-p); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        /* BARRE BAS */
        .chat-input-bar { background: white; padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #ddd; }
        .btn-plus { width: 34px; height: 34px; background: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .input-field { flex-grow: 1; background: #f0f2f5; border: none; padding: 10px 15px; border-radius: 20px; outline: none; }
    </style>
</head>
<body>

    <div id="page-chat">
        <div class="chat-header">
            <div class="header-left">
                <i class="fas fa-arrow-left"></i>
                <img src="https://i.pravatar.cc/100?u=1" style="width: 35px; height: 35px; border-radius: 50%;">
                <b>Norah Nelsie</b>
            </div>
            <div class="btn-menu-dots" onclick="toggleOptionsMenu()">
                <i class="fas fa-ellipsis-v"></i>
            </div>

            <div class="options-menu" id="optionsMenu">
                <div class="option-item" onclick="alert('Enregistrement Vidéo/Photo lancé')">
                    <i class="fas fa-camera-retro"></i> Enregistrer Vidéo & Photo
                </div>
                <div class="option-item" onclick="toggleEphemeral()">
                    <i class="fas fa-bolt"></i> Mode Éphémère: <span id="eph-label" style="margin-left:5px; font-weight:bold; color:red;">OFF</span>
                </div>
                <div class="option-item" onclick="changeTheme()">
                    <i class="fas fa-paint-brush"></i> Thème de discussion
                </div>
                <div class="option-item" style="border-top: 1px solid #eee; color: red;">
                    <i class="fas fa-ban"></i> Bloquer l'utilisateur
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chat-box">
            <div class="bubble sent">ilbsdkjbiqsUHdmbqs</div>
            <div class="bubble sent" style="display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-play"></i>
                <div style="width: 100px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px;"></div>
                <span>0:04</span>
            </div>
        </div>

        <div class="chat-input-bar">
            <div class="btn-plus"><i class="fas fa-plus"></i></div>
            <input type="text" class="input-field" placeholder="Message...">
            <i class="fas fa-microphone" style="color: #555;"></i>
        </div>
    </div>

    <script>
        let ephActive = false;
        let themeIndex = 0;
        const themes = ['#f0f2f5', '#ffe0e0', '#e0f7fa', '#f3e5f5'];

        function toggleOptionsMenu() {
            const menu = document.getElementById('optionsMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        // Fermer le menu si on clique ailleurs
        window.onclick = function(event) {
            if (!event.target.matches('.fa-ellipsis-v') && !event.target.matches('.btn-menu-dots')) {
                document.getElementById('optionsMenu').style.display = "none";
            }
        }

        function toggleEphemeral() {
            ephActive = !ephActive;
            const label = document.getElementById('eph-label');
            label.innerText = ephActive ? "ON" : "OFF";
            label.style.color = ephActive ? "#4CAF50" : "red";
            alert(ephActive ? "Mode Éphémère activé" : "Mode Éphémère désactivé");
        }

        function changeTheme() {
            themeIndex = (themeIndex + 1) % themes.length;
            document.getElementById('page-chat').style.background = themes[themeIndex];
        }
    </script>
</body>
</html>
