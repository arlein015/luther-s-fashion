<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Threndly - Intelligent Network</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { 
            --blue: #2D9CDB; --purple: #BB6BD9; --black: #000000;
            --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); 
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; background: #4A5568; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* --- AUTH CARD (Design Image) --- */
        .auth-card { 
            background: var(--black); width: 92%; max-width: 400px; padding: 40px 30px; 
            border-radius: 25px; border: 1px solid #222; text-align: center; z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .logo-txt { font-size: 2.2rem; font-weight: 900; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        
        .input-group { text-align: left; margin-bottom: 15px; }
        label { color: white; font-size: 0.8rem; margin-bottom: 5px; display: block; opacity: 0.8; }
        input { 
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; 
            background: #111; color: white; outline: none; font-size: 1rem;
        }
        input:focus { border-color: var(--blue); }

        .btn-p { 
            width: 100%; padding: 16px; background: var(--blue); border: none; 
            border-radius: 12px; color: white; font-weight: bold; cursor: pointer; 
            font-size: 1rem; margin-top: 10px; transition: 0.3s;
        }
        .btn-p:disabled { opacity: 0.5; cursor: not-allowed; }

        .divider { margin: 25px 0; color: #444; font-size: 0.8rem; display: flex; align-items: center; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #222; margin: 0 10px; }

        .btn-soc { 
            width: 100%; padding: 14px; border-radius: 12px; border: none; color: white; 
            font-weight: 600; margin-top: 10px; display: flex; align-items: center; 
            justify-content: center; gap: 10px; cursor: pointer;
        }
        .goog { background: #EA4335; } .face { background: #1877F2; }

        /* --- CHAT SCREEN --- */
        #chat-screen { position: fixed; inset: 0; background: var(--black); display: none; flex-direction: row; z-index: 200; }
        #sidebar { width: 70px; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 25px; }
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        header { padding: 15px 20px; border-bottom: 1px solid #1a1a1a; color: white; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        #msg-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 12px 16px; border-radius: 18px; max-width: 80%; color: white; font-size: 0.95rem; line-height: 1.4; }
        .me { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: #222; border-bottom-left-radius: 4px; }
        footer { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #1a1a1a; background: #050505; }

        #verify-view, #reset-view { display: none; }
        #timer-info { font-size: 0.8rem; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="auth-box" class="auth-card">
        <div id="signup-view">
            <div class="logo-txt">THRENDLY</div>
            <p style="color:#888; margin-bottom:25px;">Rejoignez le réseau</p>
            
            <div class="input-group">
                <label>E-mail Réel</label>
                <input type="email" id="reg-mail" placeholder="votre@email.com">
            </div>
            <div class="input-group">
                <label>Pseudo</label>
                <input type="text" id="reg-user" placeholder="@nom">
            </div>
            
            <button class="btn-p" id="btn-send" onclick="envoyerCodeValidation()">Recevoir mon code</button>
            
            <div class="divider">OU</div>
            
            <button class="btn-soc goog" onclick="loginGoogle()"><i class="fab fa-google"></i> Google</button>
            <button class="btn-soc face" onclick="loginFacebook()"><i class="fab fa-facebook-f"></i> Facebook</button>
        </div>

        <div id="verify-view">
            <h2 style="color:white">Vérification</h2>
            <p style="color:#888; font-size:0.9rem;">Entrez les 6 chiffres reçus par mail</p>
            <input type="text" id="v-code" maxlength="6" style="text-align:center; font-size:2rem; letter-spacing:8px; margin:20px 0;" placeholder="000000">
            <button class="btn-p" style="background:var(--grad)" onclick="verifierLeCode()">Valider mon compte</button>
            <p id="timer-info"></p>
        </div>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <div style="width:45px; height:45px; background:var(--grad); border-radius:12px; margin-bottom:25px;"></div>
            <i class="fas fa-plus-circle" style="color:var(--blue); font-size:1.8rem;"></i>
        </div>
        <div id="chat-main">
            <header>
                <div style="width:35px; height:35px; border-radius:50%; background:var(--grad);"></div>
                <span>Threndly Network</span>
            </header>
            <div id="msg-list"></div>
            <footer>
                <input type="text" id="msg-in" placeholder="Écrire..." style="flex:1; border-radius:25px; padding:12px 20px; border:1px solid #333; background:#111; color:white;">
                <button onclick="send()" class="btn-p" style="width:50px; border-radius:50%; margin:0; background:var(--grad);"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </div>
    </div>

    <script>
        // --- INITIALISATION ---
        const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        emailjs.init("VOTRE_CLE_PUBLIQUE_EMAILJS"); // À REMPLACER

        let codeSecret = "";
        let timerEnCours = false;

        // --- 1. ENVOI DU CODE AVEC TIMER ---
        function envoyerCodeValidation() {
            if(timerEnCours) return;
            const email = document.getElementById('reg-mail').value;
            const user = document.getElementById('reg-user').value || "Ami";

            if(!email.includes('@')) {
                vibrerErreur();
                return alert("Email invalide");
            }

            codeSecret = Math.floor(100000 + Math.random() * 900000).toString();

            emailjs.send("service_id", "template_id", {
                email: email,
                user_name: user,
                verification_code: codeSecret
            }).then(() => {
                document.getElementById('signup-view').style.display = 'none';
                document.getElementById('verify-view').style.display = 'block';
                lancerTimer();
            });
        }

        // --- 2. VÉRIFICATION AVEC VIBRATION ---
        function verifierLeCode() {
            const tape = document.getElementById('v-code').value;
            if(tape === codeSecret && codeSecret !== "") {
                localStorage.setItem('threndly_id', document.getElementById('reg-user').value);
                enterApp();
            } else {
                vibrerErreur(); // Intelligence : Le téléphone vibre si c'est faux
                alert("Code incorrect !");
                document.getElementById('v-code').value = "";
            }
        }

        function vibrerErreur() {
            if ("vibrate" in navigator) {
                navigator.vibrate([100, 50, 100]); // Deux petites vibrations sèches
            }
        }

        function lancerTimer() {
            let sec = 60;
            timerEnCours = true;
            const info = document.getElementById('timer-info');
            const itv = setInterval(() => {
                sec--;
                info.innerText = `Renvoyer le code dans ${sec}s`;
                if(sec <= 0) {
                    clearInterval(itv);
                    timerEnCours = false;
                    info.innerHTML = `<span style="color:var(--blue);cursor:pointer" onclick="location.reload()">Renvoyer maintenant</span>`;
                }
            }, 1000);
        }

        // --- 3. CONNEXIONS RÉSEAUX ---
        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(res => {
                localStorage.setItem('threndly_id', res.user.displayName);
                enterApp();
            });
        }

        // --- 4. NAVIGATION & CHAT ---
        function enterApp() {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.body.style.background = "black";
            loadMsgs();
        }

        function send() {
            const inp = document.getElementById('msg-in');
            const id = localStorage.getItem('threndly_id');
            if(inp.value.trim()) {
                db.ref("messages/general").push({ from: id, text: inp.value });
                inp.value = "";
            }
        }

        function loadMsgs() {
            db.ref("messages/general").on("child_added", snap => {
                const m = snap.val();
                const myID = localStorage.getItem('threndly_id');
                const d = document.createElement('div');
                d.className = `bubble ${m.from === myID ? 'me' : 'other'}`;
                d.innerText = m.text;
                document.getElementById('msg-list').appendChild(d);
                document.getElementById('msg-list').scrollTop = document.getElementById('msg-list').scrollHeight;
            });
        }

        // Auto-login
        if(localStorage.getItem('threndly_id')) enterApp();
    </script>
</body>
</html>
