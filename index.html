<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendly </title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --sidebar: #121212; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* Login */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; width: 300px; text-align: center; }

        /* Sidebar (Liste d'amis) */
        #sidebar { width: 350px; background: var(--sidebar); border-right: 1px solid #222; display: flex; flex-direction: column; }
        
        /* HEADER SIDEBAR AVEC LOGO EXACT */
        .sidebar-header { 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px; /* Espace entre le logo et le mot 'Discussions' */
            border-bottom: 1px solid #222; 
        }
        /* Style pour ton logo exact */
        .trendly-logo-exact {
            height: 30px; /* Taille exacte pour s'intégrer dans le header */
            width: auto;
            object-fit: contain;
        }
        .header-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            flex: 1; /* Pousse les icônes à droite */
        }
        .header-actions {
            display: flex;
            gap: 15px;
            color: white;
            font-size: 1.1rem;
        }

        /* Barre de recherche et filtres */
        .search-container { padding: 10px 15px; display: flex; flex-direction: column; gap: 10px; }
        .search-bar { width: 100%; background: #222; border: none; padding: 10px 15px; border-radius: 10px; color: white; outline: none; }
        .filters { display: flex; gap: 8px; }
        .filter-btn { background: #222; border: none; color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
        .filter-btn.active { background: #d9fdd3; color: #111; }

        /* Liste des amis */
        #friends-list { flex: 1; overflow-y: auto; }
        .friend-item { padding: 12px 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #1a1a1a; }
        .friend-item:hover { background: #1a1a1a; }
        .friend-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .friend-info { flex: 1; }
        .friend-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .friend-name { font-weight: bold; color: white; }
        .msg-time { font-size: 0.75rem; color: #888; }
        .friend-last { font-size: 0.85rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .friend-badge { width: 18px; height: 18px; border-radius: 50%; background: #25d366; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; }

        /* Zone de Chat (Ton code actuel) */
        #main-chat { flex: 1; display: none; flex-direction: column; background: #000; }
        header { padding: 10px 15px; height: 60px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 8px 12px; border-radius: 18px; max-width: 70%; position: relative; }
        .my-msg { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 10px; }

        #input-area { padding: 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #222; }
        .input-box { flex: 1; background: #1a1a1a; border-radius: 25px; padding: 10px 15px; display: flex; }
        #message-input { background: transparent; border: none; color: white; flex: 1; outline: none; }

        /* Appel Vidéo Overlay */
        #call-screen { display:none; position:fixed; inset:0; background:#000; z-index:3000; }
        #local-video { position:absolute; bottom:30px; right:20px; width:120px; height:180px; border-radius:15px; border:2px solid #fff; object-fit: cover; z-index: 10; }
        #remote-video { width:100%; height:100%; object-fit: cover; }

        @media (max-width: 768px) { #sidebar { width: 100%; } #main-chat { position: fixed; inset: 0; z-index: 100; } }
    </style>
</head>
<body>

<div id="auth-screen">
    <img src="https://i.ibb.co/Vmq7D30/trendly-logo-exact.png" alt="Trendly Logo" style="height:80px; margin-bottom:20px;">
    <div class="auth-card">
        <input type="text" id="user-id" class="auth-input" placeholder="Ton nom">
        <input type="password" id="user-pass" class="auth-input" placeholder="Mot de passe">
        <button onclick="handleAuth()" style="background:var(--grad); border:none; padding:12px; border-radius:20px; color:white; width:100%; cursor:pointer;">Entrer ✅</button>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <img src="https://i.ibb.co/Vmq7D30/trendly-logo-exact.png" alt="Trendly" class="trendly-logo-exact">
        <div class="header-title">Discussions</div>
        <div class="header-actions">
            <i class="fas fa-plus-square"></i>
            <i class="fas fa-ellipsis-v"></i>
        </div>
    </div>
    
    <div class="search-container">
        <input type="text" class="search-bar" placeholder="Rechercher ou démarrer...">
        <div class="filters">
            <button class="filter-btn active">Toutes</button>
            <button class="filter-btn">Non lues</button>
            <i class="fas fa-filter" style="color:#888; margin-left:auto; cursor:pointer;"></i>
        </div>
    </div>

    <div id="friends-list">
        </div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-left" onclick="closeChat()" style="cursor:pointer; display:none;" id="back-btn"></i>
            <img src="" id="chat-avatar" style="width:40px; height:40px; border-radius:50%; display:none;">
            <div id="chat-name" style="font-weight:bold;"></div>
        </div>
        <div style="display:flex; gap:20px; color:#888;">
            <i class="fas fa-phone" style="cursor:pointer"></i>
            <i class="fas fa-video" style="cursor:pointer"></i>
            <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#ff4444; cursor:pointer;"></i>
        </div>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <label for="img-input" style="color:#888; font-size:1.3rem; cursor:pointer"><i class="far fa-image"></i></label>
        <input type="file" id="img-input" hidden accept="image/*" onchange="sendPhoto(this)">
        <div class="input-box">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        <button onclick="sendMsg()" style="background:var(--grad); border:none; width:40px; height:40px; border-radius:50%; color:white;"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<div id="call-screen">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
    <div style="position:absolute; bottom:40px; left:50%; transform:translateX(-50%); display:flex; gap:20px;">
        <button onclick="endCall()" style="background:#ff4444; border:none; padding:15px; border-radius:50%; color:white; font-size:1.5rem;"><i class="fas fa-phone-slash"></i></button>
    </div>
</div>

<script>
    // Configuration Firebase
    const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myUser = localStorage.getItem('trendly_user') || "";
    let activeChat = "";

    if(myUser) login(myUser);
    function handleAuth() { const name = document.getElementById('user-id').value.trim(); if(name) login(name); }
    function login(name) {
        myUser = name; localStorage.setItem('trendly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        loadFriends();
    }

    // --- CHARGER LA LISTE DES AMIS ---
    function loadFriends() {
        const list = document.getElementById('friends-list');
        // Tes amis exacts et leurs données
        const friends = [
            { name: "Joselyna", last: "zahay zaza jiajy...", time: "14:07", unread: 2, img: "https://i.pravatar.cc/150?u=jos" },
            { name: "Nelly", last: "okay havy agny z...", time: "14:07", unread: 0, img: "https://i.pravatar.cc/150?u=nel" },
            { name: "Arthur💸", last: "on peut parler sur...", time: "12:56", unread: 1, img: "https://i.pravatar.cc/150?u=art" },
            { name: " Lebien", last: "📷 4 photos", time: "mercredi", unread: 0, img: "https://i.pravatar.cc/150?u=leb" }
        ];

        list.innerHTML = "";
        friends.forEach(f => {
            const div = document.createElement('div');
            div.className = 'friend-item';
            div.onclick = () => openChat(f.name, f.img);
            
            // Badge si messages non lus
            const badge = f.unread > 0 ? `<div class="friend-badge">${f.unread}</div>` : '';

            div.innerHTML = `
                <img src="${f.img}" class="friend-avatar">
                <div class="friend-info">
                    <div class="friend-meta">
                        <div class="friend-name">${f.name}</div>
                        <div class="msg-time">${f.time}</div>
                    </div>
                    <div class="friend-meta">
                        <div class="friend-last">${f.last}</div>
                        ${badge}
                    </div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function openChat(name, img) {
        activeChat = name;
        document.getElementById('main-chat').style.display = 'flex';
        document.getElementById('chat-name').innerText = name;
        document.getElementById('chat-avatar').src = img;
        document.getElementById('chat-avatar').style.display = 'block';
        if(window.innerWidth < 768) document.getElementById('back-btn').style.display = 'block';
        loadMessages();
    }
    function closeChat() { document.getElementById('main-chat').style.display = 'none'; }

    // --- LOGIQUE MESSAGES (Ton code d'origine) ---
    function sendMsg() {
        const text = document.getElementById('message-input').value;
        if(text && activeChat) {
            db.ref("chats/" + activeChat).push({ from: myUser, text: text, type: 'text' });
            document.getElementById('message-input').value = "";
        }
    }
    function sendPhoto(input) { /* (Reste de ta logique d'envoi photo) */ }
    function loadMessages() { /* (Reste de ta logique de chargement messages) */ }
    function logout() { localStorage.removeItem('trendly_user'); location.reload(); }
</script>
</body>
</html>
