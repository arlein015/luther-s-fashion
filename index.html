<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther's Fashion - Profil Officiel</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --violet: #9c27b0; --tiktok-red: #ff3b5c; --bg: #000; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }

        /* --- MODALES --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 5000; }
        .modal-content { background: white; color: black; width: 90%; max-width: 400px; padding: 30px; border-radius: 25px; text-align: center; box-sizing: border-box; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-family: inherit; }
        
        /* --- ÉTAPE 2 : CONFIGURATION PROFIL --- */
        #profileSetup { display: none; }
        .avatar-upload { position: relative; width: 100px; height: 100px; margin: 0 auto 20px; }
        .avatar-preview { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--violet); }
        .camera-icon { position: absolute; bottom: 0; right: 0; background: var(--violet); color: white; padding: 8px; border-radius: 50%; cursor: pointer; font-size: 14px; }

        .btn-primary { width: 100%; background: var(--tiktok-red); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* --- BARRE DE NAVIGATION --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: black; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border-top: 0.5px solid #333; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .btn-plus-container { background: linear-gradient(to right, #20d5ec, #ff2d55); padding: 5px 18px; border-radius: 12px; color: black; font-weight: bold; }
        
        /* --- FEED --- */
        .video-feed { height: 100vh; background: #e60023; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 20px 100px; }
    </style>
</head>
<body>

    <div class="video-feed">
        <div class="user-info">
            <h3 style="display:flex; align-items:center; gap:8px;">@<span id="navName">Luther</span> <div style="width:18px; height:18px; background:white; clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);"></div></h3>
            <p>Bienvenue sur ton espace créateur !</p>
        </div>
    </div>

    <div id="modalAuth" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0;">Créer un compte</h2>
            <input type="email" id="regEmail" placeholder="Ton Email">
            <input type="password" id="regPass" placeholder="Ton mot de passe">
            <select id="regCountry">
                <option value="">🌍 Choisis ton pays</option>
                <option value="France">🇫🇷 France</option>
                <option value="Congo">🇨🇬 Congo</option>
                <option value="Maroc">🇲🇦 Maroc</option>
                <option value="Côte d'Ivoire">🇮🇨 Côte d'Ivoire</option>
            </select>
            <button class="btn-primary" onclick="goToProfileSetup()">Suivant</button>
        </div>
    </div>

    <div id="profileSetup" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0;">Complète ton profil</h2>
            <div class="avatar-upload">
                <img id="avatarPreview" class="avatar-preview" src="https://via.placeholder.com/100">
                <label for="fileAvatar" class="camera-icon"><i class="fas fa-camera"></i></label>
                <input type="file" id="fileAvatar" style="display:none;" accept="image/*" onchange="previewAvatar(event)">
            </div>
            
            <input type="text" id="userAddress" placeholder="🏠 Ton adresse (Ville, Quartier)">
            <textarea id="userBio" placeholder="📝 Ta bio (ex: Passionné de mode)" rows="3" style="resize:none;"></textarea>
            
            <button class="btn-primary" onclick="finishSetup()">Terminer & Publier</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item"><i class="fas fa-home"></i></div>
        <div class="nav-item"><i class="fas fa-bolt" style="color:yellow;"></i></div>
        <div class="nav-item"><div class="btn-plus-container">+</div></div>
        <div class="nav-item"><i class="fas fa-envelope"></i></div>
        <div class="nav-item" onclick="document.getElementById('profileSetup').style.display='flex'"><i class="fas fa-user"></i></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmWi55H7--DzkuiTHWS4Q4xmqeBq9WvkLpd0y9GIpTL3osmmL4zpACStbOCOwYgw0Q/exec";

        // Passage de l'inscription au profil
        function goToProfileSetup() {
            const email = document.getElementById('regEmail').value;
            if(!email) { alert("Mets un email !"); return; }
            
            document.getElementById('modalAuth').style.display = 'none';
            document.getElementById('profileSetup').style.display = 'flex';
        }

        // Aperçu de la photo de profil
        function previewAvatar(e) {
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById('avatarPreview').src = reader.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        // Enregistrement final
        function finishSetup() {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const country = document.getElementById('regCountry').value;
            const address = document.getElementById('userAddress').value;
            const bio = document.getElementById('userBio').value;

            // Envoi à Google Sheets avec toutes les nouvelles infos
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ 
                    methode: 'Inscription_Complete', 
                    nom: email, 
                    mdp: pass, 
                    pays: country,
                    adresse: address,
                    bio: bio 
                })
            });

            confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
            document.getElementById('navName').innerText = email.split('@')[0];
            document.getElementById('profileSetup').style.display = 'none';
            alert("✨ Profil créé avec succès !");
        }
    </script>
</body>
</html>
