<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Inscription & Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #FF0000; --bg: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); padding-bottom: 70px; }

        /* --- HEADER & NAV --- */
        header { padding: 12px 15px; background: #fff; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .header-main { display: flex; align-items: center; justify-content: space-between; }
        .logo { font-weight: 900; font-size: 22px; text-decoration: none; color: #000; letter-spacing: -1.5px; }
        .clickable { cursor: pointer; }

        /* --- MODAL INSCRIPTION (SIGN UP) --- */
        #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 3000; display: none; padding: 30px 20px; }
        .auth-title { font-weight: 900; font-size: 18px; text-transform: uppercase; margin-bottom: 20px; }
        .input-group { position: relative; margin-top: 15px; }
        .input-group input { width: 100%; padding: 18px; border: 1px solid #ddd; font-size: 14px; border-radius: 4px; }
        .input-arrow { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #000; color: #fff; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
        .auth-terms { font-size: 10px; color: #666; line-height: 1.5; margin-top: 20px; }
        .auth-terms a { color: #000; text-decoration: underline; }

        /* --- PRODUIT & GRILLE --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .card { border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .price { font-weight: 900; color: var(--accent); }

        /* --- PAGE DÉTAIL --- */
        #product-detail { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; display: none; overflow-y: auto; }
        .add-to-bag { width: 100%; background: #000; color: #fff; padding: 18px; border: none; font-weight: 900; border-radius: 50px; cursor: pointer; }

        /* --- BOTTOM NAV --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1001; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 700; color: #000; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-modal">
    <div style="text-align: right;"><i class="fas fa-times clickable" onclick="toggleAuth()" style="font-size: 24px;"></i></div>
    <div class="auth-title">SIGN UP FOR DISCOUNTS + UPDATES</div>
    <div class="input-group">
        <input type="text" id="user-contact" placeholder="Phone Number or Email">
        <button class="input-arrow" onclick="handleAuth()"><i class="fas fa-chevron-right"></i></button>
    </div>
    <div class="auth-terms">
        By signing up for email, you agree to Fashion Nova's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>. <br><br>
        By submitting your phone number, you agree to receive recurring automated promotional and personalized marketing text messages.
    </div>
</div>

<div id="product-detail">
    <div style="padding:15px;"><i class="fas fa-chevron-left clickable" onclick="closeDetail()" style="font-size: 22px;"></i></div>
    <img id="d-img" style="width:100%;" src="">
    <div style="padding:20px;">
        <h2 id="d-name"></h2>
        <div id="d-price" class="price" style="font-size:22px; margin:15px 0;"></div>
        <button class="add-to-bag" onclick="addToBag()">ADD TO BAG</button>
    </div>
</div>

<header>
    <div class="header-main">
        <i class="fas fa-bars clickable"></i>
        <a href="#" class="logo">LutherFashion</a>
        <div class="header-right">
            <span class="lang-link clickable">FR</span>
            <i class="far fa-user clickable" onclick="toggleAuth()"></i> <div style="position:relative;">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count" style="position:absolute; top:-8px; right:-8px; background:red; color:white; font-size:9px; padding:2px 5px; border-radius:50%;">0</span>
            </div>
        </div>
    </div>
</header>

<div class="grid" id="shop-grid"></div>

<div class="bottom-nav">
    <div class="bottom-nav-item" onclick="window.scrollTo(0,0)"><i class="fas fa-home"></i>Accueil</div>
    <div class="bottom-nav-item" onclick="toggleAuth()"><i class="far fa-user"></i>S'inscrire</div> <div class="bottom-nav-item"><i class="far fa-heart"></i>Favoris</div>
</div>

<script>
    const container = document.getElementById('shop-grid');
    const products = [];
    
    // Génération des produits
    for (let i = 1; i <= 30; i++) {
        const item = {
            name: "Veste Edition #" + i,
            price: (Math.random() * 80 + 20).toFixed(2),
            img: i % 2 === 0 ? 'Veste vert.jpg' : 'veste jaune.jpg'
        };
        products.push(item);
        container.innerHTML += `
            <div class="card clickable" onclick="openDetail(${i-1})">
                <img src="${item.img}">
                <div style="padding:10px;">
                    <div style="font-size:12px; font-weight:700;">${item.name}</div>
                    <div class="price">${item.price} $</div>
                </div>
            </div>`;
    }

    function toggleAuth() {
        const modal = document.getElementById('auth-modal');
        modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function handleAuth() {
        const val = document.getElementById('user-contact').value;
        if(val) {
            alert("Merci ! Un code de validation a été envoyé à : " + val);
            toggleAuth();
        } else {
            alert("Veuillez entrer un email ou numéro valide.");
        }
    }

    function openDetail(idx) {
        const p = products[idx];
        document.getElementById('d-img').src = p.img;
        document.getElementById('d-name').innerText = p.name;
        document.getElementById('d-price').innerText = p.price + " $";
        document.getElementById('product-detail').style.display = 'block';
    }

    function closeDetail() { document.getElementById('product-detail').style.display = 'none'; }
    
    let cart = 0;
    function addToBag() {
        cart++;
        document.getElementById('cart-count').innerText = cart;
        closeDetail();
    }
</script>
</body>
</html>
