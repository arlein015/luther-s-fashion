<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Threndly</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #2D9CDB; --purple: #BB6BD9; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { margin: 0; background: #000; color: white; height: 100vh; overflow: hidden; }

        /* --- ÉCRAN 1 : INSCRIPTION (PREMIER PLAN) --- */
        #signup-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #111; width: 100%; max-width: 400px; padding: 30px; border-radius: 25px; border: 1px solid #222; text-align: center; }
        .logo { width: 160px; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; }
        .btn-main { width: 100%; padding: 16px; background: var(--grad); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .auth-link { color: var(--blue); font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 15px; }

        /* --- ÉCRAN 2 : PHOTO --- */
        #photo-screen { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #preview { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 3px solid var(--blue); margin: 20px; }

        /* --- ÉCRAN 3 : ZONE DE DISCUSSION --- */
        #chat-screen { display: none; height: 100vh; flex-direction: row; }
        #sidebar { width: 80px; background: #0a0a0a; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        header { padding: 15px 20px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        #msg-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 12px 16px; border-radius: 18px; max-width: 75%; font-size: 0.95rem; }
        .me { align-self: flex-end; background: var(--grad); color: white; }
        .other { align-self: flex-start; background: #222; color: white; }
        footer { padding: 15px; display: flex; gap: 10px; background: #050505; border-top: 1px solid #1a1a1a; }
        footer input { flex: 1; }
    </style>
</head>
<body>

    <div id="signup-screen">
        <div class="auth-card">
            <img src="logo.png" class="logo">
            <h2 style="margin-bottom: 5px;">Créer un compte</h2>
            <p style="color: #666; font-size: 0.9rem; margin-bottom: 25px;">Rejoignez Threndly dès maintenant</p>
            
            <div class="input-group">
                <label>IDENTIFIANT</label>
                <input type="text" id="user-id" placeholder="Votre pseudo">
            </div>
            <div class="input-group">
                <label>MOT DE PASSE</label>
                <input type="password" id="user-pass" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label>CONFIRMER LE MOT DE PASSE</label>
                <input type="password" id="user-conf" placeholder="••••••••">
            </div>

            <button class="btn-main" onclick="goToPhoto()">S'inscrire</button>
            
            <div style="margin-top: 10px;">
                <span class="auth-link" onclick="alert('Contactez l\'assistance pour réinitialiser votre mot de passe.')">Mot de passe oublié ?</span>
            </div>
            <div style="margin-top: 5px;">
                <span style="font-size: 0.8rem; color: #555;">Déjà un compte ?</span> <span class="auth-link" onclick="location.reload()">Se connecter</span>
            </div>
        </div>
    </div>

    <div id="photo-screen">
        <h2>Photo de profil</h2>
        <p style="color:#888">Dernière étape !</p>
        <img src="https://i.pravatar.cc/150?u=temp" id="preview">
        <input type="file" id="file-input" hidden accept="image/*" onchange="loadPreview(this)">
        <button class="btn-main" style="background:#222; width:220px;" onclick="document.getElementById('file-input').click()">Choisir une photo 📸</button>
        <button class="btn-main" style="width:220px; margin-top: 15px;" onclick="finishAndChat()">Accéder au Chat ✅</button>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <img src="logo.png" style="width:40px; margin-bottom:25px;">
            <div style="width:45px; height:45px; border-radius:50%; background:#111; display:flex; align-items:center; justify-content:center; color:var(--blue); border:1px solid #222; cursor:pointer;"><i class="fas fa-plus"></i></div>
        </div>
        <div id="chat-main">
            <header>
                <img src="" id="my-avatar-mini" style="width:35px; height:35px; border-radius:50%; background:#222;">
                <span id="display-name">Threndly Discussion</span>
            </header>
            <div id="msg-container"></div>
            <footer>
                <input type="text" id="msg-input" placeholder="Écrire un message...">
                <button onclick="send()" class="btn-main" style="width:50px; margin:0; border-radius:50%;"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentU = "";
        let currentP = "";

        // 1. Inscription vers Photo
        function goToPhoto() {
            const u = document.getElementById('user-id').value.trim();
            const p = document.getElementById('user-pass').value;
            const pc = document.getElementById('user-conf').value;

            if(!u || !p) return alert("Veuillez remplir tous les champs.");
            if(p !== pc) return alert("Les mots de passe ne correspondent pas.");
            
            currentU = u;
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('photo-screen').style.display = 'flex';
        }

        // 2. Aperçu photo
        function loadPreview(input) {
            const reader = new FileReader();
            reader.onload = e => { 
                currentP = e.target.result;
                document.getElementById('preview').src = currentP;
                document.getElementById('my-avatar-mini').src = currentP;
            };
            reader.readAsDataURL(input.files[0]);
        }

        // 3. Finaliser et ouvrir le chat
        function finishAndChat() {
            db.ref("profiles/"+currentU).set({ name: currentU, img: currentP || "https://i.pravatar.cc/150?u="+currentU });
            document.getElementById('photo-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            loadMessages();
        }

        function send() {
            const inp = document.getElementById('msg-input');
            if(inp.value.trim()) {
                db.ref("messages/general").push({ from: currentU, text: inp.value });
                inp.value = "";
            }
        }

        function loadMessages() {
            db.ref("messages/general").on("child_added", snap => {
                const m = snap.val();
                const d = document.createElement('div');
                d.className = `bubble ${m.from === currentU ? 'me' : 'other'}`;
                d.innerText = m.text;
                document.getElementById('msg-container').appendChild(d);
                document.getElementById('msg-container').scrollTop = document.getElementById('msg-container').scrollHeight;
            });
        }
    </script>
</body>
</html>
