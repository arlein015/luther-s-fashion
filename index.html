<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - Expérience Totale</title>
    <style>
        :root {
            --violet-premium: #9c27b0;
            --violet-clair: #ce85f2;
            --fond-sombre: #010101;
            --blanc: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--fond-sombre);
            font-family: 'Arial', sans-serif;
            overflow: hidden; color: var(--blanc);
        }

        /* L'APP CONTAINER */
        .app-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }

        .post-card {
            height: 100vh; width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #2c003e 0%, #000000 100%);
        }

        /* BADGE PRO 24 POINTES ULTRA-LISSE */
        .verified-badge-24 {
            width: 20px; height: 20px;
            position: relative; display: inline-flex;
            align-items: center; justify-content: center;
            filter: drop-shadow(0 0 3px var(--violet-clair));
            margin-left: 5px;
        }

        .verified-badge-24::before {
            content: ''; position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--violet-clair), var(--violet-premium));
            clip-path: polygon(50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%);
            border-radius: 50%;
        }

        .verified-badge-24::after {
            content: ''; position: absolute;
            width: 5px; height: 9px;
            border: solid white; border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg); margin-top: -1.5px;
        }

        /* INTERFACE TIKTOK */
        .user-details { position: absolute; bottom: 80px; left: 15px; z-index: 10; }
        .username { font-weight: bold; font-size: 17px; display: flex; align-items: center; }
        
        .actions-sidebar {
            position: absolute; right: 12px; bottom: 120px;
            display: flex; flex-direction: column; gap: 18px;
        }

        .icon-bg {
            width: 48px; height: 48px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer;
        }

        .bottom-navbar {
            position: fixed; bottom: 0; width: 100%; height: 62px;
            background-color: var(--blanc); display: flex;
            justify-content: space-around; align-items: center; z-index: 100;
        }

        .nav-link { color: #000; font-size: 11px; text-align: center; cursor: pointer; flex: 1; }

        /* SIMULATION LECTEUR VIDÉO (EFFET VISUEL) */
        .video-placeholder {
            width: 80%; height: 60%;
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--violet-clair);
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.02); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }
    </style>
</head>
<body onclick="playMusic()">

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="app-container" id="mainFeed">
        <div class="post-card">
            <div class="video-placeholder">▶️ Musique & Vidéo PRO</div>
            <div class="user-details">
                <div class="username">Paris Models <div class="verified-badge-24"></div></div>
                <div class="description">Clique n'importe où pour lancer la musique ! 🎵</div>
            </div>
            <div class="actions-sidebar">
                <div class="icon-bg" onclick="toggleLike(this)">❤️</div>
                <div class="icon-bg" onclick="customAlert('Partage', 'Lien copié !')">🔗</div>
            </div>
        </div>
    </div>

    <div class="bottom-navbar">
        <div class="nav-link">🏠<br>Accueil</div>
        <div class="nav-link" onclick="customAlert('Profil', 'Compte Certifié PRO')">👤<br>Profil</div>
    </div>

    <script>
        function playMusic() {
            var audio = document.getElementById("bgMusic");
            audio.play();
        }

        function customAlert(t, m) {
            alert("✨ MonRéseau PRO ✨\n\n[" + t + "]\n" + m);
        }

        function toggleLike(e) {
            e.style.color = e.style.color === 'red' ? 'white' : 'red';
        }

        // Auto-scroll désactivé ici pour te laisser tester le clic musique
    </script>
</body>
</html>
