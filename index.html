<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Boutique Officielle</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: #fff; color: #000; overflow-x: hidden; }

        /* --- HEADER --- */
        .top-promo { background: #000; color: #fff; text-align: center; padding: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        header { padding: 10px 15px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .logo { font-weight: 900; font-size: 22px; text-decoration: none; color: #000; letter-spacing: -1.5px; }
        .search-container { flex: 1; position: relative; margin: 0 10px; }
        .search-container input { width: 100%; padding: 10px 35px; border: 1px solid #ddd; border-radius: 4px; background: #f8f8f8; font-size: 13px; }
        .search-container .fa-camera { position: absolute; right: 10px; top: 12px; color: #888; }
        .right-icons { display: flex; align-items: center; gap: 15px; font-size: 18px; }
        .notif-badge { position: absolute; top: -6px; right: -6px; background: #FF0000; color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 50%; }

        /* --- NAV --- */
        .nav-bar { display: flex; align-items: center; gap: 15px; padding: 12px 15px; border-bottom: 1px solid #eee; overflow-x: auto; }
        .nav-bar a { text-decoration: none; color: #000; font-size: 12px; font-weight: 800; text-transform: uppercase; }
        .sale-link { color: #FF0000 !important; }

        /* --- FILTRES STYLÉS --- */
        .filter-tabs { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: #fdfdfd; }
        .tab { padding: 8px 16px; background: #eee; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .tab.active { background: #FF0000; color: #fff; }
        .tab i { margin-right: 5px; }

        /* --- GRID PRODUITS AVEC ANIMATION --- */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .p-card { border-radius: 8px; overflow: hidden; background: #fff; transition: transform 0.3s ease; border: 1px solid #f0f0f0; }
        .p-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .p-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; transition: 0.5s; }
        .p-card:hover img { scale: 1.05; }
        .p-info { padding: 12px; }
        .p-price { font-weight: 900; color: #FF0000; font-size: 16px; margin-top: 5px; }
        .add-btn { width: 100%; background: #000; color: #fff; border: none; padding: 10px; font-weight: 900; font-size: 10px; margin-top: 10px; border-radius: 4px; }

        /* --- POSTE STYLÉ (LIGNE PREMIUM) --- */
        .premium-row { grid-column: 1 / -1; background: #f9f9f9; padding: 15px; border-radius: 12px; margin: 10px 0; border: 2px solid #000; }
        .premium-label { background: #000; color: #fff; display: inline-block; padding: 3px 10px; font-size: 9px; font-weight: 900; border-radius: 4px; margin-bottom: 10px; }

        /* --- FOOTER --- */
        footer { background: #000; color: #fff; padding: 40px 20px; }
        .social-icons { display: flex; gap: 20px; justify-content: center; font-size: 20px; margin: 30px 0; color: #fff; }
        .copyright { text-align: center; font-size: 10px; color: #666; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <a href="#" class="logo">LUTHERFASHION</a>
        <div class="search-container">
            <input type="text" placeholder="Rechercher...">
            <i class="fas fa-camera"></i>
        </div>
        <div class="right-icons">
            <span style="font-size:12px; font-weight:900;">FR</span>
            <div style="position:relative;">
                <i class="fas fa-shopping-bag"></i>
                <span class="notif-badge">0</span>
            </div>
        </div>
    </div>
</header>

<nav class="nav-bar">
    <i class="fas fa-bars"></i>
    <a href="#">WOMEN</a>
    <a href="#">MEN</a>
    <a href="#">NOUVEAUTÉS</a>
    <a href="#" class="sale-link">SOLDES</a>
</nav>

<div class="filter-tabs">
    <div class="tab active"><i class="fas fa-sparkles"></i>For You</div>
    <div class="tab">New In</div>
    <div class="tab">Sale</div>
    <div class="tab">Tops</div>
    <div class="tab">Matching Sets</div>
</div>

<div class="product-grid" id="main-grid"></div>

<footer>
    <div class="social-icons">
        <i class="fab fa-instagram"></i><i class="fab fa-tiktok"></i><i class="fab fa-snapchat"></i><i class="fab fa-facebook"></i>
    </div>
    <div class="copyright">© 2026 Fashion Nova, LLC All Rights Reserved</div>
</footer>

<script>
    const grid = document.getElementById('main-grid');
    
    // Génération de 30 produits avec animations alternées
    for (let i = 1; i <= 30; i++) {
        const price = (Math.random() * (90 - 20) + 20).toFixed(2);
        const isPremium = i % 6 === 0; // Toutes les 6 fiches (soit après 2 rangs de 2), on met une ligne premium
        const img = i % 2 === 0 ? 'Veste vert.jpg' : 'veste jaune.jpg'; //

        if (isPremium) {
            grid.innerHTML += `
                <div class="premium-row">
                    <span class="premium-label">TRENDING NOW</span>
                    <div style="display:flex; gap:15px; align-items:center;">
                        <img src="${img}" style="width:100px; border-radius:8px;">
                        <div>
                            <div style="font-weight:900; font-size:14px;">EDITION LIMITÉE #${i}</div>
                            <div class="p-price">${price} $</div>
                            <button class="add-btn" style="width:auto; padding:8px 20px;">VOIR L'EXCLU</button>
                        </div>
                    </div>
                </div>
            `;
        } else {
            grid.innerHTML += `
                <div class="p-card">
                    <img src="${img}">
                    <div class="p-info">
                        <div style="font-size:11px; font-weight:700;">Veste Bomber Collection #${i}</div>
                        <div class="p-price">${price} $</div>
                        <button class="add-btn">AJOUTER AU PANIER</button>
                    </div>
                </div>
            `;
        }
    }
</script>

</body>
</html>
