<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --violet-p: #9c27b0; --pink-notif: #ff3b5c; --blue-cert: #20d5ec; --bg-light: #f1f1f1; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: white; overflow: hidden; height: 100%; width: 100%; }

        /* --- SYSTÈME DE PAGES --- */
        .page { display: none; height: calc(100% - 60px); width: 100%; overflow-y: auto; }
        .active-page { display: flex; flex-direction: column; }

        /* --- PAGE MESSAGES --- */
        .header-msg { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #f0f0f0; align-items: center; background: white; position: sticky; top: 0; z-index: 10; }
        .stories { display: flex; gap: 15px; padding: 15px; overflow-x: auto; border-bottom: 1px solid #f5f5f5; }
        .story { text-align: center; font-size: 11px; min-width: 70px; }
        .story img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--blue-cert); padding: 2px; }
        .msg-item { display: flex; align-items: center; padding: 12px 15px; gap: 12px; cursor: pointer; }
        .badge-red { background: var(--pink-notif); color: white; font-size: 11px; font-weight: bold; min-width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: auto; padding: 0 5px; }

        /* --- VUE CHAT & CLAVIER --- */
        #view-chat { position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: #f0f2f5; z-index: 2000; transition: 0.3s; display: flex; flex-direction: column; }
        #view-chat.active { left: 0; }
        .chat-header { background: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; }
        .chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 14px; }
        .sent { background: var(--violet-p); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        /* BARRE DE SAISIE MULTIMÉDIA */
        .input-bar { padding: 8px 12px; background: white; display: flex; align-items: center; gap: 10px; border-top: 1px solid #eee; }
        .btn-camera-blue { background: #00a2f8; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .input-container-wrapper { flex-grow: 1; position: relative; display: flex; align-items: center; }
        .input-field { width: 100%; background: var(--bg-light); border: 1px solid #e0e0e0; padding: 10px 75px 10px 15px; border-radius: 25px; outline: none; }
        .inner-icons { position: absolute; right: 15px; display: flex; gap: 12px; color: #555; font-size: 18px; }

        /* --- PAGE PROFIL --- */
        .profile-header { padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
        .profile-pic { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--blue-cert); padding: 3px; }
        .profile-name { font-size: 18px; font-weight: bold; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 5px; }

        /* --- NAV BAS --- */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: white; font-size: 22px; opacity: 0.6; cursor: pointer; }
        .nav-item.active { opacity: 1; }
    </style>
</head>
<body>

    <div id="page-messages" class="page active-page">
        <div class="header-msg">
            <i class="fas fa-users" style="font-size: 24px;"></i>
            <b style="font-size: 20px;">Messages <span style="color:#2ecc71">•</span></b>
            <i class="fas fa-search" style="font-size: 20px;"></i>
        </div>
        <div class="stories" id="story-line"></div>
        <div id="contact-list"></div>
    </div>

    <div id="page-profile" class="page">
        <div class="profile-header">
            <img src="https://i.pravatar.cc/150?u=threndly" class="profile-pic">
            <div class="profile-name">
                Threndly 
                <i class="fas fa-check-circle" style="color: var(--blue-cert);"></i> </div>
            <p style="color: gray; font-size: 13px;">@threndly_official</p>
        </div>
    </div>

    <div id="view-chat">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:12px;">
                <i class="fas fa-arrow-left" onclick="closeChat()"></i>
                <img id="chat-avatar" style="width:35px; height:35px; border-radius:50%;">
                <b id="chat-name"></b>
            </div>
            <i class="fas fa-ellipsis-v"></i>
        </div>
        <div class="chat-messages" id="chat-box"></div>
        
        <div class="input-bar">
            <div class="btn-camera-blue"><i class="fas fa-camera"></i></div>
            <div class="input-container-wrapper">
                <input type="text" class="input-field" id="chatInput" placeholder="Message..." oninput="toggleIcons()">
                <div class="inner-icons">
                    <i class="far fa-image"></i>
                    <i class="far fa-smile"></i>
                </div>
            </div>
            <i class="fas fa-microphone" id="micBtn" style="font-size: 22px; color: #555;"></i>
            <i class="fas fa-paper-plane" id="sendBtn" style="display:none; font-size: 22px; color: var(--violet-p);" onclick="sendMessage()"></i>
        </div>
    </div>

    <div class="nav-bottom">
        <i class="fas fa-home nav-item" onclick="switchPage('home')"></i>
        <i class="fas fa-search nav-item"></i>
        <div style="background:linear-gradient(to right, #20d5ec, var(--violet-p)); padding:5px 15px; border-radius:8px;"><b>+</b></div>
        <i id="nav-msg" class="fas fa-envelope nav-item active" onclick="switchPage('messages')"></i>
        <i id="nav-prof" class="fas fa-user nav-item" onclick="switchPage('profile')"></i>
    </div>

    <script>
        const contacts = [
            { id: 1, name: "Norah Nelsie", img: "https://i.pravatar.cc/100?u=1", last: "ilbsdkjbiqsUHdmbqs", count: 1 },
            { id: 2, name: "Hadriel 🇲🇬", img: "https://i.pravatar.cc/100?u=2", last: "Ça va toi ?", count: 1 }
        ];

        function renderList() {
            const list = document.getElementById('contact-list');
            const stories = document.getElementById('story-line');
            list.innerHTML = ""; stories.innerHTML = "";
            contacts.forEach(c => {
                stories.innerHTML += `<div class="story"><img src="${c.img}"><br>${c.name.split(' ')[0]}</div>`;
                list.innerHTML += `
                    <div class="msg-item" onclick="openChat(${c.id})">
                        <img src="${c.img}" style="width:50px; height:50px; border-radius:50%;">
                        <div style="flex-grow:1"><b>${c.name}</b><br><small style="color:gray">${c.last}</small></div>
                        ${c.count > 0 ? `<div class="badge-red">${c.count}</div>` : ''}
                    </div>`;
            });
        }

        function openChat(id) {
            const c = contacts.find(x => x.id === id);
            document.getElementById('chat-name').innerText = c.name;
            document.getElementById('chat-avatar').src = c.img;
            document.getElementById('view-chat').classList.add('active');
        }

        function closeChat() { document.getElementById('view-chat').classList.remove('active'); }

        function toggleIcons() {
            const val = document.getElementById('chatInput').value;
            document.getElementById('micBtn').style.display = val ? 'none' : 'block';
            document.getElementById('sendBtn').style.display = val ? 'block' : 'none';
        }

        function switchPage(p) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            if(p === 'messages') {
                document.getElementById('page-messages').classList.add('active-page');
                document.getElementById('nav-msg').classList.add('active');
            } else if(p === 'profile') {
                document.getElementById('page-profile').classList.add('active-page');
                document.getElementById('nav-prof').classList.add('active');
            }
        }

        renderList();
    </script>
</body>
</html>
