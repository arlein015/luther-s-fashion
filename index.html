<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - TikTok Auto-Scroll</title>
    <style>
        :root {
            --violet-premium: #9c27b0;
            --violet-clair: #ce85f2;
            --fond-sombre: #010101;
            --blanc: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--fond-sombre);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: var(--blanc);
            user-select: none;
        }

        /* CONTENEUR DE SCROLL */
        .app-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }

        .post-card {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #2c003e 0%, #000000 100%);
        }

        /* BADGE PRO 24 POINTES */
        .verified-badge-24 {
            width: 20px;
            height: 20px;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 2px var(--violet-clair));
            margin-left: 5px;
        }

        .verified-badge-24::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--violet-clair), var(--violet-premium));
            clip-path: polygon(50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%);
            border-radius: 50%; /* */
        }

        .verified-badge-24::after {
            content: '';
            position: absolute;
            width: 5px;
            height: 9px;
            border: solid white;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg);
            margin-top: -1.5px;
        }

        .user-details {
            position: absolute;
            bottom: 80px;
            left: 15px;
            z-index: 10;
        }

        .username {
            font-weight: bold;
            font-size: 17px;
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .actions-sidebar {
            position: absolute;
            right: 12px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        .action-icon {
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .icon-bg {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 4px;
        }

        .icon-bg.liked { color: #ff3b5c; background: rgba(255, 59, 92, 0.2); }

        .bottom-navbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 62px;
            background-color: var(--blanc);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #ddd;
            z-index: 100;
        }

        .nav-link {
            text-align: center;
            font-size: 11px;
            color: #000;
            cursor: pointer;
            flex: 1;
        }

        .publish-btn {
            background: linear-gradient(90deg, var(--violet-clair), var(--violet-premium));
            width: 44px;
            height: 28px;
            border-radius: 7px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container" id="mainFeed">
        
        <div class="post-card" id="post1">
            <div class="user-details">
                <div class="username">Paris Models <div class="verified-badge-24"></div></div>
                <div class="description">Bienvenue ! Le défilement est automatique toutes les 10s.</div>
            </div>
            <div class="actions-sidebar">
                <div class="action-icon" onclick="toggleLike(this)"><div class="icon-bg">❤️</div><span>8.5k</span></div>
                <div class="action-icon" onclick="customAlert('Commentaires', 'Chargement de l\'espace discussion...')"><div class="icon-bg">💬</div><span>122</span></div>
                <div class="action-icon" onclick="customAlert('Partage', 'Lien copié dans votre presse-papier !')"><div class="icon-bg">🔗</div><span>Partager</span></div>
            </div>
        </div>

        <div class="post-card" id="post2" style="background: linear-gradient(180deg, #4a148c 0%, #000000 100%);">
            <div class="user-details">
                <div class="username">Admin VIP <div class="verified-badge-24"></div></div>
                <div class="description">Toutes les touches fonctionnent. Teste le bouton + !</div>
            </div>
            <div class="actions-sidebar">
                <div class="action-icon" onclick="toggleLike(this)"><div class="icon-bg">❤️</div><span>25k</span></div>
                <div class="action-icon" onclick="customAlert('Commentaires', 'Espace réservé aux membres Premium.')"><div class="icon-bg">💬</div><span>900</span></div>
            </div>
        </div>

    </div>

    <div class="bottom-navbar">
        <div class="nav-link" onclick="customAlert('Accueil', 'Vous êtes déjà sur le fil d\'actualité.')">🏠<br>Accueil</div>
        <div class="nav-link" onclick="customAlert('Amis', 'Recherche de vos contacts en cours...')">👥<br>Amis</div>
        <div class="publish-btn" onclick="customAlert('Publication', 'Accès à la caméra autorisé.')">+</div>
        <div class="nav-link" onclick="customAlert('Messages', 'Aucun nouveau message.')">💬<br>Boîte</div>
        <div class="nav-link" onclick="customAlert('Profil', 'Ouverture de votre profil PRO...')">👤<br>Profil</div>
    </div>

    <script>
        // 1. Personnalisation des alertes
        function customAlert(titre, message) {
            alert("✨ MonRéseau PRO ✨\n\n[" + titre + "]\n" + message);
        }

        // 2. Fonction Like
        function toggleLike(element) {
            const icon = element.querySelector('.icon-bg');
            icon.classList.toggle('liked');
            element.style.transform = "scale(1.2)";
            setTimeout(() => { element.style.transform = "scale(1)"; }, 100);
        }

        // 3. Fonction Changement Automatique (Auto-Scroll)
        const feed = document.getElementById('mainFeed');
        let currentPost = 0;
        const posts = document.querySelectorAll('.post-card');

        setInterval(() => {
            currentPost++;
            if (currentPost >= posts.length) currentPost = 0;
            
            posts[currentPost].scrollIntoView({ behavior: 'smooth' });
            console.log("Passage automatique au post " + (currentPost + 1));
        }, 10000); // Change toutes les 10 secondes (10000 ms)
    </script>

</body>
</html>
