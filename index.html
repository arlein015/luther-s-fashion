<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - Style TikTok Violet</title>
    <style>
    /* 1. L'animation du disque de musique */
    @keyframes rotateDisc {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .music-disc {
        width: 40px; height: 40px; border-radius: 50%;
        background: radial-gradient(circle, #333 30%, #111 100%);
        border: 4px solid rgba(255,255,255,0.2);
        animation: rotateDisc 3s linear infinite;
        position: absolute; right: 15px; bottom: 20px;
    }

    /* 2. Style pour le badge 24 pointes blanc/violet */
    .badge-24-pro {
        width: 18px; height: 18px; background: white;
        clip-path: polygon(50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%);
        display: inline-flex; align-items: center; justify-content: center;
        margin-left: 5px;
    }
    .badge-24-pro::after {
        content: '✓'; color: #9c27b0; font-size: 10px; font-weight: bold;
    }
</style>

<div class="side-bar">
    <div class="profile-pic">
        <img src="ta-photo.jpg" style="width:100%; height:100%; border-radius:50%;">
        <div id="followBtn" onclick="this.style.display='none'" style="position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); background:#fe2c55; color:white; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer;">+</div>
    </div>
    
    <div class="action-item" onclick="likePost(this)">
        <span id="heartIcon" style="font-size: 35px; transition: 0.2s;">🤍</span>
        <span>150.6K</span>
    </div>

    <div class="music-disc"></div>
</div>

<script>
    function likePost(el) {
        const heart = document.getElementById('heartIcon');
        if(heart.innerText === '🤍') {
            heart.innerText = '❤️';
            heart.style.transform = 'scale(1.3)';
            setTimeout(() => heart.style.transform = 'scale(1)', 200);
        } else {
            heart.innerText = '🤍';
        }
    }
</script>
</head>
<body>

    <div class="top-nav">
        <div class="live-btn">📺</div>
        <div class="search-bar">
            <input type="text" placeholder="Rechercher des vidéos...">
        </div>
        <div style="font-size: 20px;">🔔</div>
    </div>

    <div class="video-container">
        <h1 style="font-size: 42px; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">zah zalaah ty aiiii</h1>

        <div class="side-bar">
            <div class="profile-pic"></div> <div class="action-item">
                <span style="font-size: 30px;">🤍</span>
                <span>150.6K</span>
            </div>
            <div class="action-item">
                <span style="font-size: 30px;">💬</span>
                <span>274</span>
            </div>
            <div class="action-item">
                <span style="font-size: 30px;">🔖</span>
                <span>7286</span>
            </div>
            <div class="action-item">
                <span style="font-size: 30px;">➥</span>
                <span>2570</span>
            </div>
        </div>

        <div class="video-overlay">
            <h3 style="margin: 0; display: flex; align-items: center;">
                Moi (Premium) <div class="badge-24"></div>
            </h3>
            <p style="margin: 5px 0 0; font-size: 15px;">#fyp #viral #PremiumStyle</p>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-icon">🏠<br>Accueil</div>
        <div class="nav-icon">👥<br>Amis</div>
        <div class="nav-icon" onclick="alert('Ajouter à votre publication')">
            <div class="plus-container">+</div>
        </div>
        <div class="nav-icon">💬<br>Boîte de réception</div>
        <div class="nav-icon">👤<br>Profil</div>
    </div>

</body>
</html>
