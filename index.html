<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther's Fashion - Global Network</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --violet: #9c27b0; --light-violet: #ce85f2; --tiktok-red: #ff3b5c; --bg: #1a0121; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }

        /* --- NAVIGATION HAUT (RECHERCHE & FLUX) --- */
        .top-nav { position: fixed; top: 0; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 100; padding-top: 10px; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); }
        .search-bar { width: 80%; background: rgba(255,255,255,0.2); border-radius: 20px; padding: 8px 15px; display: flex; align-items: center; margin-bottom: 10px; }
        .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; }
        .feed-tabs { display: flex; gap: 20px; font-weight: bold; font-size: 17px; }
        .tab.active { border-bottom: 3px solid white; padding-bottom: 5px; }

        /* --- STORIES HORIZONTALES --- */
        .stories-container { position: fixed; top: 80px; width: 100%; display: flex; gap: 15px; padding: 10px; overflow-x: auto; white-space: nowrap; z-index: 90; scrollbar-width: none; }
        .story-circle { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--light-violet); padding: 2px; flex-shrink: 0; position: relative; }
        .story-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .my-story .add-icon { position: absolute; bottom: 0; right: 0; background: var(--violet); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        /* --- CONTENU PRINCIPAL (STYLE TIKTOK) --- */
        .video-feed { height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; padding-bottom: 100px; background: red; /* Simulation du fond rouge de ta capture */ }
        .post-info { max-width: 70%; }
        .post-info h3 { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        
        /* LE BADGE 24 POINTES PREMIER */
        .badge-24 { width: 18px; height: 18px; background: white; clip-path: polygon(50% 0%, 58% 10%, 68% 5%, 72% 16%, 83% 15%, 83% 26%, 93% 30%, 90% 41%, 98% 50%, 90% 59%, 93% 70%, 83% 74%, 83% 85%, 72% 84%, 68% 95%, 58% 90%, 50% 100%, 42% 90%, 32% 95%, 28% 84%, 17% 85%, 17% 74%, 7% 70%, 10% 59%, 2% 50%, 10% 41%, 7% 30%, 17% 26%, 17% 15%, 28% 16%, 32% 5%, 42% 10%); display: flex; align-items: center; justify-content: center; }
        .badge-24::after { content: '✔'; color: var(--violet); font-size: 10px; font-weight: bold; }

        /* --- ACTIONS DROITE --- */
        .side-actions { position: fixed; right: 15px; bottom: 120px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 100; }
        .action-item { text-align: center; font-size: 12px; font-weight: bold; }
        .action-item i { font-size: 30px; margin-bottom: 5px; transition: 0.3s; }
        .heart.active { color: var(--tiktok-red); transform: scale(1.2); }
        .profile-btn { position: relative; margin-bottom: 10px; }
        .profile-btn img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid white; }
        .profile-btn .plus-red { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: var(--tiktok-red); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        /* --- DISQUE TOURNANT --- */
        .music-disc { width: 40px; height: 40px; background: radial-gradient(circle, #333 30%, #000 100%); border-radius: 50%; animation: rotate 3s linear infinite; display: flex; align-items: center; justify-content: center; border: 5px solid #222; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- BARRE DE NAVIGATION BAS --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: black; display: flex; justify-content: space-around; align-items: center; z-index: 200; border-top: 1px solid #333; }
        .btn-plus { background: linear-gradient(to right, #20d5ec 0%, var(--violet) 100%); padding: 5px 15px; border-radius: 10px; font-weight: bold; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid black; }

        /* --- MODAL INSCRIPTION MULTI-RESEAUX --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 5000; }
        .modal-card { background: white; color: black; width: 90%; max-width: 400px; padding: 30px; border-radius: 20px; text-align: center; }
        .social-btn { display: flex; align-items: center; width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; position: relative; }
        .social-btn i { font-size: 20px; position: absolute; left: 20px; }
        .btn-google { background: #fff; } .btn-apple { background: #000; color: #fff; } .btn-fb { background: #1877f2; color: #fff; border: none; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="search-bar">
            <i class="fas fa-search" style="margin-right: 10px; opacity: 0.7;"></i>
            <input type="text" placeholder="Rechercher sur Luther's...">
            <i class="fas fa-video" style="margin-left: 10px;"></i>
        </div>
        <div class="feed-tabs">
            <span class="tab">Live</span>
            <span class="tab">Suivi</span>
            <span class="tab active">Pour toi</span>
        </div>
    </div>

    <div class="stories-container">
        <div class="story-circle my-story" onclick="document.getElementById('uploadProfile').click()">
            <img id="myStoryImg" src="https://via.placeholder.com/100" alt="Moi">
            <div class="add-icon">+</div>
        </div>
        <div class="story-circle"><img src="https://i.pravatar.cc/100?u=1"></div>
        <div class="story-circle"><img src="https://i.pravatar.cc/100?u=2"></div>
        <div class="story-circle"><img src="https://i.pravatar.cc/100?u=3"></div>
    </div>

    <div class="video-feed">
        <div class="post-info">
            <h3 id="profileName">Luther <div class="badge-24"></div></h3>
            <p>Découvrez la nouvelle collection #LuthersFashion #Style #Premium 🚀</p>
            <p style="font-size: 14px; opacity: 0.9;">♫ Musique originale - Luther (En boucle)</p>
        </div>

        <div class="side-actions">
            <div class="profile-btn" onclick="openLogin()">
                <img id="sideProfilePic" src="https://via.placeholder.com/100">
                <div class="plus-red" id="followPlus">+</div>
            </div>
            <div class="action-item" onclick="toggleLike(this)">
                <i class="fas fa-heart heart"></i><br>150.6K
            </div>
            <div class="action-item" onclick="alert('Commentaires bientôt dispo')">
                <i class="fas fa-comment-dots"></i><br>274
            </div>
            <div class="action-item" onclick="toggleSave(this)">
                <i class="fas fa-bookmark bookmark"></i><br>12.4K
            </div>
            <div class="action-item" onclick="shareProfile()">
                <i class="fas fa-share"></i><br>Partager
            </div>
            <div class="music-disc">
                <div style="width: 15px; height: 15px; background: #555; border-radius: 50%;"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <i class="fas fa-home" style="font-size: 20px;"></i>
        <i class="fas fa-users" style="font-size: 20px;"></i>
        <div class="btn-plus">+</div>
        <div style="position: relative;">
            <i class="fas fa-comment-alt" style="font-size: 20px;"></i>
            <div class="notif-badge" id="notif">1</div>
        </div>
        <i class="fas fa-user" onclick="openLogin()" style="font-size: 20px;"></i>
    </div>

    <div id="loginModal" class="modal-overlay">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span onclick="closeLogin()" style="font-size: 24px; cursor: pointer;">✕</span>
                <h2 style="margin: 0;">Rejoindre Luther's</h2>
                <span></span>
            </div>

            <input type="text" id="userEmail" placeholder="Email ou Nom d'utilisateur" style="width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd;">
            <input type="password" id="userPass" placeholder="Mot de passe" style="width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ddd;">

            <div class="social-btn btn-google" onclick="handleAuth('Google')"><i class="fab fa-google"></i> Continuer avec Google</div>
            <div class="social-btn btn-apple" onclick="handleAuth('Apple')"><i class="fab fa-apple"></i> Continuer avec Apple</div>
            <div class="social-btn btn-fb" onclick="handleAuth('Facebook')"><i class="fab fa-facebook"></i> Continuer avec Facebook</div>
            
            <button onclick="handleAuth('Direct')" style="width: 100%; background: var(--tiktok-red); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer;">
                S'inscrire / Se connecter
            </button>
        </div>
    </div>

    <input type="file" id="uploadProfile" style="display: none;" onchange="updateProfilePic(event)">

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbzmWi55H7--DzkuiTHWS4Q4xmqeBq9WvkLpd0y9GIpTL3osmmL4zpACStbOCOwYgw0Q/exec";

        function openLogin() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeLogin() { document.getElementById('loginModal').style.display = 'none'; }

        function toggleLike(el) {
            const icon = el.querySelector('.heart');
            icon.classList.toggle('active');
            if(icon.classList.contains('active')) {
                icon.className = 'fas fa-heart heart active';
                confetti({ particleCount: 40, spread: 50, origin: { x: 0.9, y: 0.7 }, colors: ['#ff3b5c'] });
            } else { icon.className = 'fas fa-heart heart'; }
        }

        function handleAuth(method) {
            const email = document.getElementById('userEmail').value || method;
            const pass = document.getElementById('userPass').value || "OAuth";

            if (email === "Direct" || (email && pass)) {
                // Envoi à Google Sheets
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ methode: method, nom: email, mdp: pass, pays: "Détecté" })
                });

                alert("Succès ! Bienvenue " + email);
                document.getElementById('profileName').innerHTML = email + ' <div class="badge-24"></div>';
                closeLogin();
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
            }
        }

        function updateProfilePic(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const url = reader.result;
                document.getElementById('myStoryImg').src = url;
                document.getElementById('sideProfilePic').src = url;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function shareProfile() {
            if (navigator.share) {
                navigator.share({ title: "Luther's Fashion", url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Lien copié !");
            }
        }

        // Simuler la disparition de la notification
        document.querySelector('.fa-comment-alt').parentElement.onclick = () => {
            document.getElementById('notif').style.display = 'none';
        };
    </script>
</body>
</html>
