<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; }

        /* Login Screen */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; width: 300px; text-align: center; }
        .logo-te { font-size: 2.5rem; font-weight: bold; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .auth-input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .btn-main { background: var(--grad); border: none; padding: 14px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; width: 100%; }

        /* Interface App */
        #app-interface { display: none; flex-direction: column; height: 100vh; }
        
        /* Header avec les boutons d'appel */
        header { padding: 10px 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #000; height: 60px; }
        .partner-info { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1.1rem; }
        .header-btns { display: flex; gap: 18px; color: #888; font-size: 1.2rem; }
        .header-btns i { cursor: pointer; transition: 0.3s; }
        .header-btns i:hover { color: white; }

        /* Zone de discussion */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 18px; max-width: 75%; position: relative; }
        .msg img { max-width: 100%; border-radius: 12px; display: block; margin-top: 5px; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }
        .my-msg { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }

        /* Barre de saisie en bas */
        #input-area { padding: 12px 15px; background: #000; border-top: 1px solid #222; display: flex; align-items: center; gap: 12px; }
        .input-container { flex: 1; background: #1a1a1a; border-radius: 25px; display: flex; align-items: center; padding: 0 15px; }
        #message-input { flex: 1; background: transparent; border: none; padding: 12px 0; color: white; outline: none; font-size: 0.95rem; }
        
        .icon-btn { color: #888; font-size: 1.4rem; cursor: pointer; }
        .send-btn { background: var(--grad); border: none; width: 42px; height: 42px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="logo-te">Threndly</div>
    <div class="auth-card">
        <input type="text" id="user-id" class="auth-input" placeholder="Ton nom">
        <input type="password" id="user-pass" class="auth-input" placeholder="Mot de passe">
        <button class="btn-main" onclick="handleAuth()">Se connecter ✅</button>
    </div>
</div>

<div id="app-interface">
    <header>
        <div class="partner-info" id="partner-display">
            Threndly <i class="fas fa-check-circle" style="color:var(--cyan); font-size:0.9rem"></i>
        </div>
        <div class="header-btns">
            <i class="fas fa-phone"></i>
            <i class="fas fa-video"></i>
            <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#ff4444"></i>
        </div>
    </header>

    <div id="chat-box"></div>

    <div id="input-area">
        <label for="img-input" class="icon-btn"><i class="far fa-image"></i></label>
        <input type="file" id="img-input" hidden accept="image/*" onchange="sendPhoto(this)">
        
        <div class="input-container">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        
        <button class="send-btn" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myUser = localStorage.getItem('threndly_user') || "";

    if(myUser) enterApp(myUser);

    function handleAuth() {
        const id = document.getElementById('user-id').value.trim();
        if(id) enterApp(id);
    }

    function enterApp(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-interface').style.display = 'flex';
        startChat();
    }

    function sendMsg() {
        const input = document.getElementById('message-input');
        if(input.value.trim()){
            db.ref("messages").push({ user: myUser, text: input.value, type: 'text' });
            input.value = "";
        }
    }

    function sendPhoto(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxW = 500; 
                const scale = maxW / img.width;
                canvas.width = maxW;
                canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const base64Img = canvas.toDataURL('image/jpeg', 0.7);
                db.ref("messages").push({ user: myUser, text: base64Img, type: 'image' });
            }
        };
        reader.readAsDataURL(file);
    }

    function startChat() {
        const box = document.getElementById('chat-box');
        db.ref("messages").off();
        db.ref("messages").on("child_added", snap => {
            const data = snap.val();
            const isMe = data.user === myUser;
            
            // Mise à jour du nom de l'autre en haut
            if(!isMe) {
                document.getElementById('partner-display').innerHTML = `${data.user} <i class="fas fa-check-circle" style="color:var(--cyan); font-size:0.9rem"></i>`;
            }

            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'my-msg' : 'other-msg'}`;
            if(data.type === 'image') div.innerHTML = `<img src="${data.text}">`;
            else div.innerText = data.text;
            
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    }

    function logout() { localStorage.removeItem('threndly_user'); location.reload(); }
</script>
</body>
</html>
