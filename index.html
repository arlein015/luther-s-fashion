<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅ - Ultra App</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #075e54; --secondary: #128c7e; --light: #dcf8c6; --bg: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { background: var(--primary); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .call-icons i { margin-left: 20px; cursor: pointer; font-size: 1.2rem; }

        /* Chat Area */
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; position: relative; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: var(--light); border-top-right-radius: 0; }
        .received { align-self: flex-start; background: white; border-top-left-radius: 0; }
        .msg-info { font-size: 10px; opacity: 0.6; display: block; margin-top: 5px; text-align: right; }
        .media-content { max-width: 100%; border-radius: 8px; margin-top: 5px; }

        /* Input Area */
        #input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #ddd; }
        input[type="text"] { flex: 1; border: none; padding: 12px 15px; border-radius: 25px; outline: none; }
        .icon-btn { color: #51585c; font-size: 1.3rem; cursor: pointer; }
        .send-btn { color: var(--primary); font-size: 1.5rem; border: none; background: none; cursor: pointer; }

        /* Calling Overlay */
        #call-overlay { position: fixed; inset: 0; background: #075e54; color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #video-grid { display: grid; grid-template-columns: 1fr; width: 100%; height: 60%; gap: 10px; padding: 20px; }
        video { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; background: #222; }
        .call-controls { margin-top: 30px; display: flex; gap: 20px; }
        .btn-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; border: none; }
        .btn-end { background: #ff3b30; color: white; }
    </style>
</head>
<body>

<header>
    <div class="user-info">
        <i class="fas fa-user-circle fa-2x"></i>
        <span id="display-username">Threndly ✅</span>
    </div>
    <div class="call-icons">
        <i class="fas fa-phone" onclick="initiateCall('audio')"></i>
        <i class="fas fa-video" onclick="initiateCall('video')"></i>
    </div>
</header>

<div id="chat-container"></div>

<div id="input-area">
    <i class="far fa-smile icon-btn"></i>
    <label for="file-upload"><i class="fas fa-paperclip icon-btn"></i></label>
    <input type="file" id="file-upload" style="display:none" onchange="handleFileUpload(this)">
    <input type="text" id="msg-input" placeholder="Ecrivez un message..." onkeypress="if(event.key=='Enter')sendMsg()">
    <i class="fas fa-microphone icon-btn" id="voice-rec" onclick="startVoiceRecord()"></i>
    <button onclick="sendMsg()" class="send-btn"><i class="fas fa-paper-plane"></i></button>
</div>

<div id="call-overlay">
    <h2 id="call-status">Appel en cours...</h2>
    <div id="video-grid">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div class="call-controls">
        <button class="btn-circle btn-end" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
    </div>
</div>

<script>
    // 1. TA CONFIGURATION FIREBASE
    const firebaseConfig = {
        apiKey: "TON_API_KEY",
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        storageBucket: "trendly-fca7c.appspot.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();
    const auth = firebase.auth();

    // Connexion anonyme pour autoriser l'upload
    auth.signInAnonymously();

    let myName = prompt("Entrez votre nom pour Threndly ✅") || "Anonyme";
    document.getElementById('display-username').innerText = myName;

    // 2. ENVOI DE TEXTE
    function sendMsg() {
        const text = document.getElementById('msg-input').value;
        if(text.trim()){
            db.ref("messages").push({
                user: myName,
                text: text,
                type: "text",
                time: new Date().toLocaleTimeString()
            });
            document.getElementById('msg-input').value = "";
        }
    }

    // 3. ENVOI DE PHOTOS / VIDEOS / VOCAUX
    function handleFileUpload(input) {
        const file = input.files[0];
        if(!file) return;

        const path = `threndly/${Date.now()}_${file.name}`;
        const ref = storage.ref(path);
        
        ref.put(file).then(() => ref.getDownloadURL()).then(url => {
            let type = "file";
            if(file.type.startsWith("image")) type = "image";
            if(file.type.startsWith("video")) type = "video";
            if(file.type.startsWith("audio")) type = "audio";

            db.ref("messages").push({
                user: myName,
                url: url,
                type: type,
                fileName: file.name,
                time: new Date().toLocaleTimeString()
            });
        });
    }

    // 4. RÉCEPTION EN TEMPS RÉEL
    db.ref("messages").limitToLast(20).on("child_added", snap => {
        const m = snap.val();
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `msg ${m.user === myName ? 'sent' : 'received'}`;
        
        let content = `<strong>${m.user}</strong><br>`;
        if(m.type === 'text') content += m.text;
        if(m.type === 'image') content += `<img src="${m.url}" class="media-content">`;
        if(m.type === 'video') content += `<video src="${m.url}" controls class="media-content"></video>`;
        if(m.type === 'audio') content += `<audio src="${m.url}" controls style="width:100%"></audio>`;
        
        content += `<span class="msg-info">${m.time}</span>`;
        div.innerHTML = content;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    });

    // 5. SYSTÈME D'APPEL (Logique simplifiée WebRTC)
    function initiateCall(type) {
        document.getElementById('call-overlay').style.display = 'flex';
        // Ici on active la caméra locale
        navigator.mediaDevices.getUserMedia({video: type === 'video', audio: true})
            .then(stream => {
                document.getElementById('localVideo').srcObject = stream;
                // Signalement à l'autre utilisateur via Firebase...
            });
    }

    function endCall() {
        const stream = document.getElementById('localVideo').srcObject;
        if(stream) stream.getTracks().forEach(track => track.stop());
        document.getElementById('call-overlay').style.display = 'none';
    }
</script>
</body>
</html>
