<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - Créer un Post</title>
    <style>
        :root {
            --violet-premium: #9c27b0;
            --violet-clair: #ce85f2;
            --fond-sombre: #010101;
            --blanc: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--fond-sombre);
            font-family: 'Arial', sans-serif;
            overflow: hidden; color: var(--blanc);
        }

        /* CONTENEUR DES POSTS */
        .app-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }

        .post-card {
            height: 100vh; width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #2c003e 0%, #000000 100%);
        }

        /* BADGE PRO 24 POINTES */
        .verified-badge-24 {
            width: 18px; height: 18px;
            position: relative; display: inline-flex;
            align-items: center; justify-content: center;
            filter: drop-shadow(0 0 3px var(--violet-clair));
            margin-left: 5px;
        }
        .verified-badge-24::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--violet-clair), var(--violet-premium));
            clip-path: polygon(50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%);
            border-radius: 50%;
        }
        .verified-badge-24::after {
            content: ''; position: absolute; width: 4px; height: 7px;
            border: solid white; border-width: 0 2px 2px 0;
            transform: rotate(45deg); margin-top: -1px;
        }

        /* INTERFACE */
        .user-details { position: absolute; bottom: 90px; left: 15px; z-index: 10; }
        .username { font-weight: bold; font-size: 17px; display: flex; align-items: center; margin-bottom: 5px;}
        
        .bottom-navbar {
            position: fixed; bottom: 0; width: 100%; height: 65px;
            background-color: var(--blanc); display: flex;
            justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-link { color: #000; font-size: 11px; text-align: center; cursor: pointer; flex: 1; }
        .publish-btn {
            background: linear-gradient(90deg, var(--violet-clair), var(--violet-premium));
            width: 50px; height: 32px; border-radius: 8px;
            color: white; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 24px; cursor: pointer;
        }

        /* --- FENÊTRE DE PUBLICATION (MODAL) --- */
        #postModal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 200;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; color: black; width: 90%; max-width: 400px;
            padding: 20px; border-radius: 15px; text-align: center;
        }
        .modal-content textarea {
            width: 100%; height: 100px; border: 1px solid #ddd;
            border-radius: 10px; padding: 10px; margin: 15px 0;
            font-family: Arial; resize: none;
        }
        .btn-send {
            background: var(--violet-premium); color: white;
            border: none; padding: 12px 25px; border-radius: 25px;
            font-weight: bold; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <div class="app-container" id="mainFeed">
        <div class="post-card">
            <div class="user-details">
                <div class="username">Paris Models <div class="verified-badge-24"></div></div>
                <div class="description">Clique sur le "+" pour créer ton propre post ! 🚀</div>
            </div>
        </div>
    </div>

    <div class="bottom-navbar">
        <div class="nav-link">🏠<br>Accueil</div>
        <div class="publish-btn" onclick="openModal()">+</div>
        <div class="nav-link">👤<br>Profil</div>
    </div>

    <div id="postModal">
        <div class="modal-content">
            <h2 style="color: var(--violet-premium)">Créer un Post PRO</h2>
            <textarea id="postText" placeholder="Écris quelque chose de génial..."></textarea>
            <button class="btn-send" onclick="addNewPost()">Publier maintenant</button>
            <p onclick="closeModal()" style="margin-top:15px; cursor:pointer; color:gray;">Annuler</p>
        </div>
    </div>

    <script>
        const modal = document.getElementById("postModal");
        const feed = document.getElementById("mainFeed");

        function openModal() {
            modal.style.display = "flex";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        function addNewPost() {
            const text = document.getElementById("postText").value;
            if (text.trim() === "") return alert("Écris un message !");

            // Création du nouveau post
            const newPost = document.createElement("div");
            newPost.className = "post-card";
            newPost.style.background = "linear-gradient(180deg, #4a148c 0%, #000000 100%)";
            
            newPost.innerHTML = `
                <div class="user-details">
                    <div class="username">Moi (Premium) <div class="verified-badge-24"></div></div>
                    <div class="description">${text}</div>
                </div>
            `;

            // Ajouter le post au début du fil
            feed.prepend(newPost);
            
            // Fermer et vider le formulaire
            document.getElementById("postText").value = "";
            closeModal();
            
            // Scroller vers le nouveau post
            newPost.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
