<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅ - Privé</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Écran d'inscription sécurisé */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .logo-te { font-size: 3rem; font-weight: bold; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .auth-card { background: #111; padding: 30px; border-radius: 20px; border: 1px solid #222; width: 300px; }
        .auth-input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        .btn-join { background: var(--grad); border: none; padding: 14px; width: 100%; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; }

        /* Interface Chat */
        #app-interface { display: none; flex-direction: column; height: 100vh; }
        header { padding: 15px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .verified-badge { color: var(--cyan); margin-left: 5px; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg-text { background: #1a1a1a; padding: 12px 16px; border-radius: 18px; max-width: 80%; line-height: 1.4; }
        .my-msg { align-self: flex-end; background: var(--grad) !important; border-radius: 18px 18px 2px 18px !important; }
        
        #input-area { padding: 15px; border-top: 1px solid #222; display: flex; gap: 10px; }
        #message-input { flex: 1; background: #1a1a1a; border: none; padding: 12px; border-radius: 25px; color: white; outline: none; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="logo-te">Threndly</div>
    <div class="auth-card">
        <p style="margin-top:0">Connexion sécurisée ✅</p>
        <input type="text" id="user-id" class="auth-input" placeholder="Email ou Numéro">
        <input type="password" id="user-pin" class="auth-input" placeholder="Code PIN (ex: 1234)">
        <button class="btn-join" onclick="secureLogin()">Entrer sur Threndly</button>
        <p id="error-msg" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px; display: none;">Code PIN incorrect !</p>
    </div>
</div>

<div id="app-interface">
    <header>
        <div style="font-weight:bold">Threndly <i class="fas fa-check-circle verified-badge"></i></div>
        <div style="color:#00ff88; font-size:0.8rem">● Online</div>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')send()">
        <button style="background:var(--grad); border:none; color:white; width:40px; border-radius:50%" onclick="send()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // LE CODE SECRET (Tu peux le changer ici)
    const SECRET_PIN = "2026"; 

    let myUser = "";

    function secureLogin() {
        const id = document.getElementById('user-id').value.trim();
        const pin = document.getElementById('user-pin').value.trim();
        const error = document.getElementById('error-msg');

        if(id && pin === SECRET_PIN) {
            myUser = id.split('@')[0]; // On prend le début de l'email comme pseudo
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-interface').style.display = 'flex';
            startChat();
        } else {
            error.style.display = 'block';
        }
    }

    function send() {
        const input = document.getElementById('message-input');
        if(input.value.trim()){
            db.ref("messages").push({
                user: myUser,
                text: input.value,
                timestamp: Date.now()
            });
            input.value = "";
        }
    }

    function startChat() {
        db.ref("messages").limitToLast(50).on("child_added", snap => {
            const data = snap.val();
            const box = document.getElementById('chat-box');
            const isMe = data.user === myUser;
            
            const div = document.createElement('div');
            div.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
            div.innerHTML = `
                <div style="font-size:0.7rem; margin-bottom:2px; color:#666">${data.user} ✅</div>
                <div class="msg-text ${isMe ? 'my-msg' : ''}">${data.text}</div>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    }
</script>
</body>
</html>
