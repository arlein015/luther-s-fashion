<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Threndly - Sécurisé</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --blue: #2D9CDB; 
            --purple: #BB6BD9; 
            --black: #000000;
            --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); 
        }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--black); color: white; height: 100vh; overflow: hidden; display: flex; }

        /* --- ÉCRANS AUTHENTIFICATION --- */
        .overlay { position: fixed; inset: 0; background: var(--black); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .card { background: #111; width: 100%; max-width: 420px; padding: 30px; border-radius: 28px; border: 1px solid #222; text-align: center; }
        .logo { width: 140px; margin-bottom: 20px; }
        
        .input-group { text-align: left; margin-bottom: 12px; }
        label { font-size: 0.7rem; color: #666; font-weight: bold; margin-left: 5px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; margin-top: 5px; }
        input:focus { border-color: var(--blue); }

        .btn { width: 100%; padding: 16px; background: var(--grad); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .link { color: var(--blue); font-size: 0.85rem; cursor: pointer; margin-top: 15px; display: inline-block; }

        /* --- ZONE DE CHAT --- */
        #sidebar { width: 80px; background: #080808; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 25px; }
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        header { padding: 15px 20px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 12px; font-weight: bold; }
        #msg-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 12px 16px; border-radius: 20px; max-width: 75%; }
        .me { align-self: flex-end; background: var(--grad); }
        .other { align-self: flex-start; background: #222; }
        footer { padding: 15px; display: flex; gap: 10px; background: #050505; border-top: 1px solid #1a1a1a; }
    </style>
</head>
<body>

    <div id="signup-screen" class="overlay" style="display: flex;">
        <div class="card">
            <img src="logo.png" class="logo">
            <h2 style="margin-bottom: 20px;">Créer un compte</h2>
            
            <div class="input-group">
                <label>E-MAIL OU NUMÉRO</label>
                <input type="text" id="reg-contact" placeholder="vous@exemple.com ou 06...">
            </div>
            <div class="input-group">
                <label>NOM D'UTILISATEUR (USERNAME)</label>
                <input type="text" id="reg-user" placeholder="@identifiant">
            </div>
            <div class="input-group">
                <label>NOM SUR LE PROFIL</label>
                <input type="text" id="reg-name" placeholder="Votre nom public">
            </div>
            <div class="input-group">
                <label>MOT DE PASSE</label>
                <input type="password" id="reg-pass" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label>CONFIRMER LE MOT DE PASSE</label>
                <input type="password" id="reg-conf" placeholder="••••••••">
            </div>

            <button class="btn" onclick="sendValidation()">S'inscrire</button>
            <div class="link" onclick="alert('Indisponible')">Déjà un compte ? Se connecter</div>
        </div>
    </div>

    <div id="verify-screen" class="overlay">
        <div class="card">
            <i class="fas fa-shield-alt" style="font-size: 3rem; color: var(--purple); margin-bottom: 15px;"></i>
            <h2>Vérification</h2>
            <p style="color: #888; font-size: 0.9rem;">Entrez le code à 6 chiffres envoyé à votre adresse.</p>
            <input type="text" id="v-code" maxlength="6" style="text-align: center; font-size: 2rem; letter-spacing: 10px; margin: 20px 0;" placeholder="000000">
            <button class="btn" onclick="verifyCode()">Valider le compte</button>
            <div class="link" onclick="location.reload()">Retour</div>
        </div>
    </div>

    <div id="chat-screen" style="display: none; width: 100%;">
        <div id="sidebar">
            <img src="logo.png" style="width:40px; margin-bottom:25px;">
            <div style="color:var(--blue); font-size:1.8rem; cursor:pointer;" onclick="openFriends()"><i class="fas fa-plus-circle"></i></div>
        </div>
        <div id="chat-main">
            <header>
                <div id="h-img" style="width:35px; height:35px; border-radius:50%; background:#222;"></div>
                <span id="h-name">Threndly Chat</span>
            </header>
            <div id="msg-list"></div>
            <footer>
                <input type="text" id="m-in" placeholder="Message privé..." style="flex:1;">
                <button onclick="sendMsg()" class="btn" style="width:50px; border-radius:50%; margin:0;"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userData = {};
        const fakeCode = "123456"; // Pour le test, le code est 123456

        // 1. Envoyer la validation
        function sendValidation() {
            const contact = document.getElementById('reg-contact').value;
            const user = document.getElementById('reg-user').value.trim().toLowerCase();
            const pass = document.getElementById('reg-pass').value;
            const conf = document.getElementById('reg-conf').value;

            if(!contact || !user || pass !== conf) return alert("Vérifiez vos informations !");
            
            userData = { contact, user, name: document.getElementById('reg-name').value, pass };
            
            // On cache l'inscription et on montre le code
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('verify-screen').style.display = 'flex';
            
            console.log("Code envoyé à : " + contact + " (Code de test : 123456)");
        }

        // 2. Vérifier le code 6 chiffres
        function verifyCode() {
            const code = document.getElementById('v-code').value;
            if(code === fakeCode) {
                // Sauvegarde Firebase
                db.ref("profiles/" + userData.user).set({
                    name: userData.name,
                    contact: userData.contact,
                    img: "https://i.pravatar.cc/150?u=" + userData.user
                });
                localStorage.setItem('threndly_id', userData.user);
                
                // Direction le chat
                document.getElementById('verify-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                alert("Compte validé ! Bienvenue sur Threndly.");
            } else {
                alert("Code incorrect !");
            }
        }

        // --- Fonctions Chat ---
        function sendMsg() {
            const inp = document.getElementById('m-in');
            const myID = localStorage.getItem('threndly_id');
            if(inp.value.trim()) {
                db.ref("messages/general").push({ from: myID, text: inp.value });
                inp.value = "";
            }
        }
        
        // Auto-connexion
        if(localStorage.getItem('threndly_id')) {
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
