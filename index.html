<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* DESIGN EXACT */
        :root { --cyan: #00d2ff; --bg: #000; --sidebar: #0a0a0a; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar Style */
        #sidebar { width: 350px; background: var(--bg); border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-size: 1.5rem; font-weight: bold; color: #4facfe; display: flex; align-items: center; gap: 8px; }
        .logo-text span { background: #9b51e0; width: 15px; height: 15px; border-radius: 4px; } /* Petit carré violet */

        .search-container { padding: 0 15px 15px; }
        .search-bar { width: 100%; background: #1a1a1a; border: none; padding: 12px; border-radius: 10px; color: white; outline: none; }

        /* Liste d'amis */
        #friends-list { flex: 1; overflow-y: auto; }
        .friend-item { padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .friend-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid #333; }
        .friend-name { font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .friend-last { font-size: 0.85rem; color: #888; margin-top: 2px; }
        .badge-verified { color: var(--cyan); font-size: 0.8rem; }

        /* Section Suggestions */
        .section-title { padding: 15px; font-size: 0.7rem; color: #444; text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid #111; }
        .add-btn { background: var(--grad); border: none; color: white; padding: 6px 12px; border-radius: 15px; font-size: 0.7rem; font-weight: bold; cursor: pointer; margin-left: auto; }

        /* Chat */
        #main-chat { flex: 1; display: none; flex-direction: column; background: var(--bg); }
        header { padding: 15px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 60%; font-size: 0.95rem; }
        .my-msg { align-self: flex-end; background: var(--grad); color: white; border-bottom-right-radius: 2px; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 2px; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; }

        /* Input */
        #input-area { padding: 20px; display: flex; align-items: center; gap: 15px; }
        .input-container { flex: 1; background: #1a1a1a; border-radius: 12px; display: flex; align-items: center; padding: 0 15px; }
        #message-input { flex: 1; background: transparent; border: none; padding: 12px 0; color: white; outline: none; }
        .send-btn { background: var(--grad); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; }

        /* Login */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: #0a0a0a; padding: 30px; border-radius: 20px; width: 300px; text-align: center; border: 1px solid #1a1a1a; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="login-card">
        <h2 style="color:var(--cyan); margin-bottom:20px;">Threndly ✅</h2>
        <input type="text" id="user-id" placeholder="Ton nom" style="width:100%; padding:12px; margin-bottom:15px; background:#1a1a1a; border:none; color:white; border-radius:8px;">
        <button onclick="handleAuth()" style="width:100%; padding:12px; background:var(--grad); border:none; color:white; border-radius:8px; font-weight:bold; cursor:pointer;">Entrer ✅</button>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <div class="logo-text">Threndly <span></span></div>
        <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#444; cursor:pointer;"></i>
    </div>
    <div class="search-container">
        <input type="text" class="search-bar" placeholder="Rechercher ou démarrer...">
    </div>
    <div id="friends-list"></div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-arrow-left" onclick="closeChat()" style="cursor:pointer; color:#888;"></i>
            <img id="chat-avatar" src="" style="width:35px; height:35px; border-radius:50%;">
            <div id="chat-name" style="font-weight:bold;"></div>
        </div>
        <div style="display:flex; gap:20px; color:#888;">
            <i class="fas fa-phone"></i>
            <i class="fas fa-video"></i>
        </div>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <label for="img-input"><i class="far fa-image" style="color:#888; font-size:1.2rem; cursor:pointer;"></i></label>
        <input type="file" id="img-input" hidden accept="image/*" onchange="sendPhoto(this)">
        <div class="input-container">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        <button class="send-btn" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myUser = localStorage.getItem('threndly_user') || "";
    let activeChat = "";

    if(myUser) login(myUser);

    function handleAuth() {
        const name = document.getElementById('user-id').value.trim();
        if(name) login(name);
    }

    function login(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        db.ref("users/" + name).update({ username: name, lastSeen: Date.now() });
        loadInterface();
    }

    function loadInterface() {
        const list = document.getElementById('friends-list');
        
        // 1. TES AMIS (DESIGN IMAGE_292EA0)
        const staticFriends = [
            { name: "Joselyna", last: "zahay zaza jiajy...", img: "https://i.pravatar.cc/150?u=jos" },
            { name: "Nelly", last: "okay havy agny z...", img: "https://i.pravatar.cc/150?u=nel" },
            { name: "Arthur💸", last: "on peut parler sur...", img: "https://i.pravatar.cc/150?u=art" },
            { name: "Lebien", last: "📷 4 photos", img: "https://i.pravatar.cc/150?u=leb" }
        ];

        list.innerHTML = "";
        staticFriends.forEach(f => addFriendUI(f.name, f.last, f.img, false));

        // 2. SUGGESTIONS DES GENS SUR FIREBASE
        const title = document.createElement('div');
        title.className = "section-title";
        title.innerText = "Suggestions d'amis";
        list.appendChild(title);

        db.ref("users").on("value", snap => {
            snap.forEach(u => {
                const user = u.val();
                const isExisting = staticFriends.some(f => f.name === user.username);
                if(user.username !== myUser && !isExisting) {
                    addFriendUI(user.username, "Nouveau sur Threndly", `https://i.pravatar.cc/150?u=${user.username}`, true);
                }
            });
        });
    }

    function addFriendUI(name, last, img, isSug) {
        const list = document.getElementById('friends-list');
        const div = document.createElement('div');
        div.className = 'friend-item';
        div.innerHTML = `
            <img src="${img}" class="friend-avatar">
            <div class="friend-info">
                <div class="friend-name">${name} <i class="fas fa-check-circle badge-verified"></i></div>
                <div class="friend-last">${last}</div>
            </div>
            ${isSug ? `<button class="add-btn" onclick="addFriend(event, '${name}')">Ajouter +</button>` : ''}
        `;
        div.onclick = () => { if(!isSug) openChat(name, img); };
        list.appendChild(div);
    }

    function addFriend(e, name) {
        e.stopPropagation();
        alert(name + " ajouté ! ✅");
    }

    function openChat(name, img) {
        activeChat = name;
        document.getElementById('main-chat').style.display = 'flex';
        document.getElementById('chat-name').innerText = name;
        document.getElementById('chat-avatar').src = img;
        loadMessages();
    }

    function closeChat() { document.getElementById('main-chat').style.display = 'none'; }

    function sendMsg() {
        const text = document.getElementById('message-input').value;
        if(text && activeChat) {
            const id = myUser < activeChat ? myUser+"_"+activeChat : activeChat+"_"+myUser;
            db.ref("msgs/" + id).push({ from: myUser, text: text, type: 'text' });
            document.getElementById('message-input').value = "";
        }
    }

    function loadMessages() {
        const box = document.getElementById('chat-box');
        const id = myUser < activeChat ? myUser+"_"+activeChat : activeChat+"_"+myUser;
        db.ref("msgs/" + id).off();
        box.innerHTML = "";
        db.ref("msgs/" + id).on("child_added", snap => {
            const m = snap.val();
            const div = document.createElement('div');
            div.className = `msg ${m.from === myUser ? 'my-msg' : 'other-msg'}`;
            div.innerHTML = m.type === 'image' ? `<img src="${m.text}">` : m.text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    }

    function sendPhoto(input) {
        const reader = new FileReader();
        reader.onload = e => {
            const id = myUser < activeChat ? myUser+"_"+activeChat : activeChat+"_"+myUser;
            db.ref("msgs/" + id).push({ from: myUser, text: e.target.result, type: 'image' });
        };
        reader.readAsDataURL(input.files[0]);
    }

    function logout() { localStorage.removeItem('threndly_user'); location.reload(); }
</script>
</body>
</html>
