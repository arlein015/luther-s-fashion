<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendly - Messages</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f2f3f7;
      color: #333;
    }
    header {
      background: #fff;
      padding: 15px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }
    /* Stories en haut */
    .stories {
      display: flex;
      overflow-x: auto;
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    .story {
      flex: 0 0 auto;
      margin-right: 15px;
      text-align: center;
      font-size: 12px;
    }
    .story img {
      width: 65px; height: 65px;
      border-radius: 50%;
      border: 3px solid #4a90e2;
      margin-bottom: 5px;
    }
    /* Notifications */
    .notifications {
      background: #fff;
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }
    .notifications div {
      margin-bottom: 8px;
    }
    .notifications strong {
      color: #4a90e2;
    }
    /* Conversations */
    .conversation-list {
      background: #fff;
      margin-top: 10px;
    }
    .conversation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }
    .conversation:hover {
      background: #f9f9f9;
    }
    .conversation-info {
      display: flex;
      flex-direction: column;
    }
    .conversation strong {
      font-size: 15px;
    }
    .conversation span {
      font-size: 13px;
      color: #666;
    }
    .conversation-time {
      font-size: 12px;
      color: #999;
    }
    /* Barre de navigation */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    footer div {
      text-align: center;
      font-size: 13px;
      color: #4a90e2;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>Messages</header>

  <!-- Stories -->
  <div class="stories">
    <div class="story">
      <img src="avatar1.png" alt="Murah">
      <div>Murah</div>
    </div>
    <div class="story">
      <img src="avatar2.png" alt="Norah">
      <div>Norah</div>
    </div>
    <div class="story">
      <img src="avatar3.png" alt="Aina">
      <div>Aina</div>
    </div>
    <div class="story">
      <img src="avatar4.png" alt="Wichouu">
      <div>Wichouu</div>
    </div>
  </div>

  <!-- Notifications -->
  <div class="notifications">
    <div><strong>Nouveaux followers :</strong> Hardy Jurcia a commencé à te suivre (10)</div>
    <div><strong>Activité :</strong> Clau🦋 a répondu à ton commentaire (21)</div>
    <div><strong>Demandes de messages :</strong> Tu as reçu 4 demandes</div>
  </div>

  <!-- Conversations -->
  <div class="conversation-list" id="conversations"></div>

  <!-- Navigation -->
  <footer>
    <div>🏠 Accueil</div>
    <div>👥 Ami(e)s</div>
    <div>➕</div>
    <div>💬 Messages</div>
    <div>👤 Profil</div>
  </footer>

  <script>
    const conversations = [
      { name: "Murah Camayo 🍭", last: "Salut !", time: "59 min" },
      { name: "Espérée", last: "À demain", time: "1 j" },
      { name: "Haëckel", last: "Ok merci", time: "6 j" },
      { name: "Gladys", last: "Demande acceptée", time: "6 j" }
    ];

    const convContainer = document.getElementById("conversations");

    conversations.forEach(conv => {
      const div = document.createElement("div");
      div.className = "conversation";
      div.innerHTML = `
        <div class="conversation-info">
          <strong>${conv.name}</strong>
          <span>${conv.last}</span>
        </div>
        <div class="conversation-time">${conv.time}</div>
      `;
      convContainer.appendChild(div);
    });
  </script>
</body>
</html>
