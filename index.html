<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - Notifications</title>
    <style>
        /* ... (Garder le style précédent) ... */
        :root {
            --violet-premium: #9c27b0;
            --violet-clair: #ce85f2;
            --rouge-fb: #f02849;
            --blanc: #ffffff;
            --rouge-notif: #ff3b30;
        }

        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; color: white; }

        /* --- STYLE DES BULLES DE NOTIFICATION --- */
        .notif-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: var(--rouge-notif);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            border: 2px solid white;
            display: none; /* Caché par défaut */
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* --- ELEMENTS EXISTANTS ADAPTÉS --- */
        .post-container { height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; background: var(--rouge-fb); position: relative; }
        .side-actions { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; }
        .action-item { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .circle { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        .footer-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: white; display: flex; justify-content: space-around; align-items: center; }
        .nav-icon { position: relative; color: #555; font-size: 11px; text-align: center; flex: 1; }
        .btn-add { background: linear-gradient(90deg, #ce85f2, #9c27b0); width: 50px; height: 32px; border-radius: 10px; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; }

        /* Fenêtre de chat (simple pour le test) */
        #chatBox { position: fixed; bottom: -100%; left: 0; width: 100%; height: 70%; background: white; border-radius: 20px 20px 0 0; z-index: 200; transition: 0.4s; color: black; }
    </style>
</head>
<body>

    <div class="post-container">
        <div style="font-size: 40px; font-weight: bold;">zah zalaah ty aiiii</div>

        <div class="side-actions">
            <div class="action-item">
                <div class="circle">❤️</div>
            </div>
            <div class="action-item" onclick="openChat()">
                <div class="circle">💬</div>
                <div class="notif-badge" id="sideNotif">1</div>
            </div>
        </div>
    </div>

    <div class="footer-nav">
        <div class="nav-icon">🏠<br>Accueil</div>
        <div class="btn-add">+</div>
        <div class="nav-icon" onclick="openChat()">
            💬<br>Messages
            <div class="notif-badge" id="bottomNotif">1</div>
        </div>
        <div class="nav-icon">👤<br>Profil</div>
    </div>

    <div id="chatBox">
        <div style="padding: 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between;">
            <b style="color: black;">Messages</b>
            <span onclick="closeChat()" style="cursor: pointer; color: black;">✕</span>
        </div>
        <div style="padding: 20px; color: black;">
            <p><b>Ami :</b> Alors, ce badge 24 pointes ? 🚀</p>
        </div>
    </div>

    <script>
        // Fonction pour ouvrir le chat et effacer les notifs
        function openChat() {
            document.getElementById('chatBox').style.bottom = "0";
            // On cache les bulles quand on lit les messages
            document.getElementById('sideNotif').style.display = "none";
            document.getElementById('bottomNotif').style.display = "none";
        }

        function closeChat() {
            document.getElementById('chatBox').style.bottom = "-100%";
        }

        // Simulation d'une notification qui arrive après 3 secondes
        setTimeout(() => {
            const sideNotif = document.getElementById('sideNotif');
            const bottomNotif = document.getElementById('bottomNotif');
            
            sideNotif.innerText = "1";
            bottomNotif.innerText = "1";
            
            sideNotif.style.display = "block";
            bottomNotif.style.display = "block";
            
            // Petit son de notification (optionnel)
            console.log("Nouvelle notification reçue !");
        }, 3000);
    </script>
</body>
</html>
