<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Threndly - Réseau Officiel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-messaging.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f7f9f9; margin: 0; padding-bottom: 80px; }
        
        /* Barre de navigation */
        .navbar { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); padding: 10px 20px; border-bottom: 1px solid #eff3f4; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { color: #1d9bf0; font-weight: 900; font-size: 24px; letter-spacing: -1px; }
        .btn-profil { background: #000; color: white; border: none; padding: 8px 16px; border-radius: 99px; font-weight: bold; cursor: pointer; font-size: 14px; }

        /* Flux de messages */
        #flux { max-width: 600px; margin: auto; }
        .tweet { background: white; border-bottom: 1px solid #eff3f4; padding: 15px; display: flex; flex-direction: column; }
        .username { font-weight: bold; color: #0f1419; display: flex; align-items: center; }
        .badge { color: #1d9bf0; margin-left: 4px; font-size: 16px; }
        .content { margin-top: 5px; color: #0f1419; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
        
        /* Message Système (Notification) */
        .system-msg { background: #fff3cd !important; border-left: 4px solid #ffcc00; }

        /* Modal Profil */
        #modal-profil { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 350px; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 20px; }
        input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #cfd9de; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn-save { background: #1d9bf0; color: white; width: 100%; padding: 12px; border-radius: 99px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">Threndly</div>
        <button class="btn-profil" onclick="ouvrirProfil()">👤 Profil</button>
    </div>

    <div id="modal-profil" style="display:none;">
        <div class="modal-content">
            <h2>Bienvenue sur Threndly</h2>
            <p>Ton compte va recevoir le badge ✅</p>
            <input type="text" id="usernameInput" placeholder="Ton nom d'utilisateur...">
            <button class="btn-save" onclick="sauvegarderProfil()">Activer mon badge ✅</button>
        </div>
    </div>

    <div id="flux">
        </div>

    <script>
        // Ta configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDimaKVWWObrRRR83OjVBJJbFtsNjXphXI",
            projectId: "trendly-fca7c",
            appId: "1:305193026365:web:86699f8f4115b9c6f2a74c",
            messagingSenderId: "305193026365"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const messaging = firebase.messaging();

        let monNom = localStorage.getItem('threndly_name');

        // Gestion du Profil
        if (!monNom) {
            document.getElementById('modal-profil').style.display = 'flex';
        }

        function ouvrirProfil() {
            document.getElementById('modal-profil').style.display = 'flex';
            if(monNom) document.getElementById('usernameInput').value = monNom;
        }

        function sauvegarderProfil() {
            const nom = document.getElementById('usernameInput').value.trim();
            if (nom.length >= 2) {
                localStorage.setItem('threndly_name', nom);
                monNom = nom;
                document.getElementById('modal-profil').style.display = 'none';
                
                // Demande de notification lors du clic sur le bouton
                demanderPermissionNotifs();
            }
        }

        function demanderPermissionNotifs() {
            messaging.requestPermission()
                .then(() => messaging.getToken())
                .then((token) => {
                    console.log("Token généré, notifications actives !");
                    // On abonne l'utilisateur au sujet "all" pour recevoir les messages du Sheets
                    messaging.subscribeToTopic('all'); 
                })
                .catch((err) => console.log("L'utilisateur a refusé ou erreur Safari."));
        }

        // Lecture des messages en temps réel
        db.collection("messages").orderBy("timestamp", "desc").limit(20).onSnapshot((snap) => {
            const flux = document.getElementById('flux');
            flux.innerHTML = "";
            snap.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement('div');
                
                if (data.sender === "SYSTÈME") {
                    div.className = "tweet system-msg";
                    div.innerHTML = `<div class="content">📢 <b>INFO :</b> ${data.content}</div>`;
                } else {
                    div.className = "tweet";
                    div.innerHTML = `
                        <div class="username">${data.sender} <span class="badge">✅</span></div>
                        <div class="content">${data.content}</div>
                    `;
                }
                flux.appendChild(div);
            });
        });

        // Enregistrement du Service Worker pour les notifications en arrière-plan
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then((reg) => {
                messaging.useServiceWorker(reg);
            });
        }
    </script>
</body>
</html>
