<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther's Fashion - Officiel</title>
    <style>
        :root {
            --violet-p: #9c27b0;
            --violet-c: #ce85f2;
            --bg-dark: #1a0121;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg-dark); 
            font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden;
        }

        /* --- INTERFACE PRINCIPALE --- */
        .main-container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .profile-name { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        
        /* Badge de vérification violet */
        .badge { width: 16px; height: 16px; background: var(--violet-p); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); display: inline-block; }

        /* --- MODAL REJOINRE (VIOLET & BLANC) --- */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-card { background: white; color: black; width: 90%; max-width: 400px; padding: 30px; border-radius: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-card h2 { margin-bottom: 25px; font-size: 22px; }

        /* Boutons de connexion avec vrais logos */
        .login-btn { 
            display: flex; align-items: center; padding: 12px 20px; margin: 12px 0; 
            border: 1px solid #ddd; border-radius: 12px; cursor: pointer; 
            font-weight: 600; transition: 0.2s; position: relative;
        }
        .login-btn:active { transform: scale(0.98); }
        .login-btn img { width: 22px; height: 22px; position: absolute; left: 20px; }
        .login-btn span { width: 100%; text-align: center; }

        /* Styles spécifiques aux boutons */
        .btn-google { background: #f5f5f5; color: black; }
        .btn-apple { background: black; color: white; border: none; }
        .btn-facebook { background: #1877F2; color: white; border: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 style="font-size: 40px; text-shadow: 0 0 20px var(--violet-c);">Luther's Fashion</h1>
        <div class="profile-name">
            <span id="userName">Luther</span> <div class="badge"></div>
        </div>
        <p style="opacity: 0.7;">Bientôt disponible...</p>
    </div>

    <div id="authModal" class="overlay">
        <div class="modal-card">
            <h2>Rejoindre Luther's</h2>

            <div class="login-btn btn-google" onclick="successAuth('Google')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Logo.svg" alt="Google">
                <span>Continuer avec Google</span>
            </div>

            <div class="login-btn btn-apple" onclick="successAuth('Apple')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" style="filter: invert(1);" alt="Apple">
                <span>Continuer avec Apple</span>
            </div>

            <div class="login-btn btn-facebook" onclick="successAuth('Facebook')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_2023.svg" style="filter: brightness(0) invert(1);" alt="Facebook">
                <span>Continuer avec Facebook</span>
            </div>

            <p style="margin-top: 20px; color: #888; cursor: pointer;" onclick="document.getElementById('authModal').style.display='none'">Fermer</p>
        </div>
    </div>

    <script>
        // Ta fonction de liaison avec ton URL officielle
        function successAuth(plateforme) {
            const scriptURL = "https://script.google.com/macros/s/AKfycbzmWi55H7--DzkuiTHWS4Q4xmqeBq9WvkLpd0y9GIpTL3osmmL4zpACStbOCOwYgw0Q/exec";
            const nomUser = document.getElementById('userName').innerText;

            const data = {
                methode: plateforme,
                nom: nomUser
            };

            // Envoi des données vers Google Sheets
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', 
                body: JSON.stringify(data)
            })
            .then(() => {
                alert("Félicitations " + nomUser + " ! Ton inscription via " + plateforme + " a été envoyée à Luther.");
                document.getElementById('authModal').style.display = 'none';
            })
            .catch(error => {
                console.error('Erreur :', error);
                alert("Erreur technique. Vérifie ta connexion.");
            });
        }
    </script>
</body>
</html>
