<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅ - Premium</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --trendly-blue: #00B2FF; 
            --bg-dark: #0F0F0F;
            --gradient: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%);
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-dark); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Badge Certifié Threndly */
        .verified-badge { color: #00d2ff; font-size: 0.9em; margin-left: 4px; vertical-align: middle; }

        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .logo-text { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; }

        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Style des messages inspiré de ton image */
        .msg-block { display: flex; flex-direction: column; gap: 2px; }
        .user-name { font-weight: bold; font-size: 1rem; color: #fff; display: flex; align-items: center; }
        .msg-text { font-size: 0.95rem; color: #efefef; opacity: 0.9; margin-top: 2px; }

        #input-area { padding: 15px; background: #000; display: flex; gap: 10px; align-items: center; border-top: 1px solid #222; }
        input { flex: 1; background: #1A1A1A; border: none; padding: 12px 18px; border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--gradient); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo-text">@ threndly <i class="fas fa-check-circle verified-badge"></i></div>
    <div style="display:flex; gap:20px;"><i class="fas fa-phone"></i><i class="fas fa-video"></i></div>
</header>

<div id="chat-container">
    <div class="msg-block">
        <span class="user-name">@ bouta <i class="fas fa-check-circle verified-badge"></i></span>
        <span class="msg-text">Découvrez la collection ! #Style #Mode #Premium</span>
    </div>
</div>

<div id="input-area">
    <i class="fas fa-plus" style="color:#888"></i>
    <input type="text" id="msg-input" placeholder="Ajouter un message...">
    <button onclick="sendMsg()" class="send-btn"><i class="fas fa-arrow-up"></i></button>
</div>

<script>
    // CONFIGURATION FIREBASE (Remplis avec tes infos)
    const firebaseConfig = {
        apiKey: "TON_API_KEY",
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = prompt("Ton pseudo ?") || "Anonyme";

    function sendMsg() {
        const text = document.getElementById('msg-input').value;
        if(text.trim()){
            db.ref("messages").push({
                user: myName,
                text: text,
                timestamp: Date.now()
            });
            document.getElementById('msg-input').value = "";
        }
    }

    db.ref("messages").on("child_added", snap => {
        const m = snap.val();
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = "msg-block";
        
        // On ajoute le badge bleu à chaque message
        div.innerHTML = `
            <span class="user-name">@ ${m.user} <i class="fas fa-check-circle verified-badge"></i></span>
            <span class="msg-text">${m.text}</span>
        `;
        
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    });
</script>

</body>
</html>
