<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - TikTok Center Text</title>
    <style>
        :root {
            --violet-premium: #9c27b0;
            --violet-clair: #ce85f2;
            --fond-sombre: #010101;
            --blanc: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--fond-sombre);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden; color: var(--blanc);
        }

        .app-container {
            height: 100vh; scroll-snap-type: y mandatory;
            overflow-y: scroll; scroll-behavior: smooth;
        }

        /* POST PLEIN ÉCRAN */
        .post-card {
            height: 100vh; width: 100%; scroll-snap-align: start;
            position: relative; display: flex; align-items: center; justify-content: center;
        }

        /* TEXTE GRAND AU CENTRE */
        .center-content {
            font-size: 32px; font-weight: bold; text-align: center;
            max-width: 80%; line-height: 1.2; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* BARRE D'INTERACTIONS À DROITE */
        .side-actions {
            position: absolute; right: 15px; bottom: 120px;
            display: flex; flex-direction: column; gap: 20px; align-items: center;
        }
        .action-item { text-align: center; cursor: pointer; }
        .action-icon {
            width: 45px; height: 45px; background: rgba(255,255,255,0.2);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin-bottom: 5px; transition: transform 0.1s;
        }
        .action-item span { font-size: 12px; font-weight: bold; }

        /* INFOS UTILISATEUR EN BAS */
        .user-info { position: absolute; bottom: 80px; left: 15px; }
        .username { font-weight: bold; font-size: 18px; display: flex; align-items: center; }

        /* BADGE 24 POINTES "BIEN ROND" */
        .verified-badge-24 {
            width: 20px; height: 20px; position: relative; display: inline-flex;
            align-items: center; justify-content: center; margin-left: 6px;
        }
        .verified-badge-24::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--violet-clair), var(--violet-premium));
            clip-path: polygon(50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%);
            border-radius: 50%;
        }
        .verified-badge-24::after {
            content: ''; position: absolute; width: 5px; height: 9px;
            border: solid white; border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg); margin-top: -1.5px;
        }

        /* BARRE DE NAVIGATION BLANCHE */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 60px;
            background: white; display: flex; justify-content: space-around; align-items: center;
        }
        .nav-icon { color: black; font-size: 11px; text-align: center; flex: 1; cursor: pointer; }
        .btn-plus {
            background: linear-gradient(90deg, #ce85f2, #9c27b0);
            width: 45px; height: 30px; border-radius: 8px; color: white;
            display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="post-card" style="background-color: #f02849;">
            
            <div class="center-content">zah zalaah ty aiiii</div>

            <div class="side-actions">
                <div class="action-item" onclick="this.style.color='#ff3b5c'"><div class="action-icon">❤️</div><span>12.4K</span></div>
                <div class="action-item"><div class="action-icon">💬</div><span>856</span></div>
                <div class="action-item"><div class="action-icon">🔗</div><span>Partager</span></div>
            </div>

            <div class="user-info">
                <div class="username">Moi (Premium) <div class="verified-badge-24"></div></div>
                <div style="font-size: 14px; opacity: 0.9;">Statut actuel : Verifed Emojis ✨</div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-icon">🏠<br>Accueil</div>
        <div class="btn-plus">+</div>
        <div class="nav-icon">👤<br>Profil</div>
    </div>

</body>
</html>
