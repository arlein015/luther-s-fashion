<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendly - Messages</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f9f9f9;
    }
    header {
      background: #fff;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
    .stories {
      display: flex;
      overflow-x: auto;
      padding: 10px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    .story {
      flex: 0 0 auto;
      margin-right: 10px;
      text-align: center;
    }
    .story img {
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 2px solid #4a90e2;
    }
    .notifications {
      background: #fff;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    .notifications div {
      margin-bottom: 8px;
      font-size: 14px;
    }
    .conversation-list {
      background: #fff;
      padding: 10px;
    }
    .conversation {
      padding: 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .conversation strong {
      display: block;
      font-size: 15px;
    }
    .conversation span {
      font-size: 13px;
      color: #555;
    }
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    footer div {
      text-align: center;
      font-size: 12px;
      color: #333;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Messages</h1>
  </header>

  <!-- Stories en haut -->
  <div class="stories">
    <div class="story">
      <img src="avatar1.png" alt="Murah">
      <div>Murah</div>
    </div>
    <div class="story">
      <img src="avatar2.png" alt="Norah">
      <div>Norah</div>
    </div>
    <div class="story">
      <img src="avatar3.png" alt="Aina">
      <div>Aina</div>
    </div>
    <div class="story">
      <img src="avatar4.png" alt="Wichouu">
      <div>Wichouu</div>
    </div>
  </div>

  <!-- Notifications -->
  <div class="notifications">
    <div><strong>Nouveaux followers :</strong> Hardy Jurcia a commencé à te suivre (10)</div>
    <div><strong>Activité :</strong> Clau🦋 a répondu à ton commentaire (21)</div>
    <div><strong>Demandes de messages :</strong> Tu as reçu 4 demandes</div>
  </div>

  <!-- Conversations -->
  <div class="conversation-list" id="conversations"></div>

  <!-- Barre de navigation en bas -->
  <footer>
    <div>Accueil</div>
    <div>Ami(e)s</div>
    <div>+</div>
    <div>Messages</div>
    <div>Profil</div>
  </footer>

  <script>
    const conversations = [
      { name: "Murah Camayo 🍭", last: "Salut !", time: "59 min" },
      { name: "Espérée", last: "À demain", time: "1 j" },
      { name: "Haëckel", last: "Ok merci", time: "6 j" },
      { name: "Gladys", last: "Demande acceptée", time: "6 j" }
    ];

    const convContainer = document.getElementById("conversations");

    conversations.forEach(conv => {
      const div = document.createElement("div");
      div.className = "conversation";
      div.innerHTML = `<strong>${conv.name}</strong><span>${conv.last} • ${conv.time}</span>`;
      convContainer.appendChild(div);
    });
  </script>
</body>
</html>
