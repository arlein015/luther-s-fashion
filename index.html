<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #FF0000; --bg: #ffffff; --glass: rgba(255, 255, 255, 0.8); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: #000; }

        /* --- HEADER DESIGN --- */
        header { padding: 15px; background: var(--glass); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo { font-weight: 900; font-size: 24px; letter-spacing: -1.5px; text-transform: uppercase; text-decoration: none; color: #000; }
        .search-box { flex: 1; margin: 0 15px; position: relative; }
        .search-box input { width: 100%; padding: 12px 40px; border: none; background: #f0f0f0; border-radius: 50px; font-size: 13px; }
        .search-box i { position: absolute; left: 15px; top: 12px; color: #888; }

        /* --- NAV TABS --- */
        .nav-scroll { display: flex; gap: 20px; padding: 15px; overflow-x: auto; border-bottom: 1px solid #eee; scrollbar-width: none; }
        .nav-item { font-size: 12px; font-weight: 900; text-decoration: none; color: #888; text-transform: uppercase; transition: 0.3s; }
        .nav-item.active { color: #000; border-bottom: 2px solid #000; }

        /* --- FILTRES VITAMINÉS --- */
        .filter-bar { display: flex; gap: 10px; padding: 15px; overflow-x: auto; }
        .chip { padding: 10px 20px; border-radius: 50px; background: #000; color: #fff; font-size: 11px; font-weight: 700; white-space: nowrap; border: 2px solid #000; transition: 0.3s; }
        .chip.outline { background: transparent; color: #000; }

        /* --- PRODUITS ANIMÉS --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { position: relative; border-radius: 15px; overflow: hidden; background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.02); transition: 0.4s; }
        .card:hover { transform: scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        
        /* Badge Stylé */
        .badge { position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff; padding: 4px 10px; font-size: 10px; font-weight: 900; border-radius: 4px; z-index: 10; }
        
        .card-body { padding: 12px; }
        .price { font-size: 18px; font-weight: 900; color: var(--accent); margin: 5px 0; }
        .buy-btn { width: 100%; background: linear-gradient(45deg, #000, #333); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 900; font-size: 11px; cursor: pointer; }

        /* --- POSTE PREMIUM (TOUS LES 2 RANGS) --- */
        .promo-card { grid-column: 1 / -1; background: #000; color: #fff; border-radius: 20px; padding: 25px; display: flex; align-items: center; justify-content: space-between; overflow: hidden; position: relative; }
        .promo-content h3 { font-size: 20px; font-weight: 900; line-height: 1.1; margin-bottom: 10px; }
        .promo-card img { width: 120px; border-radius: 10px; transform: rotate(5deg); box-shadow: -10px 10px 30px rgba(255,255,255,0.1); }

        /* --- FOOTER --- */
        footer { background: #000; color: #fff; padding: 50px 20px; border-radius: 30px 30px 0 0; text-align: center; }
        .social { display: flex; justify-content: center; gap: 25px; margin: 30px 0; font-size: 22px; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; justify-content:space-between;">
        <a href="#" class="logo">Luther</a>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Trouve ton style...">
        </div>
        <div style="position:relative;">
            <i class="fas fa-shopping-bag" style="font-size:20px;"></i>
            <span style="position:absolute; top:-5px; right:-5px; background:red; color:white; font-size:9px; padding:2px 5px; border-radius:50%;">0</span>
        </div>
    </div>
</header>

<div class="nav-scroll">
    <a href="#" class="nav-item active">Nouveautés</a>
    <a href="#" class="nav-item">Femmes</a>
    <a href="#" class="nav-item">Hommes</a>
    <a href="#" class="nav-item sale-link">Soldes</a>
</div>

<div class="filter-bar">
    <div class="chip">✨ Pour toi</div>
    <div class="chip outline">Vestes</div>
    <div class="chip outline">Ensembles</div>
    <div class="chip outline">Accessoires</div>
</div>

<div class="grid" id="shop-grid"></div>

<footer>
    <div class="social">
        <i class="fab fa-instagram"></i><i class="fab fa-tiktok"></i><i class="fab fa-snapchat"></i>
    </div>
    <div style="font-size:10px; color:#555;">© 2026 LUTHER FASHION - DESIGNED FOR YOU</div>
</footer>

<script>
    const container = document.getElementById('shop-grid');
    
    // Génération stylée de 30 postes
    for (let i = 1; i <= 30; i++) {
        const pPrice = (Math.random() * (99 - 25) + 25).toFixed(2);
        const pImg = i % 2 === 0 ? 'Veste vert.jpg' : 'veste jaune.jpg'; //
        
        // Tous les 4 produits (soit 2 rangs), on insère un poste stylé premium
        if (i % 5 === 0) {
            container.innerHTML += `
                <div class="promo-card">
                    <div class="promo-content">
                        <span style="color:red; font-size:10px; font-weight:900;">OFFRE LIMITÉE</span>
                        <h3>LUXE STREETWEAR<br>COLLECTION #${i}</h3>
                        <button style="padding:8px 15px; border-radius:50px; border:none; font-weight:900; font-size:10px;">SHOP NOW</button>
                    </div>
                    <img src="${pImg}">
                </div>
            `;
        } else {
            container.innerHTML += `
                <div class="card">
                    <div class="badge">${i % 3 === 0 ? 'NEW' : '-20%'}</div>
                    <img src="${pImg}">
                    <div class="card-body">
                        <div style="font-size:11px; color:#666;">Luther Selection</div>
                        <div style="font-weight:700; font-size:13px; margin:2px 0;">Veste Edition #${i}</div>
                        <div class="price">${pPrice} $</div>
                        <button class="buy-btn">AJOUTER AU PANIER</button>
                    </div>
                </div>
            `;
        }
    }
</script>

</body>
</html>
