<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - Séparé</title>
    <style>
        :root {
            --violet: #9c27b0;
            --rouge: #f02849; /* */
        }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: black; color: white; }

        /* --- POST --- */
        .post-container { height: 100vh; width: 100%; position: relative; background: var(--rouge); display: flex; align-items: center; justify-content: center; }
        .main-text { font-size: 35px; font-weight: bold; text-align: center; z-index: 5; }

        /* --- ACTIONS (DROITE) --- */
        .side-actions { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .btn-action { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .icon { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; }
        .notif { position: absolute; top: -2px; right: -2px; background: red; border: 2px solid white; border-radius: 10px; font-size: 10px; padding: 2px 5px; }

        /* --- PANNEAUX (COMMENTAIRES VS MESSAGES) --- */
        .panel { position: fixed; bottom: -100%; left: 0; width: 100%; height: 60%; background: white; border-radius: 20px 20px 0 0; z-index: 1000; transition: 0.4s; color: black; display: flex; flex-direction: column; }
        .panel-header { padding: 15px; border-bottom: 1px solid #ddd; font-weight: bold; display: flex; justify-content: space-between; }
        .content-list { flex: 1; overflow-y: auto; padding: 15px; }
        .active { bottom: 0 !important; }

        /* --- NAV BASSE --- */
        .nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: white; display: flex; justify-content: space-around; align-items: center; z-index: 500; }
        .nav-item { color: #333; font-size: 11px; text-align: center; position: relative; }
        .btn-plus { background: linear-gradient(90deg, #ce85f2, var(--violet)); width: 45px; height: 30px; border-radius: 8px; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>

    <div class="post-container">
        <div class="main-text">zah zalaah ty aiiii</div>

        <div class="side-actions">
            <div class="btn-action">
                <div class="icon">❤️</div>
                <span style="font-size:12px">12K</span>
            </div>
            <div class="btn-action" onclick="openPanel('commentsPanel')">
                <div class="icon">💬</div>
                <span style="font-size:12px">45</span>
            </div>
        </div>
    </div>

    <div id="commentsPanel" class="panel">
        <div class="panel-header"><span>Commentaires</span><span onclick="closeAll()">✕</span></div>
        <div class="content-list">
            <p><b>User1:</b> Trop cool la couleur ! 🔥</p>
            <p><b>User2:</b> Zah zalaah ! ✨</p>
        </div>
    </div>

    <div id="messagesPanel" class="panel">
        <div class="panel-header"><span>Ma Messagerie Privée</span><span onclick="closeAll()">✕</span></div>
        <div class="content-list">
            <p style="color:var(--violet)"><b>Admin:</b> Bienvenue dans ton espace Premium !</p>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item">🏠<br>Accueil</div>
        <div class="btn-plus" onclick="alert('Menu Ajouter activé')">+</div>
        <div class="nav-item" onclick="openPanel('messagesPanel')">
            💬<br>Messages
            <div class="notif" id="notif">1</div>
        </div>
        <div class="nav-item">👤<br>Profil</div>
    </div>

    <script>
        function openPanel(id) {
            closeAll();
            document.getElementById(id).classList.add('active');
            if(id === 'messagesPanel') document.getElementById('notif').style.display = 'none';
        }
        function closeAll() {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        }
    </script>
</body>
</html>
