<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; }

        /* Login */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; width: 300px; text-align: center; }
        .logo-te { font-size: 2.5rem; font-weight: bold; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .auth-input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .btn-main { background: var(--grad); border: none; padding: 14px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; width: 100%; }

        /* Interface App */
        #app-interface { display: none; flex-direction: column; height: 100vh; }
        header { padding: 10px 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #000; height: 60px; }
        .partner-info { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1.1rem; }
        .header-btns { display: flex; gap: 20px; color: #888; font-size: 1.2rem; }
        .header-btns i { cursor: pointer; transition: 0.3s; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 18px; max-width: 75%; position: relative; }
        .msg img { max-width: 100%; border-radius: 12px; display: block; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }
        .my-msg { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }

        #input-area { padding: 12px 15px; background: #000; border-top: 1px solid #222; display: flex; align-items: center; gap: 12px; }
        .input-container { flex: 1; background: #1a1a1a; border-radius: 25px; display: flex; align-items: center; padding: 0 15px; }
        #message-input { flex: 1; background: transparent; border: none; padding: 12px 0; color: white; outline: none; }
        
        .icon-btn { color: #888; font-size: 1.4rem; cursor: pointer; }
        .send-btn { background: var(--grad); border: none; width: 42px; height: 42px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* UI Appel Vidéo */
        #call-screen { display:none; position:fixed; inset:0; background:black; z-index:2000; flex-direction:column; }
        #remote-video { width:100%; height:100%; object-fit: cover; }
        #local-video { position:absolute; bottom:100px; right:20px; width:100px; height:150px; border-radius:12px; border:2px solid white; object-fit: cover; }
        .call-controls { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; gap:20px; }
        .call-btn { background: #444; color:white; border:none; padding:15px; border-radius:50%; font-size:1.5rem; cursor:pointer; }
        .hangup { background: #ff4444; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="logo-te">Threndly</div>
    <div class="auth-card">
        <input type="text" id="user-id" class="auth-input" placeholder="Identifiant">
        <input type="password" id="user-pass" class="auth-input" placeholder="Mot de passe">
        <button class="btn-main" onclick="handleAuth()">Connexion ✅</button>
    </div>
</div>

<div id="app-interface">
    <header>
        <div class="partner-info" id="partner-display">Threndly <i class="fas fa-check-circle" style="color:var(--cyan)"></i></div>
        <div class="header-btns">
            <i class="fas fa-phone" onclick="startCall(false)"></i>
            <i class="fas fa-video" onclick="startCall(true)"></i>
            <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#ff4444"></i>
        </div>
    </header>

    <div id="chat-box"></div>

    <div id="input-area">
        <label for="img-input" class="icon-btn"><i class="far fa-image"></i></label>
        <input type="file" id="img-input" hidden accept="image/*" onchange="sendPhoto(this)">
        <div class="input-container">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        <button class="send-btn" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<div id="call-screen">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
    <div class="call-controls">
        <button class="call-btn" onclick="switchCam()"><i class="fas fa-sync"></i></button>
        <button class="call-btn hangup" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = { 
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", 
        projectId: "trendly-fca7c" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myUser = localStorage.getItem('threndly_user') || "";
    let currentStream;
    let useFrontCam = true;

    if(myUser) enterApp(myUser);

    function handleAuth() {
        const id = document.getElementById('user-id').value.trim();
        if(id) enterApp(id);
    }

    function enterApp(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-interface').style.display = 'flex';
        startChat();
        listenForCalls(); // On commence à écouter si quelqu'un nous appelle
    }

    // --- ENVOI DE MESSAGES & PHOTOS ---
    function sendMsg() {
        const input = document.getElementById('message-input');
        if(input.value.trim()){
            db.ref("messages").push({ user: myUser, text: input.value, type: 'text', time: Date.now() });
            input.value = "";
        }
    }

    function sendPhoto(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const maxW = 500;
                canvas.width = maxW; canvas.height = img.height * (maxW / img.width);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                db.ref("messages").push({ user: myUser, text: canvas.toDataURL('image/jpeg', 0.6), type: 'image', time: Date.now() });
            }
        };
        reader.readAsDataURL(file);
    }

    function startChat() {
        const box = document.getElementById('chat-box');
        db.ref("messages").off();
        db.ref("messages").on("child_added", snap => {
            const data = snap.val();
            const isMe = data.user === myUser;
            if(!isMe) document.getElementById('partner-display').innerHTML = `${data.user} <i class="fas fa-check-circle" style="color:var(--cyan)"></i>`;
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'my-msg' : 'other-msg'}`;
            div.innerHTML = data.type === 'image' ? `<img src="${data.text}">` : data.text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    }

    // --- LOGIQUE APPEL VIDÉO ---

    // 1. Envoyer une invitation d'appel
    async function startCall(video) {
        const callId = "call_" + Date.now();
        db.ref("calls").set({
            from: myUser,
            type: video ? "video" : "audio",
            status: "ringing"
        });
        showVideoScreen(video);
    }

    // 2. Écouter si quelqu'un nous appelle
    function listenForCalls() {
        db.ref("calls").on("value", snap => {
            const call = snap.val();
            if (call && call.from !== myUser && call.status === "ringing") {
                if (confirm(`Appel ${call.type} de ${call.from}. Accepter ?`)) {
                    db.ref("calls").update({ status: "accepted" });
                    showVideoScreen(call.type === "video");
                } else {
                    db.ref("calls").remove();
                }
            }
        });
    }

    // 3. Afficher l'écran vidéo et activer la caméra
    async function showVideoScreen(videoEnabled) {
        document.getElementById('call-screen').style.display = 'flex';
        try {
            currentStream = await navigator.mediaDevices.getUserMedia({ 
                video: videoEnabled ? { facingMode: "user" } : false, 
                audio: true 
            });
            document.getElementById('local-video').srcObject = currentStream;
            // Note: Pour un vrai "Face à Face", il faudrait PeerJS, mais ici on teste déjà la caméra locale
        } catch (e) { 
            alert("Erreur : Vérifie que tu as autorisé la caméra et que tu es en HTTPS."); 
            endCall();
        }
    }

    async function switchCam() {
        useFrontCam = !useFrontCam;
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: useFrontCam ? "user" : "environment" }, 
                audio: true 
            });
            document.getElementById('local-video').srcObject = currentStream;
        }
    }

    function endCall() {
        if(currentStream) currentStream.getTracks().forEach(t => t.stop());
        document.getElementById('call-screen').style.display = 'none';
        db.ref("calls").remove();
    }

    function logout() { localStorage.removeItem('threndly_user'); location.reload(); }
</script>
</body>
</html>
