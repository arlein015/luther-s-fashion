<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther's Fashion - Site Officiel</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --violet: #9c27b0; --tiktok-red: #ff3b5c; --bg: #000; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }

        /* --- FEED VIDEO --- */
        .video-feed { height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; padding-bottom: 110px; background: #e60023; transition: background 0.5s; }
        .user-name { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 19px; }

        /* BADGE 24 POINTES */
        .badge-24 { width: 18px; height: 18px; background: white; clip-path: polygon(50% 0%, 58% 10%, 68% 5%, 72% 16%, 83% 15%, 83% 26%, 93% 30%, 90% 41%, 98% 50%, 90% 59%, 93% 70%, 83% 74%, 83% 85%, 72% 84%, 68% 95%, 58% 90%, 50% 100%, 42% 90%, 32% 95%, 28% 84%, 17% 85%, 17% 74%, 7% 70%, 10% 59%, 2% 50%, 10% 41%, 7% 30%, 17% 26%, 17% 15%, 28% 16%, 32% 5%, 42% 10%); display: flex; align-items: center; justify-content: center; }
        .badge-24::after { content: '✔'; color: var(--violet); font-size: 10px; font-weight: bold; }

        /* --- NAVIGATION BAS --- */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: black; display: flex; justify-content: space-around; align-items: center; z-index: 1000; border-top: 0.5px solid #333; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: white; position: relative; }
        .nav-item i { font-size: 24px; }
        .nav-item span { font-size: 10px; margin-top: 4px; }
        
        /* Bouton central + */
        .btn-plus-container { background: linear-gradient(to right, #20d5ec 15%, #ff2d55 85%); padding: 5px 18px; border-radius: 12px; color: black; font-size: 22px; font-weight: bold; }

        .notif-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid black; }

        /* --- FENÊTRES MODALES --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 5000; }
        .modal-content { background: white; color: black; width: 85%; max-width: 350px; padding: 30px; border-radius: 20px; text-align: center; }
        .option { padding: 15px; border: 1px solid #ddd; border-radius: 10px; margin: 10px 0; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div class="video-feed" id="mainFeed">
        <div class="user-info">
            <div class="user-name">@<span id="displayUser">Luther</span> <div class="badge-24"></div></div>
            <p id="postDesc">Découvrez la collection Luther's Fashion 2026 ! 🚀</p>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="goHome()">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="goViral()">
            <i class="fas fa-bolt" style="color: #ffeb3b;"></i>
            <span>Viral</span>
        </div>
        <div class="nav-item" onclick="openModal('modalPost')">
            <div class="btn-plus-container">+</div>
        </div>
        <div class="nav-item" onclick="openMessages()">
            <i class="fas fa-envelope"></i>
            <div class="notif-badge" id="badgeMsg">1</div>
            <span>Messages</span>
        </div>
        <div class="nav-item" onclick="openModal('modalLogin')">
            <i class="fas fa-user" id="userIcon"></i>
            <img id="userImg" src="" style="width:28px; height:28px; border-radius:50%; display:none; border:1.5px solid white;">
            <span>Profil</span>
        </div>
    </div>

    <div id="modalPost" class="modal">
        <div class="modal-content">
            <h3>Nouveau Poste</h3>
            <div class="option" onclick="publish('📸 Photo')"><i class="fas fa-image"></i> Photo</div>
            <div class="option" onclick="publish('🎥 Vidéo')"><i class="fas fa-video"></i> Vidéo</div>
            <div class="option" onclick="publish('✍️ Texte')"><i class="fas fa-font"></i> Texte</div>
            <button onclick="closeModal('modalPost')" style="margin-top:10px; color:red; border:none; background:none; cursor:pointer;">Annuler</button>
        </div>
    </div>

    <div id="modalLogin" class="modal">
        <div class="modal-content">
            <h3>Connexion Client</h3>
            <input type="text" id="inEmail" placeholder="Email / Identifiant" style="width:90%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">
            <input type="password" id="inPass" placeholder="Mot de passe" style="width:90%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd;">
            <button onclick="handleConnect()" style="width:100%; background:var(--tiktok-red); color:white; border:none; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer;">Se connecter</button>
            <p onclick="closeModal('modalLogin')" style="cursor:pointer; margin-top:15px; font-size:14px;">Fermer</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmWi55H7--DzkuiTHWS4Q4xmqeBq9WvkLpd0y9GIpTL3osmmL4zpACStbOCOwYgw0Q/exec";

        // 1. Touche Home : Rafraîchit le flux
        function goHome() {
            document.getElementById('mainFeed').style.background = "#e60023";
            document.getElementById('postDesc').innerText = "Flux Home actualisé ! 🚀";
            window.scrollTo(0,0);
        }

        // 2. Touche Viral (Explosion) : Change de contenu
        function goViral() {
            document.getElementById('mainFeed').style.background = "#9c27b0";
            document.getElementById('postDesc').innerText = "🔥 Section VIRAL : Les vidéos qui explosent !";
            confetti({ particleCount: 50, spread: 60 });
        }

        // 3. Touche Messages : Nettoie les notifs et répond
        function openMessages() {
            document.getElementById('badgeMsg').style.display = 'none';
            alert("Messagerie Luther's : Vous pouvez maintenant répondre à vos clients.");
        }

        // 4. Gestion des Modales (+) et Profil
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function publish(type) {
            alert("Ouverture de l'appareil pour : " + type);
            closeModal('modalPost');
        }

        // 5. Profil : Connexion réelle vers Google Sheets
        function handleConnect() {
            const email = document.getElementById('inEmail').value;
            const pass = document.getElementById('inPass').value;

            if(email && pass) {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ nom: email, mdp: pass, methode: 'Profil_Login' })
                });

                // Mise à jour visuelle du profil
                document.getElementById('displayUser').innerText = email;
                document.getElementById('userIcon').style.display = 'none';
                document.getElementById('userImg').src = "https://i.pravatar.cc/100?u=" + email;
                document.getElementById('userImg').style.display = 'block';
                
                closeModal('modalLogin');
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }
        }
    </script>
</body>
</html>
