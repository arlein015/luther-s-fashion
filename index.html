<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther Fashion | Boutique Officielle</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: #fff; color: #000; }

        /* --- HEADER & NAV --- */
        .top-promo { background: #000; color: #fff; text-align: center; padding: 8px; font-size: 11px; font-weight: 700; }
        header { padding: 10px 15px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .logo { font-weight: 900; font-size: 20px; text-decoration: none; color: #000; letter-spacing: -1px; }
        .search-container { flex: 1; position: relative; margin: 0 10px; }
        .search-container input { width: 100%; padding: 8px 35px; border: 1px solid #ddd; border-radius: 4px; background: #f8f8f8; font-size: 13px; }
        .search-container .fa-search { position: absolute; left: 10px; top: 10px; color: #888; }
        .search-container .fa-camera { position: absolute; right: 10px; top: 10px; color: #888; }
        .right-icons { display: flex; align-items: center; gap: 12px; font-size: 16px; }
        .notif-badge { position: absolute; top: -6px; right: -6px; background: #FF0000; color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 50%; font-weight: 900; }
        
        .nav-bar { display: flex; align-items: center; gap: 15px; padding: 10px 15px; border-bottom: 1px solid #eee; overflow-x: auto; white-space: nowrap; }
        .nav-bar a { text-decoration: none; color: #000; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .sale-link { color: #FF0000 !important; font-weight: 900; }

        /* --- BANNIÈRE --- */
        .hero-banner { position: relative; width: 100%; height: 250px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .hero-img { position: absolute; width: 100%; height: 100%; background: url('Veste vert.jpg') center/cover; opacity: 0.6; filter: blur(2px); }
        .hero-text { position: relative; z-index: 2; text-align: center; color: #fff; }
        .hero-text h2 { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
        .hero-text button { background: #fff; color: #000; border: none; padding: 10px 20px; font-weight: 900; text-transform: uppercase; }

        /* --- CATEGORIES --- */
        .section-title { padding: 20px 15px 10px; font-weight: 900; font-size: 14px; text-transform: uppercase; }
        .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 15px; margin-bottom: 20px; }
        .cat-card { text-align: center; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .cat-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; margin-bottom: 5px; }

        /* --- GRILLE DE 30 PRODUITS --- */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .p-card { border: 1px solid #f2f2f2; border-radius: 4px; overflow: hidden; background: #fff; }
        .p-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .p-info { padding: 10px; text-align: left; }
        .p-name { font-size: 11px; color: #333; margin-bottom: 5px; height: 28px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price { font-weight: 900; color: #FF0000; font-size: 15px; }
        .add-btn { width: 100%; background: #000; color: #fff; border: none; padding: 10px; font-weight: 900; font-size: 10px; margin-top: 10px; text-transform: uppercase; cursor: pointer; }

        /* --- FOOTER --- */
        footer { background: #000; color: #fff; padding: 40px 20px; margin-top: 40px; }
        .footer-menu { border-bottom: 1px solid #333; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .footer-newsletter { margin: 30px 0; }
        .input-group { position: relative; display: flex; margin-top: 15px; }
        .input-group input { width: 100%; padding: 15px; border-radius: 4px; border: none; }
        .input-group button { position: absolute; right: 5px; top: 5px; height: 40px; width: 40px; border-radius: 50%; background: #eee; border: none; }
        .social-icons { display: flex; gap: 20px; justify-content: center; margin-top: 30px; font-size: 20px; color: #888; }
        .copyright { text-align: center; font-size: 10px; color: #666; margin-top: 40px; }

        /* --- PANIER --- */
        #cart-drawer { position: fixed; top: 0; right: -100%; width: 85%; height: 100%; background: #fff; z-index: 2000; transition: 0.3s; padding: 20px; }
        #cart-drawer.active { right: 0; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 1999; }
        #overlay.active { display: block; }
    </style>
</
