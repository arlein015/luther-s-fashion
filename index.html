<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Threndly</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --sidebar: #0a0a0a; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; }

        /* Écran d'Authentification Stylé */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #111; padding: 35px 25px; border-radius: 30px; width: 100%; max-width: 350px; text-align: center; border: 1px solid #222; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .logo-img-large { width: 200px; margin-bottom: 30px; }
        
        .auth-input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #333; background: #050505; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
        .auth-input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 210, 255, 0.1); }
        
        .auth-btn { background: var(--grad); border: none; padding: 16px; border-radius: 30px; color: white; width: 100%; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: 0.2s; }
        .auth-btn:active { transform: scale(0.96); }

        .auth-links { margin-top: 25px; font-size: 0.9rem; color: #888; display: flex; flex-direction: column; gap: 10px; }
        .auth-links span { color: var(--cyan); cursor: pointer; font-weight: bold; }
        
        /* Sidebar & Chat (Design Slim et Mobile) */
        #sidebar { width: 85px; background: var(--sidebar); border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px 0; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .logo-box { width: 45px; height: 45px; margin-bottom: 10px; }
        /* Correction Logo Sidebar */
        .logo-img-small { width: 100%; height: 100%; object-fit: contain; } 
        .add-friend-btn { width: 45px; height: 45px; border-radius: 50%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: var(--cyan); cursor: pointer; border: 1px solid #333; }

        #friends-list { flex: 1; overflow-y: auto; }
        .friend-item { padding: 15px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
        /* Photo de Profil Mobile */
        .friend-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; } 
        .friend-item.active .friend-avatar { border-color: var(--cyan); }

        #main-chat { flex: 1; display: none; flex-direction: column; background: #000; }
        header { padding: 15px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; }
        .my-msg { align-self: flex-end; background: var(--grad); }
        .other-msg { align-self: flex-start; background: #262626; }

        #input-area { padding: 10px 15px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; border-top: 1px solid #1a1a1a; }
        .input-container { flex: 1; background: #1a1a1a; border-radius: 25px; padding: 10px 18px; }
        #message-input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 16px; }

        @media (min-width: 900px) { #sidebar { width: 280px; } .friend-item { flex-direction: row; padding: 15px 20px; gap: 15px; } .logo-box { display: none; } }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <img src="logo.png" class="logo-img-large" alt="Threndly">
        <h2 id="auth-title" style="margin-bottom: 20px; font-size: 1.2rem;">Connexion</h2>
        
        <input type="text" id="username" class="auth-input" placeholder="Identifiant (ex: arlein015)">
        <input type="password" id="password" class="auth-input" placeholder="Mot de passe">
        
        <button id="auth-submit" onclick="processAuth()" class="auth-btn">Se connecter</button>
        
        <div class="auth-links">
            <div id="auth-toggle-text">
                Vous n'avez pas de compte ? <span onclick="toggleAuthMode()">S'inscrire</span>
            </div>
            <span style="font-size:0.8rem;" onclick="forgotPassword()">Mot de passe oublié ?</span>
        </div>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <div class="logo-box"><img src="logo.png" class="logo-img-small"></div>
        <div class="add-friend-btn" onclick="openDirectory()"><i class="fas fa-plus"></i></div>
    </div>
    <div id="friends-list"></div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="" id="chat-avatar" style="width:40px; height:40px; border-radius:50%; border: 1px solid #333;">
            <div id="chat-name" style="font-weight:bold;"></div>
        </div>
        <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#444; cursor:pointer; font-size:1.2rem;"></i>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <label for="img-input"><i class="far fa-image" style="color:#888; font-size:1.6rem; cursor:pointer;"></i></label>
        <input type="file" id="img-input" hidden accept="image/*" onchange="sendPhoto(this)">
        <div class="input-container">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        <button onclick="sendMsg()" class="auth-btn" style="width:45px; height:45px; margin:0; border-radius:50%; flex-shrink:0;"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isSignUpMode = false;
    let myUser = localStorage.getItem('threndly_user') || "";

    if(myUser) { document.getElementById('auth-screen').style.display = 'none'; loadFriends(); }

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('auth-title').innerText = isSignUpMode ? "Créer un compte" : "Connexion";
        document.getElementById('auth-submit').innerText = isSignUpMode ? "S'inscrire" : "Se connecter";
        document.getElementById('auth-toggle-text').innerHTML = isSignUpMode ? 
            "Vous avez déjà un compte ? <span onclick='toggleAuthMode()'>Se connecter</span>" : 
            "Vous n'avez pas de compte ? <span onclick='toggleAuthMode()'>S'inscrire</span>";
    }

    function forgotPassword() {
        alert("Pour réinitialiser votre mot de passe, veuillez contacter l'administrateur à admin@threndly.com.");
    }

    function processAuth() {
        const user = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('password').value.trim();

        if(!user || !pass) return alert("Remplis tous les champs !");
        if(pass.length < 6) return alert("Le mot de passe doit faire au moins 6 caractères !");

        if(isSignUpMode) {
            // Inscription : Vérifie si le pseudo existe déjà
            db.ref("users_auth/" + user).once("value", snap => {
                if(snap.exists()) return alert("Cet identifiant est déjà pris !");
                
                // Crée le compte (Identifiant + Mot de passe)
                db.ref("users_auth/" + user).set({ password: pass }).then(() => {
                    // Crée le profil public avec photo par défaut
                    db.ref("users_list/" + user).set({ 
                        name: user, 
                        // Photo de profil par défaut
                        img: "https://i.pravatar.cc/150?u=" + user 
                    });
                    completeLogin(user);
                });
            });
        } else {
            // Connexion : Vérifie les identifiants
            db.ref("users_auth/" + user).once("value", snap => {
                if(snap.exists() && snap.val().password === pass) {
                    completeLogin(user);
                } else {
                    alert("Identifiant ou mot de passe incorrect !");
                }
            });
        }
    }

    function completeLogin(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        loadFriends();
    }

    function loadFriends() {
        const list = document.getElementById('friends-list');
        list.innerHTML = "";
        
        // Exemple d'amis avec photo de profil
        const friends = [
            { name: "Joselyna", img: "https://i.pravatar.cc/150?u=jos" },
            { name: "Nelly", img: "https://i.pravatar.cc/150?u=nel" }
        ];

        friends.forEach(f => {
            const div = document.createElement('div');
            div.className = 'friend-item';
            div.innerHTML = `
                <img src="${f.img}" class="friend-avatar">
                <div class="friend-name-label" style="display:none; color:white; font-size:0.9rem; margin-left:10px;">${f.name}</div>
            `;
            list.appendChild(div);
        });
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
