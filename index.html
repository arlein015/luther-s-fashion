<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Threndly</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --sidebar: #0a0a0a; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        html { overscroll-behavior-y: contain; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* Écran de connexion - LOGO ENCORE PLUS GROS */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-img-large { width: 250px; margin-bottom: 40px; }

        /* Sidebar Réduite pour laisser de la place au Chat */
        #sidebar { width: 85px; background: var(--sidebar); border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; flex-shrink: 0; transition: 0.3s; }
        .sidebar-header { padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .logo-img-small { width: 50px; height: auto; object-fit: contain; }

        #friends-list { flex: 1; overflow-y: auto; padding-top: 10px; }
        .friend-item { padding: 15px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; }
        .friend-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; }
        .friend-item.active .friend-avatar { border-color: var(--cyan); }
        .friend-name-label { display: none; } /* On cache les noms pour gagner de la place */
        
        .unread-badge { position: absolute; top: 12px; right: 12px; background: #ff3b30; color: white; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; border: 2px solid #000; }

        /* Zone de Discussion MAXIMISÉE */
        #main-chat { flex: 1; display: none; flex-direction: column; background: #000; }
        header { padding: 12px 20px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; background: #050505; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 85%; font-size: 1rem; line-height: 1.4; word-wrap: break-word; }
        .my-msg { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 12px; }

        /* Barre d'envoi Large */
        #input-area { padding: 15px 20px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #1a1a1a; background: #050505; }
        .input-container { flex: 1; background: #1a1a1a; border-radius: 30px; padding: 12px 20px; }
        #message-input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 1rem; }
        .send-btn { background: var(--grad); border: none; width: 48px; height: 48px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Design pour Ordinateur (on réaffiche les noms si l'écran est large) */
        @media (min-width: 900px) {
            #sidebar { width: 280px; }
            .friend-item { flex-direction: row; padding: 15px; gap: 15px; }
            .friend-name-label { display: block; font-weight: bold; font-size: 0.95rem; }
            .sidebar-header { flex-direction: row; justify-content: space-between; }
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <img src="logo.png" class="logo-img-large">
    <div style="background: #111; padding: 30px; border-radius: 25px; width: 280px; text-align: center; border: 1px solid #222;">
        <input type="text" id="user-id" placeholder="Ton nom" style="width:100%; padding:14px; margin-bottom:20px; border-radius:12px; border:none; background:#1a1a1a; color:white; box-sizing:border-box;">
        <button onclick="handleAuth()" style="background:var(--grad); border:none; padding:14px; border-radius:25px; color:white; width:100%; font-weight:bold; cursor:pointer;">Entrer ✅</button>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <img src="logo.png" class="logo-img-small">
        <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#444; cursor:pointer; font-size: 1.2rem;"></i>
    </div>
    <div id="friends-list"></div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="" id="chat-avatar" style="width:40px; height:40px; border-radius:50%; border: 1px solid #333;">
            <div id="chat-name" style="font-weight:bold; font-size: 1.1rem;"></div>
        </div>
        <div style="display:flex; gap:20px; color:#666; font-size: 1.2rem;">
            <i class="fas fa-phone"></i>
            <i class="fas fa-video"></i>
        </div>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <label for="img-input"><i class="far fa-image" style="color:#888; font-size:1.6rem; cursor:pointer;"></i></label>
        <input type="file" id="img-input" hidden accept="image/*" onchange="sendPhoto(this)">
        <div class="input-container">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        <button class="send-btn" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myUser = localStorage.getItem('threndly_user') || "";
    let activeChat = "";
    let friendsData = [
        { id: "Joselyna", name: "Joselyna", img: "https://i.pravatar.cc/150?u=jos", unread: 0, lastTime: 0 },
        { id: "Nelly", name: "Nelly", img: "https://i.pravatar.cc/150?u=nel", unread: 0, lastTime: 0 },
        { id: "Arthur💸", name: "Arthur💸", img: "https://i.pravatar.cc/150?u=art", unread: 0, lastTime: 0 },
        { id: "Lebien", name: "Lebien", img: "https://i.pravatar.cc/150?u=leb", unread: 0, lastTime: 0 }
    ];

    if(myUser) login(myUser);

    function handleAuth() {
        const name = document.getElementById('user-id').value.trim();
        if(name) login(name);
    }

    function login(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        initNotifications();
        renderFriends();
    }

    function initNotifications() {
        friendsData.forEach(friend => {
            db.ref("chats/" + friend.id).limitToLast(1).on("child_added", snap => {
                const msg = snap.val();
                friend.lastTime = msg.time || Date.now();
                if (msg.from !== myUser && activeChat !== friend.id) {
                    friend.unread++;
                }
                sortAndRender();
            });
        });
    }

    function sortAndRender() {
        friendsData.sort((a, b) => b.lastTime - a.lastTime);
        renderFriends();
    }

    function renderFriends() {
        const list = document.getElementById('friends-list');
        list.innerHTML = "";
        friendsData.forEach(f => {
            const div = document.createElement('div');
            div.className = `friend-item ${activeChat === f.id ? 'active' : ''}`;
            div.onclick = () => openChat(f.id, f.img);
            div.innerHTML = `
                <img src="${f.img}" class="friend-avatar">
                <div class="friend-name-label">${f.name}</div>
                ${f.unread > 0 ? `<div class="unread-badge">${f.unread}</div>` : ''}
            `;
            list.appendChild(div);
        });
    }

    function openChat(id, img) {
        activeChat = id;
        const friend = friendsData.find(f => f.id === id);
        if(friend) friend.unread = 0;
        
        document.getElementById('main-chat').style.display = 'flex';
        document.getElementById('chat-name').innerText = id;
        document.getElementById('chat-avatar').src = img;
        sortAndRender();
        loadMessages();
    }

    function sendMsg() {
        const input = document.getElementById('message-input');
        if(input.value.trim() && activeChat) {
            db.ref("chats/" + activeChat).push({ from: myUser, text: input.value, time: Date.now() });
            input.value = "";
        }
    }

    function sendPhoto(input) {
        const file = input.files[0];
        if(!file || !activeChat) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            db.ref("chats/" + activeChat).push({ from: myUser, text: e.target.result, time: Date.now() });
        };
        reader.readAsDataURL(file);
    }

    function loadMessages() {
        const box = document.getElementById('chat-box');
        db.ref("chats/" + activeChat).off();
        box.innerHTML = "";
        db.ref("chats/" + activeChat).on("child_added", snap => {
            const m = snap.val();
            const div = document.createElement('div');
            div.className = `msg ${m.from === myUser ? 'my-msg' : 'other-msg'}`;
            div.innerHTML = m.text.startsWith('data:image') ? `<img src="${m.text}">` : m.text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    }

    function logout() { localStorage.removeItem('threndly_user'); location.reload(); }
</script>
</body>
</html>
