<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MonRéseau - Badge Pro 24 Pointes</title>
    <style>
        :root {
            --violet-premium: #9c27b0;
            --violet-clair: #ce85f2;
            --blanc: #ffffff;
        }

        body {
            background-color: #010101; /* Fond style TikTok */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .user-container {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* --- LE BADGE PRO 24 POINTES --- */
        .verified-badge-24 {
            width: 26px;
            height: 26px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Animation de brillance discrète */
            filter: drop-shadow(0 0 2px var(--violet-clair));
        }

        .verified-badge-24::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--violet-clair), var(--violet-premium));
            
            /* Forme à 24 pointes ultra-lisse */
            clip-path: polygon(
                50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%
            );
            border-radius: 50%; /* Arrondit les pointes pour le côté "bien rond" */
        }

        /* La coche blanche */
        .verified-badge-24::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 11px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
            margin-top: -2px;
        }

        /* ------------------------------- */

    </style>
</head>
<body>

    <div class="user-container">
        Paris Models 
        <div class="verified-badge-24" title="Badge Pro 24 pointes"></div>
    </div>

</body>
</html>
