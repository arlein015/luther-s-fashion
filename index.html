<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Threndly</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --sidebar: #0a0a0a; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        
        /* Amélioration du scroll et du toucher mobile */
        html { overscroll-behavior-y: contain; scroll-behavior: smooth; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        /* Login - Logo XXL */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-img-large { width: 250px; margin-bottom: 40px; filter: drop-shadow(0 0 10px rgba(187, 107, 217, 0.3)); }

        /* Sidebar Fine (85px) */
        #sidebar { width: 85px; background: var(--sidebar); border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px 0; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .logo-img-small { width: 50px; height: auto; object-fit: contain; }

        #friends-list { flex: 1; overflow-y: auto; scrollbar-width: none; }
        #friends-list::-webkit-scrollbar { display: none; }
        
        .friend-item { padding: 15px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; transition: transform 0.1s active; }
        .friend-item:active { transform: scale(0.9); }
        .friend-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; transition: 0.3s; }
        .friend-item.active .friend-avatar { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 210, 255, 0.2); }
        
        .unread-badge { position: absolute; top: 12px; right: 12px; background: #ff3b30; color: white; font-size: 0.7rem; font-weight: bold; padding: 2px 7px; border-radius: 10px; border: 2px solid #000; z-index: 10; }

        /* Zone de Discussion */
        #main-chat { flex: 1; display: none; flex-direction: column; background: #000; }
        header { padding: 12px 20px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px); }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 80%; font-size: 1rem; line-height: 1.4; word-wrap: break-word; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .my-msg { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; }
        .other-msg { align-self: flex-start; background: #262626; border-bottom-left-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 12px; margin: 5px 0; }

        /* Barre d'envoi améliorée */
        #input-area { padding: 15px 20px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #1a1a1a; background: #050505; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .input-container { flex: 1; background: #1a1a1a; border-radius: 30px; padding: 12px 20px; display: flex; align-items: center; }
        #message-input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 1rem; }
        .send-btn { background: var(--grad); border: none; width: 48px; height: 48px; border-radius: 50%; color: white; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .send-btn:active { transform: scale(0.85); opacity: 0.8; }

        @media (min-width: 900px) {
            #sidebar { width: 280px; }
            .friend-item { flex-direction: row; padding: 15px; gap: 15px; align-items: center; }
            .friend-name-label { display: block; font-weight: bold; }
            .sidebar-header { flex-direction: row; padding: 20px; }
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <img src="logo.png" class="logo-img-large">
    <div style="background: #111; padding: 30px; border-radius: 25px; width: 280px; text-align: center; border: 1px solid #222;">
        <input type="text" id="user-id" placeholder="Ton nom" style="width:100%; padding:14px; margin-bottom:20px; border-radius:12px; border:none; background:#1a1a1a; color:white; box-sizing:border-box;">
        <button onclick="handleAuth()" style="background:var(--grad); border:none; padding:14px; border-radius:25px; color:white; width:100%; font-weight:bold; cursor:pointer;">Entrer ✅</button>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <img src="logo.png" class="logo-img-small">
        <i class="fas fa-sign-out-alt" onclick="logout()" style="color:#444; cursor:pointer;"></i>
    </div>
    <div id="friends-list"></div>
</div>

<div id="main-chat">
    <header>
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="" id="chat-avatar" style="width:42px; height:42px; border-radius:50%; border: 1px solid #333;">
            <div id="chat-name" style="font-weight:bold; font-size: 1.1rem;"></div>
        </div>
        <div style="display:flex; gap:22px; color:#555; font-size: 1.3rem;">
            <i class="fas fa-phone" style="cursor:pointer"></i>
            <i class="fas fa-video" style="cursor:pointer"></i>
        </div>
    </header>
    <div id="chat-box"></div>
    <div id="input-area">
        <label for="img-input"><i class="far fa-image" style="color:#888; font-size:1.6rem; cursor:pointer;"></i></label>
        <input type="file" id="img-input" hidden accept="image/*" onchange="sendPhoto(this)">
        <div class="input-container">
            <input type="text" id="message-input" placeholder="Message..." onkeypress="if(event.key=='Enter')sendMsg()">
        </div>
        <button class="send-btn" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myUser = localStorage.getItem('threndly_user') || "";
    let activeChat = "";
    let friendsData = [
        { id: "Joselyna", img: "https://i.pravatar.cc/150?u=jos", unread: 0, lastTime: 0 },
        { id: "Nelly", img: "https://i.pravatar.cc/150?u=nel", unread: 0, lastTime: 0 },
        { id: "Arthur💸", img: "https://i.pravatar.cc/150?u=art", unread: 0, lastTime: 0 },
        { id: "Lebien", img: "https://i.pravatar.cc/150?u=leb", unread: 0, lastTime: 0 }
    ];

    if(myUser) login(myUser);

    function handleAuth() {
        const name = document.getElementById('user-id').value.trim();
        if(name) login(name);
    }

    function login(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        initNotifications();
        renderFriends();
    }

    function initNotifications() {
        friendsData.forEach(friend => {
            db.ref("chats/" + friend.id).limitToLast(1).on("child_added", snap => {
                const msg = snap.val();
                friend.lastTime = msg.time || Date.now();
                if (msg.from !== myUser && activeChat !== friend.id) {
                    friend.unread++;
                }
                sortAndRender();
            });
        });
    }

    function sortAndRender() {
        friendsData.sort((a, b) => b.lastTime - a.lastTime);
        renderFriends();
    }

    function renderFriends() {
        const list = document.getElementById('friends-list');
        list.innerHTML = "";
        friendsData.forEach(f => {
            const div = document.createElement('div');
            div.className = `friend-item ${activeChat === f.id ? 'active' : ''}`;
            div.onclick = () => openChat(f.id, f.img);
            div.innerHTML = `
                <img src="${f.img}" class="friend-avatar">
                ${f.unread > 0 ? `<div class="unread-badge">${f.unread}</div>` : ''}
            `;
            list.appendChild(div);
        });
    }

    function openChat(id, img) {
        activeChat = id;
        const friend = friendsData.find(f => f.id === id);
        if(friend) friend.unread = 0;
        document.getElementById('main-chat').style.display = 'flex';
        document.getElementById('chat-name').innerText = id;
        document.getElementById('chat-avatar').src = img;
        sortAndRender();
        loadMessages();
    }

    function sendMsg() {
        const input = document.getElementById('message-input');
        if(input.value.trim() && activeChat) {
            db.ref("chats/" + activeChat).push({ from: myUser, text: input.value, time: Date.now() });
            input.value = "";
            input.focus();
        }
    }

    function sendPhoto(input) {
        const file = input.files[0];
        if(!file || !activeChat) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            db.ref("chats/" + activeChat).push({ from: myUser, text: e.target.result, time: Date.now() });
        };
        reader.readAsDataURL(file);
    }

    function loadMessages() {
        const box = document.getElementById('chat-box');
        db.ref("chats/" + activeChat).off();
        box.innerHTML = "";
        db.ref("chats/" + activeChat).on("child_added", snap => {
            const m = snap.val();
            const div = document.createElement('div');
            div.className = `msg ${m.from === myUser ? 'my-msg' : 'other-msg'}`;
            div.innerHTML = m.text.startsWith('data:image') ? `<img src="${m.text}">` : m.text;
            box.appendChild(div);
            box.scrollTo(0, box.scrollHeight);
        });
    }

    function logout() { localStorage.removeItem('threndly_user'); location.reload(); }
</script>
</body>
</html>
