<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅ - Social</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; }
        
        /* Écran d'inscription */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-main { background: var(--grad); border: none; padding: 12px 30px; border-radius: 25px; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; }
        input { background: #1A1A1A; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; width: 250px; margin-bottom: 10px; outline: none; }

        /* Interface Principale */
        #app-interface { display: none; height: 100vh; flex-direction: column; }
        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .verified-badge { color: var(--cyan); margin-left: 5px; }

        /* Liste des amis / Demandes */
        #social-panel { padding: 15px; background: #0A0A0A; border-bottom: 1px solid #222; }
        .request-item { background: #1A1A1A; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .btn-accept { color: #00ff88; cursor: pointer; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 10px; border-left: 2px solid var(--cyan); padding-left: 10px; }
    </style>
</head>
<body>

<div id="auth-screen">
    <h1 style="background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">TRENDLY ✅</h1>
    <p>Inscrivez-vous pour rejoindre vos amis</p>
    <input type="text" id="reg-username" placeholder="Choisissez un pseudo...">
    <button class="btn-main" onclick="registerUser()">Créer mon compte</button>
</div>

<div id="app-interface">
    <header>
        <div style="font-weight:bold;">@ <span id="my-name-display"></span> <i class="fas fa-check-circle verified-badge"></i></div>
        <button class="btn-main" style="margin:0; padding:5px 15px; font-size:0.8rem;" onclick="addFriendPrompt()">+ Ajouter un ami</button>
    </header>

    <div id="social-panel">
        <div id="pending-requests">
            </div>
    </div>

    <div id="chat-container">
        <p style="color:#555; text-align:center;">Vos messages s'afficheront ici une fois l'ami confirmé.</p>
    </div>

    <div style="padding:15px; display:flex; gap:10px; background:#000;">
        <input type="text" id="msg-input" style="flex:1" placeholder="Ecrire...">
        <button onclick="sendPrivateMsg()" class="btn-main" style="margin:0">⬆️</button>
    </div>
</div>

<script>
    // CONFIG FIREBASE
    const firebaseConfig = { apiKey: "TON_API_KEY", databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myName = "";

    // FONCTION D'INSCRIPTION
    function registerUser() {
        myName = document.getElementById('reg-username').value.trim();
        if (myName) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-interface').style.display = 'flex';
            document.getElementById('my-name-display').innerText = myName;
            listenForRequests();
        }
    }

    // ENVOYER UNE INVITATION
    function addFriendPrompt() {
        const friend = prompt("Pseudo de l'ami à inviter :");
        if(friend) {
            db.ref('requests/' + friend).push({
                from: myName,
                message: "Veut être votre ami sur Threndly ✅"
            });
            alert("Invitation envoyée !");
        }
    }

    // ÉCOUTER LES DEMANDES REÇUES
    function listenForRequests() {
        db.ref('requests/' + myName).on('child_added', snap => {
            const req = snap.val();
            const div = document.createElement('div');
            div.className = "request-item";
            div.innerHTML = `
                <span><strong>${req.from}</strong> vous a invité</span>
                <span class="btn-accept" onclick="confirmFriend('${req.from}', '${snap.key}')">✅ Confirmer</span>
            `;
            document.getElementById('pending-requests').appendChild(div);
        });
    }

    // CONFIRMER L'AMI
    function confirmFriend(friendName, requestId) {
        // On crée le lien d'amitié dans la base
        db.ref('friends/' + myName).child(friendName).set(true);
        db.ref('friends/' + friendName).child(myName).set(true);
        db.ref('requests/' + myName).child(requestId).remove();
        alert("Vous êtes maintenant amis !");
        location.reload(); // Recharger pour ouvrir le tchat
    }

    // TCHAT PRIVÉ (Affiche uniquement si amis)
    function sendPrivateMsg() {
        const txt = document.getElementById('msg-input').value;
        db.ref('chats/general').push({ from: myName, text: txt });
        document.getElementById('msg-input').value = "";
    }

    db.ref('chats/general').on('child_added', snap => {
        const m = snap.val();
        const div = document.createElement('div');
        div.className = "msg";
        div.innerHTML = `<strong>@ ${m.from}</strong><br>${m.text}`;
        document.getElementById('chat-container').appendChild(div);
    });
</script>
</body>
</html>
