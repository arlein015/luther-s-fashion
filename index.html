<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --cyan: #00d2ff; --bg: #000; --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .auth-card { background: #111; padding: 25px; border-radius: 20px; border: 1px solid #222; width: 320px; text-align: center; }
        
        .logo-te { font-size: 2.5rem; font-weight: bold; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        
        .auth-input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; outline: none; box-sizing: border-box; transition: 0.3s; }
        .auth-input:focus { border-color: var(--cyan); }

        .btn-main { background: var(--grad); border: none; padding: 14px; width: 100%; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .switch-btn { color: #888; font-size: 0.85rem; margin-top: 15px; cursor: pointer; display: block; text-decoration: underline; }
        .hidden { display: none; }
        
        /* Interface Chat */
        #app-interface { display: none; flex-direction: column; height: 100vh; }
        header { padding: 15px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #1a1a1a; padding: 10px 15px; border-radius: 15px; max-width: 80%; margin-bottom: 5px; }
        .my-msg { align-self: flex-end; background: var(--grad); }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="logo-te">Threndly</div>
    <div class="auth-card">
        <h3 id="auth-title">Connexion ✅</h3>
        
        <input type="text" id="user-id" class="auth-input" placeholder="Email ou Numéro">
        <input type="password" id="user-pass" class="auth-input" placeholder="Mot de passe">
        
        <input type="password" id="user-confirm" class="auth-input hidden" placeholder="Confirmer le mot de passe">
        
        <button class="btn-main" id="btn-action" onclick="handleAuth()">Se connecter</button>
        
        <span class="switch-btn" id="toggle-link" onclick="toggleMode()">Pas de compte ? S'inscrire</span>
        <p id="error-msg" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px; display: none;"></p>
    </div>
</div>

<div id="app-interface">
    <header>
        <div style="font-weight:bold">Threndly <i class="fas fa-check-circle" style="color:var(--cyan)"></i></div>
        <div id="user-display" style="font-size:0.8rem; color:#888"></div>
    </header>
    <div id="chat-box"></div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLoginMode = true;
    let myUser = "";

    function toggleMode() {
        isLoginMode = !isLoginMode;
        const title = document.getElementById('auth-title');
        const btn = document.getElementById('btn-action');
        const link = document.getElementById('toggle-link');
        const confirmInput = document.getElementById('user-confirm');

        if (isLoginMode) {
            title.innerText = "Connexion ✅";
            btn.innerText = "Se connecter";
            link.innerText = "Pas de compte ? S'inscrire";
            confirmInput.classList.add('hidden');
        } else {
            title.innerText = "Inscription ✅";
            btn.innerText = "Créer mon compte";
            link.innerText = "Déjà un compte ? Se connecter";
            confirmInput.classList.remove('hidden');
        }
    }

    function handleAuth() {
        const id = document.getElementById('user-id').value.trim();
        const pass = document.getElementById('user-pass').value.trim();
        const confirm = document.getElementById('user-confirm').value.trim();
        const error = document.getElementById('error-msg');

        error.style.display = 'none';

        if (!id || !pass) {
            showError("Veuillez remplir les champs.");
            return;
        }

        if (!isLoginMode) {
            // MODE INSCRIPTION
            if (pass !== confirm) {
                showError("Les mots de passe ne correspondent pas !");
                return;
            }
            // On enregistre l'utilisateur dans Firebase
            db.ref('users/' + id.replace(/[^a-zA-Z0-9]/g, "")).set({
                password: pass
            }).then(() => {
                enterApp(id);
            });
        } else {
            // MODE CONNEXION
            db.ref('users/' + id.replace(/[^a-zA-Z0-9]/g, "")).once('value', (snap) => {
                if (snap.exists() && snap.val().password === pass) {
                    enterApp(id);
                } else {
                    showError("Identifiant ou mot de passe incorrect.");
                }
            });
        }
    }

    function showError(txt) {
        const error = document.getElementById('error-msg');
        error.innerText = txt;
        error.style.display = 'block';
    }

    function enterApp(name) {
        myUser = name;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-interface').style.display = 'flex';
        document.getElementById('user-display').innerText = "@" + name;
        startChat();
    }

    function startChat() {
        db.ref("messages").limitToLast(20).on("child_added", snap => {
            const data = snap.val();
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg ${data.user === myUser ? 'my-msg' : ''}`;
            div.innerHTML = `<small style="display:block; font-size:0.6rem; opacity:0.6">${data.user}</small>${data.text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    }
</script>
</body>
</html>
