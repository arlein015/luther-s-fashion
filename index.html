<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --cyan: #00d2ff; 
            --bg: #000; 
            --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
        }

        /* --- ÉCRAN D'AUTHENTIFICATION --- */
        #auth-screen { 
            position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .auth-card { 
            background: #111; padding: 30px; border-radius: 25px; border: 1px solid #222; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo-te { 
            font-size: 3rem; font-weight: bold; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; 
        }
        .auth-input { 
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 14px; border-radius: 12px; width: 100%; margin-bottom: 12px; outline: none; box-sizing: border-box; transition: 0.3s;
        }
        .auth-input:focus { border-color: var(--cyan); }
        .btn-main { 
            background: var(--grad); border: none; padding: 15px; width: 100%; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem;
        }
        .switch-btn { color: #888; font-size: 0.85rem; margin-top: 15px; cursor: pointer; display: block; text-decoration: none; }
        .hidden { display: none; }

        /* --- INTERFACE DE DISCUSSION --- */
        #app-interface { display: none; flex-direction: column; height: 100vh; width: 100%; }
        
        header { 
            padding: 15px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }
        .brand { font-weight: bold; font-size: 1.3rem; display: flex; align-items: center; gap: 6px; }
        .verified-badge { color: var(--cyan); font-size: 1rem; }

        #chat-box { 
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;
        }

        /* Bulles de message */
        .msg { 
            padding: 12px 16px; border-radius: 20px; max-width: 80%; line-height: 1.4; background: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; position: relative;
        }
        .my-msg { 
            align-self: flex-end; background: var(--grad); border-bottom-left-radius: 20px; border-bottom-right-radius: 4px; 
        }
        .msg-user { font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; gap: 4px; opacity: 0.9; }
        .msg-content { word-wrap: break-word; }

        /* Zone d'écriture */
        #input-area { 
            padding: 15px; background: #000; border-top: 1px solid #222; display: flex; gap: 10px; align-items: center;
        }
        #message-input { 
            flex: 1; background: #1a1a1a; border: none; padding: 14px 20px; border-radius: 30px; color: white; outline: none; font-size: 1rem;
        }
        .send-btn { 
            background: var(--grad); border: none; width: 45px; height: 45px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="logo-te">Threndly</div>
    <div class="auth-card">
        <h3 id="auth-title" style="margin-top:0">Connexion ✅</h3>
        <input type="text" id="user-id" class="auth-input" placeholder="Email ou Numéro">
        <input type="password" id="user-pass" class="auth-input" placeholder="Mot de passe">
        <input type="password" id="user-confirm" class="auth-input hidden" placeholder="Confirmer mot de passe">
        
        <button class="btn-main" id="btn-action" onclick="handleAuth()">Se connecter</button>
        <span class="switch-btn" id="toggle-link" onclick="toggleMode()">Pas de compte ? S'inscrire</span>
        <p id="error-msg" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px; display: none;"></p>
    </div>
</div>

<div id="app-interface">
    <header>
        <div class="brand">Threndly <i class="fas fa-check-circle verified-badge"></i></div>
        <div style="display:flex; align-items:center; gap:15px">
            <span id="user-display" style="font-size:0.8rem; color:#888"></span>
            <button onclick="logout()" style="background:none; border:none; color:#ff4444; cursor:pointer; font-size:1.1rem"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <div id="chat-box"></div>

    <div id="input-area">
        <input type="text" id="message-input" placeholder="Message certifié..." onkeypress="if(event.key=='Enter')sendMsg()">
        <button class="send-btn" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    // CONFIGURATION FIREBASE
    const firebaseConfig = {
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let isLoginMode = true;
    let myUser = localStorage.getItem('threndly_user') || "";

    // VERIFICATION AUTO AU CHARGEMENT
    window.onload = function() {
        if(myUser) {
            enterApp(myUser);
        }
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "Connexion ✅" : "Inscription ✅";
        document.getElementById('btn-action').innerText = isLoginMode ? "Se connecter" : "Créer mon compte";
        document.getElementById('toggle-link').innerText = isLoginMode ? "Pas de compte ? S'inscrire" : "Déjà un compte ? Se connecter";
        document.getElementById('user-confirm').classList.toggle('hidden', isLoginMode);
        document.getElementById('error-msg').style.display = 'none';
    }

    function handleAuth() {
        const idRaw = document.getElementById('user-id').value.trim();
        const pass = document.getElementById('user-pass').value.trim();
        const confirm = document.getElementById('user-confirm').value.trim();
        const error = document.getElementById('error-msg');

        if(!idRaw || !pass) { showError("Remplis tous les champs !"); return; }
        
        const idSafe = idRaw.replace(/[^a-zA-Z0-9]/g, ""); // Nettoyer l'ID pour Firebase

        if(!isLoginMode) {
            if(pass !== confirm) { showError("Les mots de passe sont différents !"); return; }
            // Inscription
            db.ref('users/' + idSafe).set({ password: pass, originalName: idRaw }).then(() => enterApp(idRaw));
        } else {
            // Connexion
            db.ref('users/' + idSafe).once('value', s => {
                if(s.exists() && s.val().password === pass) enterApp(idRaw);
                else showError("Identifiant ou mot de passe incorrect.");
            });
        }
    }

    function showError(txt) {
        const err = document.getElementById('error-msg');
        err.innerText = txt;
        err.style.display = 'block';
    }

    function enterApp(name) {
        myUser = name;
        localStorage.setItem('threndly_user', name);
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-interface').style.display = 'flex';
        document.getElementById('user-display').innerText = "@" + name.split('@')[0];
        startChat();
    }

    function logout() {
        localStorage.removeItem('threndly_user');
        location.reload();
    }

    function sendMsg() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if(text){
            db.ref("messages").push({
                user: myUser,
                text: text,
                timestamp: Date.now()
            });
            input.value = "";
        }
    }

    function startChat() {
        const chatBox = document.getElementById('chat-box');
        db.ref("messages").off(); // Stop les anciennes écoutes (évite les doublons)
        chatBox.innerHTML = ""; 

        db.ref("messages").limitToLast(100).on("child_added", snap => {
            if (!document.getElementById(snap.key)) {
                const data = snap.val();
                const isMe = data.user === myUser;
                
                const div = document.createElement('div');
                div.id = snap.key;
                div.className = `msg ${isMe ? 'my-msg' : ''}`;
                div.innerHTML = `
                    <div class="msg-user">@${data.user.split('@')[0]} <i class="fas fa-check-circle verified-badge" style="font-size:0.6rem"></i></div>
                    <div class="msg-content">${data.text}</div>
                `;
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    }
</script>
</body>
</html>
