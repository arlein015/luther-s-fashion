<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Threndly - Network</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --blue: #2D9CDB; 
            --purple: #BB6BD9; 
            --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%); 
        }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { margin: 0; background: #000; color: white; height: 100vh; overflow: hidden; display: flex; }

        /* --- 1. PAGE D'INSCRIPTION --- */
        #signup-screen { 
            position: fixed; inset: 0; background: #000; z-index: 100; 
            display: flex; align-items: center; justify-content: center; padding: 20px; 
            overflow-y: auto;
        }
        .card { background: #111; width: 100%; max-width: 400px; padding: 30px; border-radius: 25px; border: 1px solid #222; text-align: center; }
        .logo { width: 130px; margin-bottom: 20px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 0.7rem; color: #666; font-weight: bold; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; margin-top: 5px; }
        input:focus { border-color: var(--blue); }
        .btn-main { width: 100%; padding: 16px; background: var(--grad); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; }

        /* --- 2. PAGE DE VALIDATION (CODE) --- */
        #verify-screen { position: fixed; inset: 0; background: #000; z-index: 110; display: none; align-items: center; justify-content: center; }

        /* --- 3. PAGE DE DISCUSSION --- */
        #chat-screen { display: none; width: 100%; height: 100vh; flex-direction: row; }
        #sidebar { width: 75px; background: #080808; border-right: 1px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; padding-top: 25px; }
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        header { padding: 15px 25px; border-bottom: 1px solid #1a1a1a; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        #msg-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 12px 16px; border-radius: 20px; max-width: 75%; font-size: 0.95rem; }
        .me { align-self: flex-end; background: var(--grad); }
        .other { align-self: flex-start; background: #222; }
        footer { padding: 15px; display: flex; gap: 10px; background: #050505; border-top: 1px solid #1a1a1a; }
    </style>
</head>
<body>

    <div id="signup-screen">
        <div class="card">
            <img src="logo.png" class="logo">
            <h2>Rejoindre Threndly</h2>
            <div class="input-group">
                <label>MAIL OU NUMÉRO</label>
                <input type="text" id="reg-contact" placeholder="Email ou téléphone">
            </div>
            <div class="input-group">
                <label>NOM D'UTILISATEUR</label>
                <input type="text" id="reg-user" placeholder="@username">
            </div>
            <div class="input-group">
                <label>NOM COMPLET</label>
                <input type="text" id="reg-name" placeholder="Votre nom">
            </div>
            <div class="input-group">
                <label>MOT DE PASSE</label>
                <input type="password" id="reg-pass" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label>CONFIRMATION</label>
                <input type="password" id="reg-conf" placeholder="••••••••">
            </div>
            <button class="btn-main" onclick="goVerify()">Continuer</button>
        </div>
    </div>

    <div id="verify-screen">
        <div class="card">
            <i class="fas fa-shield-alt" style="font-size:3rem; color:var(--blue); margin-bottom:15px;"></i>
            <h2>Vérification</h2>
            <p style="color:#666">Code envoyé à 6 chiffres</p>
            <input type="text" id="v-code" maxlength="6" style="text-align:center; font-size:2rem; letter-spacing:10px;" placeholder="000000">
            <button class="btn-main" style="margin-top:20px;" onclick="finishAuth()">Valider</button>
        </div>
    </div>

    <div id="chat-screen">
        <div id="sidebar">
            <img src="logo.png" style="width:35px; margin-bottom:25px;">
            <i class="fas fa-plus-circle" style="color:var(--blue); font-size:1.8rem; cursor:pointer;"></i>
        </div>
        <div id="chat-main">
            <header>
                <div style="width:35px; height:35px; border-radius:50%; background:var(--grad);"></div>
                <span>Threndly Discussion</span>
            </header>
            <div id="msg-list"></div>
            <footer>
                <input type="text" id="msg-in" placeholder="Écrire un message..." style="flex:1; margin:0;">
                <button onclick="send()" class="btn-main" style="width:50px; border-radius:50%; margin:0;"><i class="fas fa-paper-plane"></i></button>
            </footer>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com", projectId: "trendly-fca7c" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let userData = {};

        // Vers la validation
        function goVerify() {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value;
            const c = document.getElementById('reg-conf').value;

            if(!u || p !== c) return alert("Vérifiez les mots de passe !");

            userData = { user: u, name: document.getElementById('reg-name').value };
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('verify-screen').style.display = 'flex';
        }

        // Vers la discussion
        function finishAuth() {
            const code = document.getElementById('v-code').value;
            if(code === "123456") {
                db.ref("profiles/" + userData.user).set(userData);
                localStorage.setItem('threndly_id', userData.user);
                
                document.getElementById('verify-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                startChat();
            } else { alert("Code incorrect (123456)"); }
        }

        function send() {
            const inp = document.getElementById('msg-in');
            const myID = localStorage.getItem('threndly_id');
            if(inp.value.trim()) {
                db.ref("messages/general").push({ from: myID, text: inp.value });
                inp.value = "";
            }
        }

        function startChat() {
            db.ref("messages/general").on("child_added", snap => {
                const m = snap.val();
                const d = document.createElement('div');
                const myID = localStorage.getItem('threndly_id');
                d.className = `bubble ${m.from === myID ? 'me' : 'other'}`;
                d.innerText = m.text;
                document.getElementById('msg-list').appendChild(d);
                document.getElementById('msg-list').scrollTop = document.getElementById('msg-list').scrollHeight;
            });
        }

        // Auto-login intelligent
        if(localStorage.getItem('threndly_id')) {
            document.getElementById('signup-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            startChat();
        }
    </script>
</body>
</html>
