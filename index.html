<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonRéseau PRO - Social Features</title>
    <style>
        :root { --violet: #9c27b0; --violet-clair: #ce85f2; --rouge: #f02849; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: black; color: white; overflow: hidden; }

        /* --- POST --- */
        .post-container { height: 100vh; width: 100%; position: relative; background: var(--rouge); display: flex; align-items: center; justify-content: center; }
        .main-content { text-align: center; z-index: 5; padding: 20px; }
        .post-text { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .hashtags { color: #ffd700; font-size: 18px; font-weight: bold; }

        /* --- ACTIONS DROITE --- */
        .side-actions { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; gap: 20px; }
        .btn-action { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .circle { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }

        /* --- SYSTEME DE COMMENTAIRES --- */
        .panel { position: fixed; bottom: -100%; left: 0; width: 100%; height: 70%; background: white; border-radius: 20px 20px 0 0; z-index: 1000; transition: 0.4s; color: black; display: flex; flex-direction: column; }
        .panel.active { bottom: 0; }
        .panel-header { padding: 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; font-weight: bold; }
        .comment-list { flex: 1; overflow-y: auto; padding: 15px; }
        .comment-item { margin-bottom: 12px; font-size: 14px; }
        .mention { color: var(--violet); font-weight: bold; }
        .hashtag-link { color: #007bff; }

        /* --- BARRE DE SAISIE --- */
        .input-area { padding: 10px; border-top: 1px solid #ddd; display: flex; gap: 10px; background: #f9f9f9; }
        .input-area input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }

        /* --- NAV BASSE --- */
        .nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: white; display: flex; justify-content: space-around; align-items: center; }
        .btn-plus { background: linear-gradient(90deg, var(--violet-clair), var(--violet)); width: 45px; height: 30px; border-radius: 8px; color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
        
        /* BADGE */
        .badge { width: 16px; height: 16px; background: var(--violet); border-radius: 50%; display: inline-block; margin-left: 4px; vertical-align: middle; position: relative; }
        .badge::after { content: '✓'; color: white; font-size: 10px; position: absolute; left: 3px; top: 0px; }
    </style>
</head>
<body>

    <div class="post-container">
        <div class="main-content">
            <div class="post-text" id="postContent">zah zalaah ty aiiii</div>
            <div class="hashtags" id="postHashtags">#Premium #Style #2026</div>
        </div>

        <div class="side-actions">
            <div class="btn-action">
                <div class="circle">❤️</div>
                <span style="font-size:12px">15K</span>
            </div>
            <div class="btn-action" onclick="togglePanel('commentsPanel')">
                <div class="circle">💬</div>
                <span style="font-size:12px">89</span>
            </div>
        </div>

        <div style="position:absolute; bottom:80px; left:15px;">
            <b>Moi (Proprio)</b> <div class="badge"></div>
        </div>
    </div>

    <div id="commentsPanel" class="panel">
        <div class="panel-header"><span>Commentaires</span><span onclick="togglePanel('commentsPanel')" style="cursor:pointer">✕</span></div>
        <div class="comment-list" id="commentList">
            <div class="comment-item"><b>Jean:</b> Incroyable ce post ! <span class="mention">@Moi</span> #Zalaah</div>
        </div>
        <div class="input-area">
            <input type="text" id="commentInput" placeholder="Ajouter un commentaire (utilisez @ ou #)...">
            <button onclick="addComment()" style="border:none; background:none; color:var(--violet); font-weight:bold;">Publier</button>
        </div>
    </div>

    <div class="nav">
        <div style="color:black; font-size:11px; text-align:center;">🏠<br>Accueil</div>
        <div class="btn-plus" onclick="createNewPost()">+</div>
        <div style="color:black; font-size:11px; text-align:center;">👤<br>Profil</div>
    </div>

    <script>
        function togglePanel(id) {
            document.getElementById(id).classList.toggle('active');
        }

        // Fonction pour transformer le texte en mentions et hashtags cliquables
        function formatText(text) {
            return text
                .replace(/@(\w+)/g, '<span class="mention">@$1</span>')
                .replace(/#(\w+)/g, '<span class="hashtag-link">#$1</span>');
        }

        function addComment() {
            const input = document.getElementById('commentInput');
            if(input.value.trim() === "") return;
            
            const list = document.getElementById('commentList');
            const div = document.createElement('div');
            div.className = "comment-item";
            div.innerHTML = `<b>Moi:</b> ${formatText(input.value)}`;
            
            list.appendChild(div);
            input.value = "";
            list.scrollTop = list.scrollHeight;
        }

        function createNewPost() {
            const text = prompt("Que voulez-vous dire ?");
            const tags = prompt("Ajoutez vos hashtags (ex: #Zalaah #Fun) :");
            if(text) {
                document.getElementById('postContent').innerText = text;
                document.getElementById('postHashtags').innerHTML = formatText(tags);
                alert("Votre poste a été publié !");
            }
        }
    </script>
</body>
</html>
