<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luther's Fashion - Plateforme Complète</title>
    <style>
        :root {
            --violet-p: #9c27b0;
            --violet-c: #ce85f2;
            --pink-tiktok: #ff0050;
            --bg-dark: #1a0121;
            --white: #ffffff;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg-dark); 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; 
        }

        /* --- SKELETON LOADER (ANIMATION DE CHARGEMENT) --- */
        .skeleton { background: linear-gradient(90deg, #30063a 25%, #4a0e5a 50%, #30063a 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        /* --- HEADER & RECHERCHE --- */
        .header { position: fixed; top: 0; width: 100%; z-index: 1000; padding: 10px 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .top-row { display: flex; align-items: center; padding: 0 15px; gap: 10px; }
        .search-bar { flex: 1; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 8px 15px; border: 0.5px solid rgba(255,255,255,0.2); }
        .search-bar input { background: none; border: none; color: white; width: 100%; outline: none; }
        .tabs { display: flex; justify-content: center; gap: 20px; margin-top: 10px; font-weight: bold; }
        .tab { cursor: pointer; opacity: 0.6; transition: 0.3s; }
        .tab.active { opacity: 1; border-bottom: 3px solid white; padding-bottom: 2px; }

        /* --- STORIES --- */
        .stories { display: flex; gap: 15px; padding: 15px; overflow-x: auto; margin-top: 90px; scrollbar-width: none; }
        .story { min-width: 65px; text-align: center; cursor: pointer; transition: transform 0.2s; }
        .story:active { transform: scale(0.9); }
        .ring { width: 60px; height: 60px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #f09433, #bc1888); display: flex; align-items: center; justify-content: center; }
        .story img { width: 56px; height: 56px; border-radius: 50%; border: 2px solid black; }

        /* --- CONTENU CENTRAL --- */
        .main-content { height: 45vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .video-text { font-size: 38px; text-shadow: 0 0 20px var(--violet-c); text-align: center; }
        .user-info { position: fixed; bottom: 85px; left: 15px; }

        /* --- BADGE VIOLET --- */
        .badge { width: 16px; height: 16px; background: var(--violet-p); margin-left: 5px; clip-path: polygon(50% 0%, 53% 5%, 60% 3%, 63% 9%, 70% 8%, 73% 14%, 80% 15%, 82% 21%, 88% 23%, 89% 30%, 94% 33%, 94% 40%, 98% 45%, 96% 52%, 99% 59%, 95% 65%, 96% 72%, 91% 77%, 90% 84%, 84% 87%, 81% 93%, 74% 94%, 70% 99%, 63% 97%, 57% 100%, 50% 96%, 43% 100%, 37% 97%, 30% 99%, 26% 94%, 19% 93%, 16% 87%, 10% 84%, 9% 77%, 4% 72%, 5% 65%, 1% 59%, 4% 52%, 2% 45%, 6% 40%, 6% 33%, 11% 30%, 12% 23%, 18% 21%, 20% 15%, 27% 14%, 30% 8%, 37% 9%, 40% 3%, 47% 5%); display: inline-flex; align-items: center; justify-content: center; }
        .badge::after { content: '✓'; color: white; font-size: 9px; }

        /* --- ACTIONS LATÉRALES --- */
        .actions { position: fixed; right: 10px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .pfp-side { position: relative; cursor: pointer; }
        .pfp-side img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; }
        .plus-pink { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: var(--pink-tiktok); width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .btn-act { text-align: center; cursor: pointer; transition: 0.2s; }
        .btn-act:active { transform: scale(1.2); }
        .icon { font-size: 28px; }

        /* --- MODALS (INSCRIPTION & PROFIL) --- */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 5000; }
        .modal-card { background: white; color: black; width: 85%; max-width: 380px; border-radius: 20px; overflow: hidden; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Style spécifique Rejoindre */
        .modal-header { background: var(--violet-p); color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 20px; }
        .social-btn { display: flex; align-items: center; padding: 12px; margin: 10px 20px; border-radius: 10px; border: 1px solid #ddd; cursor: pointer; font-weight: 500; font-size: 14px; }
        .fb-btn { background: #1877F2; color: white; border: none; }

        /* Style Modification Profil */
        .edit-pfp-area { text-align: center; padding: 20px; }
        .edit-circle { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--violet-p); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .input-group { padding: 10px 20px; text-align: left; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-top: 5px; box-sizing: border-box; }

        /* --- NAV BASSE --- */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; height: 70px; background: black; display: flex; justify-content: space-around; align-items: center; border-top: 0.5px solid #222; }
        .nav-item { display: flex; flex-direction: column; align-items: center; opacity: 0.6; cursor: pointer; font-size: 10px; }
        .nav-item.active { opacity: 1; color: var(--violet-c); }
        .plus-center { background: linear-gradient(90deg, #ce85f2, #9c27b0); width: 45px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body onload="initApp()">

    <div class="header">
        <div class="top-row">
            <span style="font-size:20px;">📺</span>
            <div class="search-bar"><input type="text" placeholder="Rechercher..." id="searchField"></div>
            <span style="font-size:20px;">🔔</span>
        </div>
        <div class="tabs">
            <div class="tab" onclick="setTab(this)">Suivi</div>
            <div class="tab active" onclick="setTab(this)">Pour toi</div>
        </div>
    </div>

    <div class="stories" id="storyList">
        <div class="story"><div class="ring skeleton"></div><div class="skeleton" style="height:10px; margin-top:5px;"></div></div>
        <div class="story"><div class="ring skeleton"></div><div class="skeleton" style="height:10px; margin-top:5px;"></div></div>
    </div>

    <div class="main-content">
        <h1 class="video-text">zah zalaah ty aiiii</h1>
        <div class="user-info">
            <h3 style="display:flex; align-items:center; margin:0;"><span id="userName">Luther</span> <div class="badge"></div></h3>
            <p style="margin:5px 0; font-size:14px; opacity:0.8;">#LuthersFashion #2026 #Stylé</p>
        </div>
    </div>

    <div class="actions">
        <div class="pfp-side" onclick="openModal('editModal')">
            <img src="https://via.placeholder.com/50" id="currentPfp">
            <div class="plus-pink">+</div>
        </div>
        <div class="btn-act" onclick="animateHeart(this)"><div class="icon">🤍</div><div style="font-size:11px;">150.6K</div></div>
        <div class="btn-act" onclick="alert('Commentaires...')"><div class="icon">💬</div><div style="font-size:11px;">274</div></div>
        <div class="btn-act" onclick="openModal('shareModal')"><div class="icon">➥</div><div style="font-size:11px;">2570</div></div>
        <div style="width:40px; height:40px; border-radius:50%; background:black; border:8px solid #333; animation: rotate 3s linear infinite;"></div>
    </div>

    <div class="nav-bottom">
        <div class="nav-item active"><span>🏠</span><span>Accueil</span></div>
        <div class="nav-item"><span>🔍</span><span>Découvrir</span></div>
        <div class="plus-center" onclick="openModal('authModal')">+</div>
        <div class="nav-item"><span>👥</span><span>Amis</span></div>
        <div class="nav-item" onclick="openModal('editModal')"><span>👤</span><span>Profil</span></div>
    </div>

    <div id="authModal" class="overlay" onclick="closeModal(this)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">Rejoindre Luther's</div>
            <div class="social-btn" onclick="successAuth('Google')">🌐 Continuer avec Google</div>
            <div class="social-btn" onclick="successAuth('Apple')">🍎 Continuer avec Apple</div>
            <div class="social-btn fb-btn" onclick="successAuth('Facebook')">🔵 Continuer avec Facebook</div>
            <p onclick="closeModal(document.getElementById('authModal'))" style="text-align:center; color:gray; cursor:pointer;">Annuler</p>
        </div>
    </div>

    <div id="editModal" class="overlay" onclick="closeModal(this)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header" style="background:white; color:black; border-bottom:1px solid #eee;">Modifier le profil</div>
            <div class="edit-pfp-area">
                <div class="edit-circle" onclick="alert('Choisir une photo')">📷</div>
                <p style="font-size:12px; color:var(--violet-p);">Changer la photo</p>
            </div>
            <div class="input-group">
                <label style="font-size:12px; font-weight:bold;">NOM D'UTILISATEUR</label>
                <input type="text" id="newName" placeholder="Luther">
            </div>
            <div style="padding:20px;">
                <button onclick="saveProfile()" style="width:100%; padding:12px; background:var(--violet-p); color:white; border:none; border-radius:10px; font-weight:bold;">Enregistrer</button>
            </div>
        </div>
    </div>

    <div id="shareModal" class="overlay" onclick="closeModal(this)">
        <div class="modal-card" style="padding:20px;" onclick="event.stopPropagation()">
            <h3 style="text-align:center;">Partager</h3>
            <div style="display:flex; justify-content:space-around; padding:15px 0;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="40" onclick="alert('Lien envoyé sur WhatsApp')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Facebook_Messenger_logo_2020.svg" width="40" onclick="alert('Lien envoyé sur Messenger')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_2023.svg" width="40" onclick="alert('Lien envoyé sur Facebook')">
            </div>
            <button onclick="closeModal(document.getElementById('shareModal'))" style="width:100%; padding:10px; border:none; background:#eee; border-radius:8px;">Fermer</button>
        </div>
    </div>

    <script>
        function initApp() {
            // Simulation de chargement (Skeleton)
            setTimeout(() => {
                document.getElementById('storyList').innerHTML = `
                    <div class="story"><div class="ring" style="background:none; border:2px solid #555"><img src="https://via.placeholder.com/60"></div><p style="font-size:10px; margin-top:5px;">Ta story</p></div>
                    <div class="story"><div class="ring"><img src="https://via.placeholder.com/60/9c27b0/fff"></div><p style="font-size:10px; margin-top:5px;">Ami 1</p></div>
                    <div class="story"><div class="ring"><img src="https://via.placeholder.com/60/ce85f2/fff"></div><p style="font-size:10px; margin-top:5px;">Ami 2</p></div>
                `;
            }, 2000);
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(el) { el.style.display = 'none'; }

        function animateHeart(el) {
            let icon = el.querySelector('.icon');
            icon.innerText = icon.innerText === '🤍' ? '❤️' : '🤍';
            icon.style.color = icon.innerText === '❤️' ? 'var(--pink-tiktok)' : 'white';
        }

        function setTab(el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function successAuth(plat) {
            alert("Connecté avec succès via " + plat + " !");
            closeModal(document.getElementById('authModal'));
        }

        function saveProfile() {
            let val = document.getElementById('newName').value;
            if(val) document.getElementById('userName').innerText = val;
            alert("Profil mis à jour !");
            closeModal(document.getElementById('editModal'));
        }
    </script>
</body>
</html>
