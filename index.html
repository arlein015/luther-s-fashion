<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --cyan: #00d2ff; 
            --bg: #000; 
            --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%);
        }

        body { font-family: -apple-system, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Écran d'inscription Threndly */
        #auth-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo-te { font-size: 3rem; font-weight: bold; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .auth-input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; border-radius: 12px; width: 260px; margin-bottom: 15px; outline: none; text-align: center; }
        .btn-join { background: var(--grad); border: none; padding: 14px 40px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; }

        /* Header Certifié */
        header { padding: 15px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 5px; }
        .verified-badge { color: var(--cyan); font-size: 0.9rem; }
        .online-dot { color: #00ff88; font-size: 0.7rem; }

        /* Zone de Chat */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg-bubble { max-width: 80%; }
        .msg-user { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .msg-text { background: #1a1a1a; padding: 12px 16px; border-radius: 18px; border-bottom-left-radius: 2px; line-height: 1.4; }
        
        /* Tes messages (Admin/Moi) */
        .my-msg { align-self: flex-end; }
        .my-msg .msg-text { background: var(--grad); border-bottom-left-radius: 18px; border-bottom-right-radius: 2px; }
        .my-msg .msg-user { justify-content: flex-end; }

        /* Input area */
        #input-area { padding: 15px; background: #000; border-top: 1px solid #222; display: flex; gap: 10px; align-items: center; }
        #message-input { flex: 1; background: #1a1a1a; border: none; padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--grad); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="logo-te">Threndly</div>
    <p style="color: #666; margin-bottom: 20px;">Accès sécurisé ✅</p>
    <input type="text" id="pseudo" class="auth-input" placeholder="Pseudo de l'amie...">
    <button class="btn-join" onclick="login()">Se connecter</button>
</div>

<header>
    <div class="brand">Threndly <i class="fas fa-check-circle verified-badge"></i></div>
    <div class="online-dot" id="status">● 1 en ligne</div>
</header>

<div id="chat-box"></div>

<div id="input-area">
    <input type="text" id="message-input" placeholder="Message certifié..." onkeypress="if(event.key=='Enter')send()">
    <button class="send-btn" onclick="send()"><i class="fas fa-arrow-up"></i></button>
</div>

<script>
    // TA CONFIGURATION FIREBASE
    const firebaseConfig = {
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myUser = "";

    function login() {
        const name = document.getElementById('pseudo').value.trim();
        if(name) {
            myUser = name;
            document.getElementById('auth-screen').style.display = 'none';
            initChat();
        }
    }

    function send() {
        const input = document.getElementById('message-input');
        if(input.value.trim()){
            db.ref("messages").push({
                user: myUser,
                text: input.value,
                timestamp: Date.now()
            });
            input.value = "";
        }
    }

    function initChat() {
        // Écoute les messages (venant du CMD ou du mobile)
        db.ref("messages").limitToLast(50).on("child_added", snap => {
            const data = snap.val();
            const box = document.getElementById('chat-box');
            const isMe = data.user === myUser || data.user === "Admin-PC";
            
            const div = document.createElement('div');
            div.className = `msg-bubble ${isMe ? 'my-msg' : ''}`;
            div.innerHTML = `
                <div class="msg-user">@${data.user} <i class="fas fa-check-circle verified-badge"></i></div>
                <div class="msg-text">${data.text}</div>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });

        // Compteur en ligne
        const presence = db.ref('online_users').push(myUser);
        presence.onDisconnect().remove();
        db.ref('online_users').on('value', s => {
            document.getElementById('status').innerText = `● ${s.numChildren()} en ligne`;
        });
    }
</script>

</body>
</html>
