<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threndly ✅</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --cyan: #00d2ff; 
            --bg: #000000; 
            --grad: linear-gradient(135deg, #2D9CDB 0%, #BB6BD9 100%);
            --input-bg: #1A1A1A;
        }

        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Badge Bleu Certifié ✅ */
        .verified-badge { color: var(--cyan); font-size: 0.9rem; margin-left: 4px; }

        /* Écran d'inscription (Login) */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .logo-te { width: 80px; height: 80px; margin-bottom: 20px; }
        .btn-main { background: var(--grad); border: none; padding: 14px 35px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        input.auth-input { background: var(--input-bg); border: 1px solid #333; color: white; padding: 15px; border-radius: 12px; width: 280px; margin-bottom: 15px; outline: none; }

        /* Interface Principale */
        #app-interface { display: none; flex-direction: column; height: 100vh; }
        header { padding: 15px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .brand { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; }
        .online-status { font-size: 0.75rem; color: #00ff88; display: block; margin-top: 2px; }

        /* Panneau de Contrôle Social (Invitations) */
        #social-panel { background: #0A0A0A; border-bottom: 1px solid #222; max-height: 120px; overflow-y: auto; padding: 0 15px; }
        .request-card { background: #1A1A1A; padding: 10px; border-radius: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--cyan); }
        .btn-accept { color: var(--cyan); font-weight: bold; cursor: pointer; }

        /* Zone de Message */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message-bubble { max-width: 85%; }
        .user-tag { font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; margin-bottom: 4px; }
        .text-content { background: #111; padding: 12px 16px; border-radius: 18px; line-height: 1.4; display: inline-block; }
        .my-msg { align-self: flex-end; }
        .my-msg .text-content { background: var(--grad); }
        .my-msg .user-tag { justify-content: flex-end; }

        /* Input */
        #input-area { padding: 15px 20px; background: #000; display: flex; align-items: center; gap: 12px; border-top: 1px solid #222; }
        #msg-input { flex: 1; background: var(--input-bg); border: none; padding: 14px 20px; border-radius: 25px; color: white; outline: none; }
        .action-btn { background: var(--grad); border: none; width: 45px; height: 45px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-screen">
    <svg class="logo-te" viewBox="0 0 100 100">
        <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2D9CDB"/><stop offset="100%" style="stop-color:#BB6BD9"/></linearGradient></defs>
        <path d="M10,10 H90 V25 H55 V90 H35 V25 H10 Z" fill="url(#g)"/>
    </svg>
    <h1 style="margin-bottom: 5px;">Threndly <i class="fas fa-check-circle verified-badge"></i></h1>
    <p style="color:#777; margin-bottom: 25px;">Rejoignez la communauté certifiée</p>
    <input type="text" id="username-input" class="auth-input" placeholder="Choisissez votre pseudo...">
    <button class="btn-main" onclick="startApp()">S'inscrire</button>
</div>

<div id="app-interface">
    <header>
        <div>
            <div class="brand">@threndly <i class="fas fa-check-circle verified-badge"></i></div>
            <span class="online-status" id="count-display">● Chargement...</span>
        </div>
        <div style="display:flex; gap:15px;">
            <i class="fas fa-user-plus" style="cursor:pointer" onclick="sendInvite()"></i>
            <i class="fas fa-phone"></i>
        </div>
    </header>

    <div id="social-panel">
        <div id="requests-list"></div>
    </div>

    <div id="chat-container"></div>

    <div id="input-area">
        <i class="fas fa-plus" style="color:#555; font-size:1.2rem;"></i>
        <input type="text" id="msg-input" placeholder="Envoyer un message certifié..." onkeypress="if(event.key=='Enter')sendMsg()">
        <button class="action-btn" onclick="sendMsg()"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>

<script>
    // --- CONFIGURATION FIREBASE ---
    const firebaseConfig = {
        apiKey: "TON_API_KEY",
        databaseURL: "https://trendly-fca7c-default-rtdb.firebaseio.com",
        projectId: "trendly-fca7c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = "";

    // Lancement de l'app
    function startApp() {
        const input = document.getElementById('username-input').value.trim();
        if(input) {
            currentUser = input;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-interface').style.display = 'flex';
            setupPresence();
            listenMessages();
            listenRequests();
        }
    }

    // Compteur en ligne
    function setupPresence() {
        const presenceRef = db.ref('online_users').push(currentUser);
        presenceRef.onDisconnect().remove();
        db.ref('online_users').on('value', s => {
            document.getElementById('count-display').innerText = `● ${s.numChildren()} en ligne`;
        });
    }

    // Inviter un ami
    function sendInvite() {
        const target = prompt("Entrez le pseudo de l'ami à inviter :");
        if(target && target !== currentUser) {
            db.ref('requests/' + target).push({ from: currentUser });
            alert("Invitation envoyée !");
        }
    }

    // Écouter les invitations
    function listenRequests() {
        db.ref('requests/' + currentUser).on('child_added', s => {
            const r = s.val();
            const div = document.createElement('div');
            div.className = "request-card";
            div.id = s.key;
            div.innerHTML = `<span><strong>${r.from}</strong> veut vous parler</span><span class="btn-accept" onclick="acceptInvite('${r.from}', '${s.key}')">ACCEPTER</span>`;
            document.getElementById('requests-list').appendChild(div);
        });
    }

    function acceptInvite(name, key) {
        db.ref('requests/' + currentUser).child(key).remove();
        document.getElementById(key).remove();
        alert("Vous pouvez maintenant discuter avec " + name);
    }

    // Messages
    function sendMsg() {
        const input = document.getElementById('msg-input');
        if(input.value.trim()){
            db.ref("messages").push({
                user: currentUser,
                text: input.value,
                time: new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})
            });
            input.value = "";
        }
    }

    function listenMessages() {
        db.ref("messages").limitToLast(30).on("child_added", s => {
            const m = s.val();
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message-bubble ${m.user === currentUser ? 'my-msg' : ''}`;
            
            div.innerHTML = `
                <div class="user-tag">@${m.user} <i class="fas fa-check-circle verified-badge"></i></div>
                <div class="text-content">${m.text}</div>
            `;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        });
    }
</script>

</body>
</html>
