<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produit – Luther-S-Mode</title>
<meta id="metaDesc" name="description" content="Fiche produit Luther-S-Mode.">
<style>
  :root {
    --bg: #fafaf7; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --btn: #1d1d1b; --btn-text: #ffffff; --border: #e6e4dc; --ph: #eceae2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1e1e1c; --text: #f2f1ec; --muted: #a3a39b;
      --btn: #f2f1ec; --btn-text: #141413; --border: #34342f; --ph: #2a2a27;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .top, main { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
  .top { padding-top: 18px; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
  .back { color: var(--muted); font-size: .9rem; text-decoration: none; }
  .back:hover { color: var(--text); }
  .product { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 20px 0 32px; }
  @media (min-width: 760px) { .product { grid-template-columns: 1.1fr 1fr; gap: 40px; } }
  .gallery .main {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
    background: var(--ph); border: 1px solid var(--border); border-radius: 14px;
  }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .thumbs button {
    width: 64px; height: 64px; padding: 0; border: 2px solid var(--border);
    border-radius: 10px; overflow: hidden; background: var(--ph); cursor: pointer;
  }
  .thumbs button[aria-current="true"] { border-color: var(--text); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info h1 { font-size: clamp(1.5rem, 5vw, 2.2rem); line-height: 1.15; letter-spacing: -0.03em; }
  .cat { display: inline-block; margin-top: 8px; font-size: .82rem; color: var(--muted); text-decoration: none; }
  .cat:hover { color: var(--text); text-decoration: underline; }
  .price { font-size: 1.6rem; font-weight: 800; margin: 14px 0; }
  .desc { color: var(--muted); white-space: pre-line; }
  .actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: block; text-align: center; border: 0; cursor: pointer; font-size: 1rem; font-weight: 700;
    background: var(--btn); color: var(--btn-text); padding: 14px 18px; border-radius: 12px; text-decoration: none;
  }
  .btn.wa { background: #1fa855; color: #fff; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn:focus-visible, .thumbs button:focus-visible, .rel:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .note { margin-top: 14px; font-size: .8rem; color: var(--muted); }
  .related h2 { font-size: 1.2rem; margin: 8px 0 12px; }
  .rgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 40px; }
  @media (min-width: 760px) { .rgrid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  .rel {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    text-decoration: none; color: inherit; display: flex; flex-direction: column;
  }
  .rel:hover { border-color: var(--text); }
  .rel img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--ph); display: block; }
  .rel .body { padding: 10px 12px; }
  .rel h3 { font-size: .9rem; font-weight: 600; line-height: 1.3; }
  .rel .p { font-weight: 800; font-size: .9rem; margin-top: 2px; display: block; }
  .msg { text-align: center; padding: 60px 0; color: var(--muted); }
  footer { max-width: 1000px; margin: 0 auto; padding: 20px 16px 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="index.html" id="brand">Luther-S-Mode</a>
  <a class="back" href="catalogue.html">&larr; Catalogue</a>
</header>

<main id="root"><p class="msg">Chargement…</p></main>

<footer>&copy; <span id="year"></span> Luther-S-Mode</footer>

<script>
  /* ============ RÉGLAGES À MODIFIER ============ */
  const CONFIG = {
    brand: "Luther-S-Mode",
    currency: "Ar",              // ex. "Ar", "€", "$"
    whatsapp: "261XXXXXXXXX"     // ton numéro avec l'indicatif, sans + ni espaces (Madagascar = 261)
  };
  const TEXT = {
    order: "Commander sur WhatsApp",
    buy: "Acheter",
    back: "Retour au catalogue",
    related: "Dans la même catégorie",
    notFound: "Ce produit n'existe pas ou n'est plus disponible.",
    waMessage: function (title, url) {
      return "Bonjour, je souhaite commander : " + title + "\n" + url;
    },
    note: "Paiement et livraison à confirmer avec nous après ta commande."
  };
  /* ============================================= */

  const PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><rect width='100%' height='100%' fill='#d9d6cb'/></svg>"
  );
  const root = document.getElementById("root");

  function fmtPrice(n) {
    return typeof n === "number" ? new Intl.NumberFormat("fr-FR").format(n) + " " + CONFIG.currency : "";
  }
  function safeImg(el, src, alt) {
    el.src = src || PLACEHOLDER;
    el.alt = alt || "";
    el.onerror = function () { this.onerror = null; this.src = PLACEHOLDER; };
    return el;
  }
  function isHttp(u) { return /^https?:\/\//i.test(u || ""); }

  function showMessage(text) {
    root.replaceChildren();
    const p = document.createElement("p");
    p.className = "msg";
    p.textContent = text + " ";
    const a = document.createElement("a");
    a.href = "catalogue.html";
    a.textContent = TEXT.back;
    p.appendChild(a);
    root.appendChild(p);
  }

  function renderProduct(p, all) {
    document.title = p.title + " – " + CONFIG.brand;
    document.getElementById("metaDesc").setAttribute("content", (p.description || p.title).slice(0, 155));

    root.replaceChildren();
    const wrap = document.createElement("section");
    wrap.className = "product";

    /* Galerie */
    const images = (p.images && p.images.length) ? p.images : [p.image];
    const gallery = document.createElement("div");
    gallery.className = "gallery";
    const main = safeImg(document.createElement("img"), images[0], p.title);
    main.className = "main";
    gallery.appendChild(main);

    if (images.length > 1) {
      const thumbs = document.createElement("div");
      thumbs.className = "thumbs";
      images.forEach(function (src, i) {
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", "Photo " + (i + 1));
        b.setAttribute("aria-current", i === 0 ? "true" : "false");
        b.appendChild(safeImg(document.createElement("img"), src, ""));
        b.onclick = function () {
          main.src = src;
          Array.prototype.forEach.call(thumbs.children, function (c) { c.setAttribute("aria-current", "false"); });
          b.setAttribute("aria-current", "true");
        };
        thumbs.appendChild(b);
      });
      gallery.appendChild(thumbs);
    }

    /* Infos */
    const info = document.createElement("div");
    info.className = "info";

    const h1 = document.createElement("h1");
    h1.textContent = p.title;
    info.appendChild(h1);

    if (p.category) {
      const c = document.createElement("a");
      c.className = "cat";
      c.href = "catalogue.html?cat=" + encodeURIComponent(p.category);
      c.textContent = p.category;
      info.appendChild(c);
    }
    const price = fmtPrice(p.price);
    if (price) {
      const pr = document.createElement("p");
      pr.className = "price";
      pr.textContent = price;
      info.appendChild(pr);
    }
    if (p.description) {
      const d = document.createElement("p");
      d.className = "desc";
      d.textContent = p.description;
      info.appendChild(d);
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    const order = document.createElement("a");
    order.className = "btn";
    if (isHttp(p.link)) {
      order.href = p.link;
      order.target = "_blank";
      order.rel = "sponsored nofollow noopener";
      order.textContent = TEXT.buy;
    } else {
      order.className = "btn wa";
      order.href = "https://wa.me/" + CONFIG.whatsapp + "?text=" +
        encodeURIComponent(TEXT.waMessage(p.title, location.href));
      order.target = "_blank";
      order.rel = "noopener";
      order.textContent = TEXT.order;
    }
    actions.appendChild(order);

    const back = document.createElement("a");
    back.className = "btn ghost";
    back.href = "catalogue.html";
    back.textContent = TEXT.back;
    actions.appendChild(back);
    info.appendChild(actions);

    const note = document.createElement("p");
    note.className = "note";
    note.textContent = TEXT.note;
    info.appendChild(note);

    wrap.appendChild(gallery);
    wrap.appendChild(info);
    root.appendChild(wrap);

    /* Produits liés */
    const related = all.filter(function (x) { return x.id !== p.id && p.category && x.category === p.category; }).slice(0, 4);
    if (related.length) {
      const sec = document.createElement("section");
      sec.className = "related";
      const h2 = document.createElement("h2");
      h2.textContent = TEXT.related;
      sec.appendChild(h2);
      const g = document.createElement("div");
      g.className = "rgrid";
      related.forEach(function (x) {
        const a = document.createElement("a");
        a.className = "rel";
        a.href = "produit.html?id=" + encodeURIComponent(x.id);
        a.appendChild(safeImg(document.createElement("img"), x.image, x.title));
        const b = document.createElement("div");
        b.className = "body";
        const t = document.createElement("h3");
        t.textContent = x.title;
        b.appendChild(t);
        const xp = fmtPrice(x.price);
        if (xp) {
          const s = document.createElement("span");
          s.className = "p";
          s.textContent = xp;
          b.appendChild(s);
        }
        a.appendChild(b);
        g.appendChild(a);
      });
      sec.appendChild(g);
      root.appendChild(sec);
    }
  }

  function init() {
    document.getElementById("year").textContent = new Date().getFullYear();
    document.getElementById("brand").textContent = CONFIG.brand;

    const id = new URLSearchParams(location.search).get("id");
    if (!id) { showMessage(TEXT.notFound); return; }

    fetch("products.json", { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        const all = (Array.isArray(data) ? data : []).filter(function (p) { return p && p.id && p.title; });
        const p = all.find(function (x) { return x.id === id; });
        if (!p) { showMessage(TEXT.notFound); return; }
        renderProduct(p, all);
      })
      .catch(function () { showMessage("Impossible de charger le produit."); });
  }
  init();
</script>
</body>
</html>
